<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';document.head.appendChild(s)"></script>
<script>
/* =========================================================
   ДВИЖОК ИГРЫ «Честное Купеческое!» (работает только у хоста, DOM не трогает).
   S — публичное состояние (его получают все), H — тайное (колода, руки, содержимое лота).
   Любое действие игрока приходит в handle(pid, m) → меняет S/H → commit() рассылает всё.
   ========================================================= */
/*ENGINE-START*/
/* Полный экран: браузер разрешает его только по действию игрока, поэтому включаем при самом первом нажатии на странице (один раз) */
(function(){
  const d = document, root = d.documentElement;
  if (!root.requestFullscreen) return;
  const go = () => {
    removeEventListener('pointerdown', go, true);
    try { if (!d.fullscreenElement){ const r = root.requestFullscreen({navigationUI:'hide'}); if (r && r.catch) r.catch(() => {}); } } catch (e) {}
  };
  addEventListener('pointerdown', go, true);
})();
const VERSION = 'beta 0.9';

/* Числа из правил. Если что-то захочется подкрутить — это здесь. */
const RULES = {
  startCards: 6,         // стартовых карт (берёт сам игрок из колоды)
  startCoins: 20,        // стартовых монет (берёт сам игрок из Банка)
  morningCoins: 5,       // монет за утренний подвоз (и в последний день тоже)
  supplyCards: 2,        // карт за каждый подвоз (утром и вечером; в последний день карты не раздаются)
  firstDaySupply: false, // в 1-й день утреннего подвоза нет: игроки только что получили стартовые ресурсы (true — подвоз и в 1-й день)
  freeCard: 1,           // карта продавцу за проданный лот
  buyCost: 4, buyMax: 2, // докупка карт после продажи: цена и максимум
  askCost: 2,            // Расспрос
  openCost: 3,           // Вскрытие
  sealMin: 10,           // Печать купца: платишь последнюю ставку, но не меньше 10
  byPlayers: {           // игроков → ярмарочных дней
    2: {days: 5},        // тестовый режим (в правилах его нет)
    3: {days: 5},
    4: {days: 4},
    5: {days: 3}
  }
};
const DEN = [1, 5, 10];  // номиналы монет

const PRODUCTS = [
  {id:'cheese', name:'Сыр'}, {id:'bread', name:'Хлеб'}, {id:'apple', name:'Яблоки'},
  {id:'spice', name:'Пряности'}, {id:'silk', name:'Шёлк'}, {id:'banana', name:'Бананы'}
];
const PORD = PRODUCTS.map(p => p.id);
const prodName = id => PRODUCTS.find(p => p.id === id).name;

/* Карты: ключ → {name, kind, prod, n}. kind: simple/gentry/royal/spoiled — товары; rat/pest — Напасти; cat/auditor — помощники. */
const CARDS = {};
const defCard = (k, name, kind, prod, n) => { CARDS[k] = {k, name, kind, prod: prod || null, n}; };
[ // товар, [простой], [господский], [королевский], [испорченный], [вредитель]
  ['cheese', ['cheese','Сыр'],    ['gouda','Гауда'],         ['blue','Голубой сыр'],   ['wormy','Червивый сыр'],        ['pest_cheese','Сырный клещ']],
  ['bread',  ['bread','Хлеб'],    ['wheat','Пшеничный хлеб'],['rich','Сдобный хлеб'],  ['moldy','Заплесневелый хлеб'],  ['pest_bread','Амбарный долгоносик']],
  ['apple',  ['apple','Яблоки'],  ['green','Зелёные яблоки'],['gold','Золотые яблоки'],['rotten','Гнилые яблоки'],      ['pest_apple','Яблонная плодожорка']],
  ['spice',  ['pepper','Перец'],  ['cinnamon','Корица'],     ['saffron','Шафран'],      ['damp','Отсыревшие пряности'],  ['pest_spice','Жук-точильщик']],
  ['silk',   ['silk','Шёлк'],     ['wild','Дикий шёлк'],     ['spider','Паучий шёлк'],  ['soaked','Мочёный шёлк'],       ['pest_silk','Платяная моль']],
  ['banana', ['banana','Банан'],  ['cavendish','Кавендиш'],  ['gros','Гро Мишель'],     ['black','Чёрные бананы'],       ['pest_banana','Панамская болезнь']]
].forEach(([prod, s, g, r, sp, pe]) => {
  defCard(s[0], s[1], 'simple', prod, 10);
  defCard(g[0], g[1], 'gentry', prod, 2);
  defCard(r[0], r[1], 'royal', prod, 1);
  defCard(sp[0], sp[1], 'spoiled', prod, 4);
  defCard(pe[0], pe[1], 'pest', prod, 1);
});
defCard('rat', 'Крыса', 'rat', null, 4);
defCard('cat', 'Кот', 'cat', null, 5);
defCard('auditor', 'Ревизор', 'auditor', null, 5);
const DECK_SIZE = Object.values(CARDS).reduce((a, c) => a + c.n, 0);   // 122

const isGood = c => { const k = CARDS[c.k].kind; return k === 'simple' || k === 'gentry' || k === 'royal' || k === 'spoiled'; };
const isNap  = c => { const k = CARDS[c.k].kind; return k === 'rat' || k === 'pest'; };
const RANK = {simple:0, gentry:1, royal:2, spoiled:3};
const SORT_SPECIAL = {rat:0, pest:1, cat:2, auditor:3};
const sortKey = c => { const d = CARDS[c.k]; return d.kind in RANK ? PORD.indexOf(d.prod) * 10 + RANK[d.kind] : 100 + SORT_SPECIAL[d.kind] * 10 + (d.prod ? PORD.indexOf(d.prod) : 0); };

function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makeDeck(){
  const d = []; let id = 1;
  Object.values(CARDS).forEach(c => { for (let i = 0; i < c.n; i++) d.push({id: id++, k: c.k}); });
  return shuffle(d);
}

/* ---------- подсчёт очков ---------- */
const tri = n => n * (n + 1) / 2;       // 1, 3, 6, 10, 15, 21, 28, 36, 45, 55
function partyStats(cards, prod){
  let s = 0, c = 0, g = 0, r = 0;
  cards.forEach(x => {
    const d = CARDS[x.k]; if (d.prod !== prod) return;
    if (d.kind === 'simple') s++; else if (d.kind === 'spoiled') c++; else if (d.kind === 'gentry') g++; else if (d.kind === 'royal') r++;
  });
  const n = Math.max(0, s - c), base = tri(n), mult = Math.pow(2, g) * Math.pow(3, r);
  return {prod, s, c, g, r, n, base, mult, value: base * mult, size: s + c + g + r};
}

/* ---------- состояния ---------- */
const HOOK = {broadcast(){}, hand(id, cards, newIds){}, peek(id, data){}};   // сюда подключается сеть
const newState = () => ({phase:'lobby', players:[], log:[], gid:0, seq:0, evts:[], deckN:0, discN:0, discTop:null, disc:[],
  day:0, days:0, round:'m', starost:null, seller:null, step:null, turn:null, lot:null, auction:null, info:null, final:null, notice:'',
  todo:null, takeTitle:'', pay:null, tell:null, placing:null});
const newH = () => ({seen:{}, peekLast:{}, deck:[], discard:[], hands:{}, sentIds:{}, peeks:[], lotCards:[], lotNo:0, insp:null, auc:null, res:null, turns:0, next:null, bought:0, got:[]});
const mkPlayer = (id, name, host) => ({id, name, host: !!host, count:0, coins:0, purse:{1:0, 5:0, 10:0}, seal:0, selN:0});   // seal: 0 — не взята, 1 — у игрока, 2 — использована
let S = newState();
let H = newH();

const pl = id => S.players.find(p => p.id === id);
const hand = id => H.hands[id] || (H.hands[id] = []);
const cnt = (id, f) => hand(id).filter(f).length;
const idxOf = id => S.players.findIndex(p => p.id === id);
const leftOf = id => S.players[(idxOf(id) + 1) % S.players.length].id;
function orderFrom(startId, skipFirst){          // по часовой, начиная со startId (порядок игроков = порядок за столом)
  const n = S.players.length, s = idxOf(startId), out = [];
  for (let k = 0; k < n; k++) out.push(S.players[(s + k) % n].id);
  return skipFirst ? out.slice(1) : out;
}
const sortHand = id => hand(id).sort((a, b) => sortKey(a) - sortKey(b) || a.id - b.id);
const hasAuditor = id => hand(id).some(c => c.k === 'auditor');
const cname = c => CARDS[c.k].name;

const CHAT_COL = ['#ff8a8a', '#6fd3ff', '#7be28f', '#ffd23f', '#d79bff'];     // цвета игроков в чате
function addLog(s){ S.log.push({c:0, s}); if (S.log.length > 80) S.log.splice(0, S.log.length - 80); }
function addChat(name, s){ S.log.push({c:1, n:name, s, ci: Math.max(0, S.players.findIndex(x => x.name === name))}); if (S.log.length > 80) S.log.splice(0, S.log.length - 80); }
function emit(type, o){ S.evts.push(Object.assign({seq: ++S.seq, type}, o || {})); }
function peek(to, data){ H.peeks.push({to, data}); if (H.peekLast) H.peekLast[to] = data; }
function note(s){ emit('note', {s}); }

/* ---------- монеты ---------- */
const sync = p => { p.coins = p.purse[1] + 5 * p.purse[5] + 10 * p.purse[10]; };
const coinSum = c => c[1] + 5 * c[5] + 10 * c[10];
const coinText = c => DEN.filter(d => c[d]).map(d => c[d] + '×' + d).join(' + ') || '0';
/* Забрать у игрока ровно amount монет именно теми монетами, которые он выбрал. Возвращает набор монет или null. */
function takeOut(p, coins, amount){
  if (!coins || typeof coins !== 'object') return null;
  const c = {}; let sum = 0;
  for (const d of DEN){
    const n = Number(coins[d] || 0);
    if (!Number.isInteger(n) || n < 0 || n > p.purse[d]) return null;
    c[d] = n; sum += n * d;
  }
  if (sum !== amount) return null;
  DEN.forEach(d => { p.purse[d] -= c[d]; }); sync(p);
  return c;
}
/* подбор монет под точную сумму из кошелька */
function findExact(pu, amt){
  let best = null;
  for (let a = 0; a <= Math.min(pu[10], Math.floor(amt / 10)); a++)
    for (let b = 0; b <= Math.min(pu[5], Math.floor((amt - 10 * a) / 5)); b++){
      const r = amt - 10 * a - 5 * b; if (r > pu[1]) continue;
      const n = a + b + r; if (!best || n < best.n) best = {n, 1: r, 5: b, 10: a};
    }
  return best && {1: best[1], 5: best[5], 10: best[10]};
}
/* платёж на точную сумму; если ровно не набирается — Банк сам разменивает (бесплатно) */
function payExact(p, amt){
  for (let g = 0; g < 40 && !findExact(p.purse, amt); g++){
    if (p.purse[5] > 0){ p.purse[5]--; p.purse[1] += 5; }
    else if (p.purse[10] > 0){ p.purse[10]--; p.purse[5] += 2; }
    else break;
  }
  const f = findExact(p.purse, amt);
  return f ? takeOut(p, f, amt) : null;
}
function putIn(p, c){ DEN.forEach(d => { p.purse[d] += c[d]; }); sync(p); }
function doChange(pid, m){          // размен монет с Банком (всегда бесплатный, сумма не меняется)
  const u = pl(pid).purse;
  if (m.op === 'b10' && u[10] > 0){ u[10]--; u[5] += 2; }
  else if (m.op === 'b5' && u[5] > 0){ u[5]--; u[1] += 5; }
  else if (m.op === 'm1' && u[1] >= 5){ u[1] -= 5; u[5]++; }
  else if (m.op === 'm5' && u[5] >= 2){ u[5] -= 2; u[10]++; }
  else return;
  sync(pl(pid));
}

/* Разослать всё: сначала руки и тайные подсказки, потом общее состояние. */
let NETVER = 0;                  // растёт с каждым снимком состояния: по нему игроки замечают потерянные сообщения
function commit(){
  S.ver = ++NETVER;
  S.players.forEach(p => { p.count = hand(p.id).length; sync(p); });
  S.deckN = H.deck.length; S.discN = H.discard.length;
  S.disc = H.discard.map(c => c.k);
  const top = H.discard[H.discard.length - 1]; S.discTop = top ? top.k : null;
  S.players.forEach(p => {
    const h = hand(p.id), prev = H.sentIds[p.id], sig = h.map(c => c.id).join(',');
    if (prev && prev.sig === sig) return;
    const old = new Set(prev ? prev.ids : []);
    const newIds = prev ? h.filter(c => !old.has(c.id)).map(c => c.id) : [];
    H.sentIds[p.id] = {sig, ids: h.map(c => c.id)};
    HOOK.hand(p.id, h.map(c => ({id: c.id, k: c.k})), newIds);
  });
  H.peeks.splice(0).forEach(x => HOOK.peek(x.to, x.data));
  HOOK.broadcast();
}

/* ---------- «берём сами»: карты, монеты и Печать игроки берут руками ----------
   todo[id] = {t: сколько всего надо взять, l: сколько ещё осталось}. Когда у всех «осталось» = 0 — игра идёт дальше (H.next). */
function setTodo(map, next, title){
  S.todo = {};
  Object.keys(map).forEach(id => {
    const t = Object.assign({cards:0, coins:0, seal:0}, map[id]);
    S.todo[id] = {t, l: Object.assign({}, t)};
  });
  S.step = 'take'; S.turn = null; S.takeTitle = title; S.info = null; H.next = next;
  checkTodo();
}
function checkTodo(){
  if (S.step !== 'take' || !S.todo) return;
  if (!H.deck.length){
    let lost = false;
    Object.values(S.todo).forEach(x => { if (x.l.cards > 0){ x.l.cards = 0; lost = true; } });
    if (lost) addLog('Колода закончилась — карт больше нет');
  }
  const open = Object.values(S.todo).some(x => x.l.cards > 0 || x.l.coins > 0 || x.l.seal > 0);
  if (open) return;
  S.todo = null;
  const f = H.next; H.next = null;
  if (f) f();
}
function doTake(pid, m){
  if (S.step !== 'take' || !S.todo || !S.todo[pid]) return;
  const t = S.todo[pid].l, p = pl(pid);
  if (m.what === 'card'){
    if (t.cards > 0 && H.deck.length){ hand(pid).push(H.deck.pop()); t.cards--; sortHand(pid); emit('draw', {by: pid, n: 1}); }
  } else if (m.what === 'coin'){
    const d = Number(m.d);
    if (DEN.includes(d) && t.coins >= d){ p.purse[d]++; t.coins -= d; sync(p); emit('coins', {from:'bank', to:pid, c:{1:d === 1 ? 1 : 0, 5:d === 5 ? 1 : 0, 10:d === 10 ? 1 : 0}}); }
  } else if (m.what === 'coinsAuto'){        // удобство: добрать весь остаток монетами покрупнее
    if (t.coins > 0){
      const c = {1:0, 5:0, 10:0}; let r = t.coins;
      c[10] = Math.floor(r / 10); r -= c[10] * 10; c[5] = Math.floor(r / 5); r -= c[5] * 5; c[1] = r;
      putIn(p, c); t.coins = 0; emit('coins', {from:'bank', to:pid, c});
    }
  } else if (m.what === 'seal'){
    if (t.seal > 0){ p.seal = 1; t.seal = 0; emit('sealtake', {by: pid}); }
  }
  checkTodo();
}

/* ---------- ход игры: день → подвоз → круг продавцов ---------- */
function startGame(){
  const n = S.players.length, cfg = RULES.byPlayers[n];
  if (!cfg) return false;
  const gid = S.gid + 1;
  H = newH();
  S.phase = 'game'; S.gid = gid; S.seq = 0; S.evts = []; S.log = []; S.final = null; S.notice = '';
  S.lot = null; S.tell = null; S.placing = null; S.auction = null; S.info = null; S.step = null; S.turn = null; S.pay = null; S.todo = null;
  H.deck = makeDeck();
  S.players.forEach(p => { H.hands[p.id] = []; p.purse = {1:0, 5:0, 10:0}; p.seal = 0; p.selN = 0; sync(p); });
  S.days = cfg.days; S.day = 1; S.round = 'm';
  S.starost = S.players[Math.random() * n | 0].id;
  const m = {}; S.players.forEach(p => { m[p.id] = {cards: RULES.startCards, coins: RULES.startCoins, seal: 1}; });
  setTodo(m, beginDay, 'Раздача');
  return true;
}

function beginDay(){
  const last = S.day === S.days, first = S.day === 1;
  S.round = 'm';
  if (first && !RULES.firstDaySupply) return beginRound();
  const m = {}; S.players.forEach(p => { m[p.id] = {cards: last ? 0 : RULES.supplyCards, coins: RULES.morningCoins}; });
  setTodo(m, beginRound, 'Утренний подвоз');
}
function beginRound(){
  if (H.tut){                                  // обучение: вечерних торгов нет, после утра второго дня игра останавливается
    if (S.round === 'e'){ H.tut.next = endRound; S.step = null; S.turn = null; return; }       // обучение: утро наступит, когда Лавр договорит
    if (S.day >= 2){ S.step = 'tutend'; S.turn = null; S.seller = null; return; }
  }
  H.turns = 0; nextSeller();
}
function nextSeller(){
  if (H.turns >= S.players.length) return endRound();
  const sid = orderFrom(S.starost)[H.turns++];
  S.lot = null; S.tell = null; S.placing = null; S.auction = null; S.info = null; S.pay = null; H.lotCards = [];
  if (hand(sid).length < 3){
    return nextSeller();
  }
  S.seller = sid; S.step = 'compose'; S.turn = sid; S.tell = null; S.placing = null;
}
function endRound(){
  const last = S.day === S.days;
  if (S.round === 'm'){
    S.round = 'e';
    if (!last){
      const m = {}; S.players.forEach(p => { m[p.id] = {cards: RULES.supplyCards}; });
      const go = () => setTodo(m, beginRound, 'Вечерний подвоз');
      if (H.tut){ H.tut.eve = go; S.step = null; S.turn = null; return; }          // обучение: подвоз начнётся, когда Лавр договорит
      return go();
    }
    beginRound();
  } else {
    if (last) return finishGame();
    S.day++; S.starost = leftOf(S.starost);
    beginDay();
  }
}

/* ---------- торговый ход ---------- */
function doLot(pid, m){
  if (S.step !== 'compose' || S.turn !== pid) return;
  const ids = m.ids;
  if (!Array.isArray(ids) || ids.length !== 3 || new Set(ids).size !== 3) return;
  /* Цена теперь называется отдельным шагом (doPrice) — чтобы продавец успел рассказать о товаре.
     Если цена пришла сразу (боты, обучение) — шаг цены пропускаем. */
  let price = null;
  if (m.price != null){ price = Math.floor(Number(m.price)); if (!(price >= 1) || price > 9999) return; }
  const h = hand(pid), cards = ids.map(id => h.find(c => c.id === id));
  if (cards.some(c => !c)) return;
  H.hands[pid] = h.filter(c => !ids.includes(c.id));
  H.lotCards = cards;
  S.lot = {n: ++H.lotNo, price, cards: [{open:false}, {open:false}, {open:false}], opened: false, qa: []};
  pl(pid).selN = 0; S.placing = null;
  emit('lot', {by: pid});
  peek(pid, {lot: S.lot.n, own: true, cards: cards.map(c => c.k)});
  S.turn = pid;
  if (price == null){ S.step = 'price'; S.tell = {by: pid, st: 'lot'}; }       // карты выложены → «Расскажите о своём товаре»
  else { S.step = 'showcase'; S.tell = {by: pid, st: 'price'}; emit('price', {by: pid, price}); }
}
function doPrice(pid, m){
  if (S.step !== 'price' || S.turn !== pid || !S.lot || S.lot.price != null) return;
  const price = Math.floor(Number(m.price));
  if (!(price >= 1) || price > 9999) return;
  S.lot.price = price;
  S.step = 'showcase'; S.turn = pid; S.tell = {by: pid, st: 'price'};            // цена названа → снова «Расскажите о своём товаре»
  emit('price', {by: pid, price});                                                  // всем: число выезжает по центру
}
function reveal(i){ S.lot.cards[i] = {open: true, k: H.lotCards[i].k}; }

function doShowcase(pid, m){
  if (S.step !== 'showcase' || S.turn !== pid) return;
  const i = m.i;
  if (i !== -1 && !(i >= 0 && i < 3 && !S.lot.cards[i].open)) return;
  if (i !== -1) reveal(i);
  startInspection();
  S.tell = (S.step === 'inspect') ? {by: pid, st: 'showcase'} : null;           // витрина открыта (или нет) → «Расскажите о своём товаре»
}

/* ---------- Расспрос: вопросы выбираются из списка, ответ вычисляет сама игра по картам лота ---------- */
const PK = {};    // товар → вид → ключ карты
Object.values(CARDS).forEach(d => { if (d.prod && d.kind in RANK) (PK[d.prod] = PK[d.prod] || {})[d.kind] = d.k; });
const PEST_OF = {}; Object.values(CARDS).forEach(d => { if (d.kind === 'pest') PEST_OF[d.prod] = d.k; });
const Q_KINDS = ['simple', 'gentry', 'royal', 'spoiled', 'fancy'];
/* Разбор вопроса из сообщения: оставляем только разрешённые поля; null — такого вопроса нет */
function cleanQ(q){
  if (!q || typeof q !== 'object') return null;
  const t = q.t, o = {t};
  const okP = p => PORD.includes(p), okK = k => Q_KINDS.includes(k);
  switch (t){
    case 'nap': case 'rat': case 'same3': case 'pair': case 'plain': case 'clean': return o;
    case 'pest': if (q.p !== undefined){ if (!okP(q.p)) return null; o.p = q.p; } return o;
    case 'good':
      if (q.p !== undefined){ if (!okP(q.p)) return null; o.p = q.p; }
      if (q.kind !== undefined){ if (!okK(q.kind)) return null; o.kind = q.kind; }
      return o;
    case 'help': if (q.k !== undefined){ if (q.k !== 'cat' && q.k !== 'auditor') return null; o.k = q.k; } return o;
    case 'min': if ((q.c !== 'nap' && q.c !== 'spoiled') || q.n !== 2) return null; o.c = q.c; o.n = 2; return o;
  }
  return null;
}
/* Истина ли вопрос про лот из трёх карт (ks — ключи карт) */
function evalQ(q, ks){
  const cs = ks.map(k => CARDS[k]), good = d => d.kind in RANK;
  const goods = cs.filter(good), byProd = {};
  goods.forEach(d => { byProd[d.prod] = (byProd[d.prod] || 0) + 1; });
  switch (q.t){
    case 'nap':  return cs.some(d => d.kind === 'rat' || d.kind === 'pest');
    case 'rat':  return cs.some(d => d.kind === 'rat');
    case 'pest': return cs.some(d => d.kind === 'pest' && (!q.p || d.prod === q.p));
    case 'good': return cs.some(d => good(d) && (!q.p || d.prod === q.p) && (!q.kind || (q.kind === 'fancy' ? (d.kind === 'gentry' || d.kind === 'royal') : d.kind === q.kind)));
    case 'help': return cs.some(d => (d.kind === 'cat' || d.kind === 'auditor') && (!q.k || d.kind === q.k));
    case 'min':  return cs.filter(d => q.c === 'nap' ? (d.kind === 'rat' || d.kind === 'pest') : d.kind === 'spoiled').length >= q.n;
    case 'same3': return goods.length === 3 && Object.keys(byProd).length === 1;
    case 'pair':  return Object.values(byProd).some(n => n >= 2);
    case 'plain': return cs.every(d => d.kind === 'simple');
    case 'clean': return cs.every(d => d.kind !== 'rat' && d.kind !== 'pest' && d.kind !== 'spoiled');
  }
  return false;
}
const KIND_RU = {simple:'простой', gentry:'господский', royal:'королевский', spoiled:'испорченный'};
function qText(q){
  switch (q.t){
    case 'nap':  return 'В лоте есть Напасть?';
    case 'rat':  return 'В лоте есть Крыса?';
    case 'pest': return q.p ? 'В лоте есть ' + CARDS[PEST_OF[q.p]].name + '?' : 'В лоте есть Вредитель?';
    case 'good':
      if (q.p && q.kind && q.kind !== 'fancy') return 'В лоте есть ' + CARDS[PK[q.p][q.kind]].name + ' (' + KIND_RU[q.kind] + ')?';
      if (q.p) return 'В лоте есть ' + prodName(q.p) + ' (любой вид)?';
      if (q.kind === 'spoiled') return 'В лоте есть испорченный товар?';
      if (q.kind === 'fancy') return 'В лоте есть господский или королевский товар?';
      return 'В лоте есть ' + KIND_RU[q.kind] + ' товар?';
    case 'help': return q.k === 'cat' ? 'В лоте есть Кот?' : q.k === 'auditor' ? 'В лоте есть Ревизор?' : 'В лоте есть Кот или Ревизор?';
    case 'min':  return q.c === 'nap' ? 'В лоте две или три Напасти?' : 'В лоте две или три испорченные карты?';
    case 'same3': return 'Все три карты лота — товар одного вида?';
    case 'pair':  return 'В лоте есть две карты одного товара?';
    case 'plain': return 'В лоте только простые товары?';
    case 'clean': return 'В лоте нет ни Напастей, ни испорченных карт?';
  }
  return '';
}
/* Дерево выбора вопроса: направление → уточнение → ещё уточнение. node = {label, sub?, q?, kids?}; q — вопрос «оставить так» */
function qTree(){
  const kindKids = (p, kinds) => kinds.map(k => ({label: CARDS[PK[p][k]].name, sub: KIND_RU[k], q: {t:'good', p, kind:k}}));
  const prodKids = kind => PRODUCTS.map(pr => ({label: kind === 'simple' ? prodName(pr.id) : CARDS[PK[pr.id][kind]].name, sub: kind === 'simple' ? '' : prodName(pr.id), q: {t:'good', p: pr.id, kind}}));
  return [
    {label: 'Напасть', q: {t:'nap'}, kids: [
      {label: 'Крыса', q: {t:'rat'}},
      {label: 'Вредитель', q: {t:'pest'}, kids: PRODUCTS.map(pr => ({label: CARDS[PEST_OF[pr.id]].name, sub: prodName(pr.id), q: {t:'pest', p: pr.id}}))},
      {label: 'Две Напасти', q: {t:'min', c:'nap', n:2}}
    ]},
    {label: 'Испорченный', q: {t:'good', kind:'spoiled'}, kids: prodKids('spoiled').concat([{label: 'Два испорченных', q: {t:'min', c:'spoiled', n:2}}])},
    {label: 'Особый товар', q: {t:'good', kind:'fancy'}, kids: [
      {label: 'Господский', q: {t:'good', kind:'gentry'}, kids: prodKids('gentry')},
      {label: 'Королевский', q: {t:'good', kind:'royal'}, kids: prodKids('royal')}
    ]},
    {label: 'Конкретный товар', kids: PRODUCTS.map(pr => ({label: pr.name, q: {t:'good', p: pr.id}, kids: kindKids(pr.id, ['simple', 'gentry', 'royal', 'spoiled'])}))},
    {label: 'Помощник', q: {t:'help'}, kids: [{label: 'Кот', q: {t:'help', k:'cat'}}, {label: 'Ревизор', q: {t:'help', k:'auditor'}}]},
    {label: 'Состав лота', kids: [
      {label: 'Одинаковый товар', sub: 'все три', q: {t:'same3'}},
      {label: 'Есть пара', sub: 'два одного товара', q: {t:'pair'}},
      {label: 'Только простые', q: {t:'plain'}},
      {label: 'Без Напастей и порчи', q: {t:'clean'}}
    ]}
  ];
}

/* осмотр: каждый покупатель по очереди (слева от продавца) — одно действие или пропуск */
function startInspection(){ H.insp = {order: orderFrom(S.seller, true), pos: 0}; nextInspector(); }
const canInspect = id => pl(id).coins >= RULES.askCost || hasAuditor(id);
function nextInspector(){
  const I = H.insp;
  while (I.pos < I.order.length && !canInspect(I.order[I.pos])) I.pos++;
  if (I.pos >= I.order.length) return startAuction();
  S.step = 'inspect'; S.turn = I.order[I.pos]; S.info = null;
}
function doInsp(pid, m){
  if (S.step !== 'inspect' || S.turn !== pid) return;
  S.tell = null;
  const p = pl(pid), I = H.insp;
  if (m.a === 'skip'){ I.pos++; return nextInspector(); }
  if (m.a === 'ask'){
    const qq = cleanQ(m.qq);
    if (!qq || p.coins < RULES.askCost) return;
    const q = qText(qq);
    const c = takeOut(p, m.coins, RULES.askCost); if (!c) return;
    putIn(pl(S.seller), c); emit('coins', {from: pid, to: S.seller, c});
    S.step = 'answer'; S.turn = S.seller; S.info = {by: pid, q, qq};
    peek(S.seller, {lot: S.lot.n, own: true, cards: H.lotCards.map(c => c.k)});      // продавцу — состав его лота (для кнопки ответа)
    return;
  }
  if (m.a === 'open'){          // шаг 1: оплата (монеты уходят продавцу), шаг 2 — выбор карты (doOpenPick)
    if (p.coins < RULES.openCost || S.lot.opened || !S.lot.cards.some(c => !c.open)) return;
    const c = takeOut(p, m.coins, RULES.openCost); if (!c) return;
    putIn(pl(S.seller), c); emit('coins', {from: pid, to: S.seller, c});
    S.lot.opened = true;
    S.step = 'openpick'; S.turn = pid;
    return;
  }
  if (m.a === 'auditor'){
    const h = hand(pid), ix = h.findIndex(c => c.id === m.id && c.k === 'auditor');
    if (ix < 0) return;
    H.discard.push(h.splice(ix, 1)[0]);
    peek(pid, {lot: S.lot.n, own: false, cards: H.lotCards.map(c => c.k)});
    I.pos++; return nextInspector();
  }
}
function doOpenPick(pid, m){
  if (S.step !== 'openpick' || S.turn !== pid) return;
  const i = m.i;
  if (!(i >= 0 && i < 3) || S.lot.cards[i].open) return;
  reveal(i);
  if (!H.tut) H.insp.pos++;
  nextInspector();
}
function doAnswer(pid, m){
  if (S.step !== 'answer' || S.turn !== pid) return;
  const by = pl(S.info.by);
  const yes = evalQ(S.info.qq, H.lotCards.map(c => c.k));      // ответ считает игра по картам лота — продавец только подтверждает
  S.lot.qa.push({by: by.name, q: S.info.q, a: yes ? 'Да' : 'Нет'});
  emit('answer', {by: by.id, yes});
  addLog('Расспрос — ' + by.name + ': «' + S.info.q + '» — ' + (yes ? 'ДА' : 'НЕТ'));
  if (!H.tut) H.insp.pos++;                    // в обучении после ответа игрок снова выбирает действие осмотра
  S.info = null;
  nextInspector();
}

/* торги */
const minBid = () => S.auction.by === null ? S.lot.price : S.auction.high + 1;
function startAuction(){
  H.auc = {order: orderFrom(S.seller, true), i: -1};
  S.auction = {high: 0, by: null, passed: [], stakes: {}};
  S.step = 'auction'; S.info = null;
  aucNext();
}
function aucNext(){
  const A = S.auction, O = H.auc.order;
  for (;;){
    const active = O.filter(id => !A.passed.includes(id));
    if (A.by !== null && active.every(id => id === A.by)) return sold(A.by, A.high);
    if (A.by === null && !active.length) return unsold();
    let k = H.auc.i, found = null;
    for (let t = 0; t < O.length; t++){ k = (k + 1) % O.length; if (!A.passed.includes(O[k])){ found = O[k]; break; } }
    if (found === null || found === A.by) return A.by !== null ? sold(A.by, A.high) : unsold();
    H.auc.i = k;
    if (pl(found).coins < minBid()){ A.passed.push(found); delete A.stakes[found]; continue; }
    S.turn = found; return;
  }
}
function doBid(pid, m){
  if (S.step !== 'auction' || S.turn !== pid) return;
  const amt = Math.floor(Number(m.amount));
  if (!(amt >= minBid()) || amt > pl(pid).coins) return;
  /* какими монетами игрок выложил ставку (только для показа на столе; сами монеты остаются у него до оплаты) */
  let stake = null;
  if (m.coins && typeof m.coins === 'object'){
    const c = {}; let sum = 0, ok = true;
    DEN.forEach(d => { const n = Number(m.coins[d] || 0); if (!Number.isInteger(n) || n < 0 || n > pl(pid).purse[d]) ok = false; else { c[d] = n; sum += n * d; } });
    if (ok && sum === amt) stake = c;
  }
  if (!stake){ let r = amt; stake = {10: Math.floor(r / 10)}; r -= stake[10] * 10; stake[5] = Math.floor(r / 5); stake[1] = r - stake[5] * 5; }
  S.auction.high = amt; S.auction.by = pid; S.auction.stakes[pid] = stake;   // у каждого торгующего его ставка лежит на столе, пока он не спасует
  aucNext();
}
function doPass(pid){
  if (S.step !== 'auction' || S.turn !== pid) return;
  S.auction.passed.push(pid); delete S.auction.stakes[pid];
  aucNext();
}
/* Печать купца: после первой ставки любой покупатель (не спасовавший) говорит «Продано!». Платит последнюю ставку, но не меньше 10. */
const sealPrice = () => Math.max(S.auction.high, RULES.sealMin);
function doSeal(pid){
  const A = S.auction;
  if (S.step !== 'auction' || pid === S.seller || A.by === null || A.passed.includes(pid) || !H.auc.order.includes(pid)) return;
  const p = pl(pid), price = sealPrice();
  if (p.seal !== 1 || p.coins < price) return;
  p.seal = 2;
  addLog('Лот продан: ' + p.name + ' (Печать купца) купил у ' + pl(S.seller).name + ' за ' + price);
  emit('seal', {by: pid, name: p.name, amount: price});
  sold(pid, price);
  /* по Печати ставка сама доходит до 10: деньги сразу уходят продавцу, покупатель только забирает карты лота */
  const s = pl(S.pay.to), c = payExact(p, price); if (!c) return;
  putIn(s, c); emit('coins', {from: pid, to: s.id, c});
  S.pay = null; S.step = 'takelot'; S.turn = pid;
}

/* развязка: лот продан → покупатель платит → забирает лот → Напасти → карта продавцу и докупка */
function sold(bid, price){
  S.auction = null; S.info = null;
  S.pay = {amount: price, to: S.seller};
  S.step = 'pay'; S.turn = bid; H.buyer = bid;
  addLog('Лот продан: ' + pl(bid).name + ' купил у ' + pl(S.seller).name + ' за ' + price);
}
function doPay(pid, m){
  if (S.step !== 'pay' || S.turn !== pid) return;
  const p = pl(pid), s = pl(S.pay.to);
  const c = takeOut(p, m.coins, S.pay.amount); if (!c) return;
  putIn(s, c); emit('coins', {from: pid, to: s.id, c});
  S.pay = null; S.step = 'takelot'; S.turn = pid;
}
function doTakeLot(pid, m){          // покупатель забирает лот по одной карте: по клику на каждую карту на столе
  if (S.step !== 'takelot' || S.turn !== pid) return;
  const i = m && m.i;
  if (!(i >= 0 && i < 3) || !H.lotCards[i] || S.lot.cards[i].taken) return;
  const card = H.lotCards[i]; H.lotCards[i] = null;
  S.lot.cards[i] = {open: false, taken: true};
  hand(pid).push(card); sortHand(pid); H.got.push(card);
  emit('take', {by: pid, n: 1, i});
  if (!S.lot.cards.every(c => c.taken)) return;
  const cards = H.got; H.got = []; H.lotCards = [];
  S.lot = null; S.info = null;
  const naps = cards.filter(isNap).sort((a, b) => (CARDS[a.k].kind === 'pest' ? 0 : 1) - (CARDS[b.k].kind === 'pest' ? 0 : 1));
  H.res = {buyer: pid, naps, ci: 0, queue: []};
  if (naps.length) addLog(pl(pid).name + ' получил Напасти: ' + naps.map(cname).join(', '));
  catPhase();
}
function catPhase(){                 // шаг 1: можно ли отменить Напасть Котом
  const R = H.res;
  while (R.ci < R.naps.length){
    const nap = R.naps[R.ci], cats = cnt(R.buyer, c => c.k === 'cat');
    if (cats > 0){ S.step = 'cat'; S.turn = R.buyer; S.info = {nap: nap.k, cats}; return; }
    R.queue.push(nap); R.ci++;
  }
  trigPhase();
}
function doCat(pid, m){
  if (S.step !== 'cat' || S.turn !== pid) return;
  const R = H.res, nap = R.naps[R.ci], h = hand(pid);
  if (m.use){
    const ci = h.findIndex(c => c.k === 'cat'), ni = h.findIndex(c => c.id === nap.id);
    if (ci < 0 || ni < 0) return;
    const cat = h.splice(ci, 1)[0]; const n2 = h.splice(h.findIndex(c => c.id === nap.id), 1)[0];
    H.discard.push(cat, n2);
    emit('nap', {kind:'cat', by: pid, cards: [], nap: {id: n2.id, k: n2.k}, cat: {id: cat.id, k: cat.k}});
    addLog(pl(pid).name + ' сыграл Кота: «' + cname(nap) + '» отменена');
    note('Кот отменил: ' + cname(nap));
  } else R.queue.push(nap);
  R.ci++; S.info = null;
  catPhase();
}
/* Самая большая партия — по числу ВСЕХ карт товара (с господскими, королевскими и испорченными); при равенстве — дороже. */
function ratInfo(id){
  const st = PORD.map(p => partyStats(hand(id), p)).filter(x => x.size > 0);
  if (!st.length) return null;
  st.sort((a, b) => b.size - a.size || b.value - a.value);
  const top = st.filter(x => x.size === st[0].size && x.value === st[0].value);
  return {prods: top.map(x => x.prod), size: st[0].size, need: Math.min(2, st[0].size)};
}
function ratDone(B, nap, ids){
  const h = hand(B), names = [], eaten = [];
  ids.forEach(id => { const i = h.findIndex(c => c.id === id); if (i >= 0){ const c = h.splice(i, 1)[0]; names.push(cname(c)); eaten.push({id: c.id, k: c.k}); H.discard.push(c); } });
  emit('nap', {kind:'rat', by: B, cards: eaten, nap: {id: nap.id, k: nap.k}});
  const ri = h.findIndex(c => c.id === nap.id);
  if (ri >= 0) H.discard.push(h.splice(ri, 1)[0]);
  addLog('Крыса съела у ' + pl(B).name + ': ' + (names.join(', ') || 'ничего'));
  note('Крыса у ' + pl(B).name + '! ' + (eaten.length ? '−' + eaten.length + ' ' + plural(eaten.length, 'карта', 'карты', 'карт') + ' высшей партии!' : 'Есть нечего — Крыса уходит в сброс!'));
}
function trigPhase(){                // шаг 2: сначала Вредители, потом Крысы
  const R = H.res, B = R.buyer;
  while (R.queue.length){
    const nap = R.queue[0], d = CARDS[nap.k];
    if (d.kind === 'pest'){
      const h = hand(B);
      const gone = h.filter(c => isGood(c) && CARDS[c.k].prod === d.prod);
      H.hands[B] = h.filter(c => !gone.includes(c) && c.id !== nap.id);
      H.deck.push(...gone); shuffle(H.deck); H.discard.push(nap);
      emit('nap', {kind:'pest', by: B, cards: gone.map(c => ({id: c.id, k: c.k})), nap: {id: nap.id, k: nap.k}});
      addLog(d.name + '! У ' + pl(B).name + ' пропала вся партия «' + prodName(d.prod) + '» (' + gone.length + ' карт)');
      note(d.name + '! Вся партия «' + prodName(d.prod) + '» уничтожается!');
      R.queue.shift(); continue;
    }
    const ri = ratInfo(B);
    if (!ri){ ratDone(B, nap, []); R.queue.shift(); continue; }
    if (ri.prods.length === 1 && ri.size <= 2){        // выбирать нечего: уходят все карты партии
      ratDone(B, nap, hand(B).filter(c => isGood(c) && CARDS[c.k].prod === ri.prods[0]).map(c => c.id));
      R.queue.shift(); continue;
    }
    S.step = 'rat'; S.turn = B; S.info = {prods: ri.prods, need: ri.need};
    return;
  }
  afterSale();
}
function doRatPick(pid, m){
  if (S.step !== 'rat' || S.turn !== pid) return;
  const ids = m.ids, need = S.info.need;
  if (!Array.isArray(ids) || ids.length !== need || new Set(ids).size !== need) return;
  const cards = ids.map(id => hand(pid).find(c => c.id === id));
  if (cards.some(c => !c || !isGood(c))) return;
  const prod = CARDS[cards[0].k].prod;
  if (cards.some(c => CARDS[c.k].prod !== prod) || !S.info.prods.includes(prod)) return;
  const R = H.res;
  ratDone(pid, R.queue[0], ids); R.queue.shift(); S.info = null;
  trigPhase();
}

/* продажа: карта за продажу (берёт сам) + докупка за монеты (платит и берёт сам) */
function afterSale(){
  if (H.tut && H.tut.after){ const f = H.tut.after; H.tut.after = null; return f(); }       // обучение: разбор Напасти без хода продавца
  H.res = null; S.info = null; H.bought = 0;
  const sid = S.seller;
  if (H.deck.length) setTodo({[sid]: {cards: RULES.freeCard}}, buyOffer, 'Карта за продажу');
  else buyOffer();
}
function buyOffer(){
  const sid = S.seller, p = pl(sid);
  if (H.bought >= RULES.buyMax || p.coins < RULES.buyCost || !H.deck.length) return endTurn();
  S.step = 'buy'; S.turn = sid; S.info = {bought: H.bought, max: RULES.buyMax};
}
function doBuy(pid, m){
  if (S.step !== 'buy' || S.turn !== pid) return;
  if (m.stop) return endTurn();
  const p = pl(pid), n = Math.floor(Number(m.n) || 1);
  if (!(n >= 1 && n <= RULES.buyMax - H.bought && n <= H.deck.length)) return;
  const c = takeOut(p, m.coins, RULES.buyCost * n); if (!c) return;
  emit('coins', {from: pid, to: 'bank', c});
  H.bought += n;
  setTodo({[pid]: {cards: n}}, buyOffer, 'Докупка карты');
}

/* развязка: лот не продан — товары открыто в сброс, специальные карты возвращаются продавцу */
function unsold(){
  const goods = [], specials = [];
  H.lotCards.forEach((c, i) => (isGood(c) ? goods : specials).push(i));
  const names = H.lotCards.map(cname);
  addLog('Лот не продан. В лоте было: ' + names.join(', '));
  H.lotCards.forEach((c, i) => reveal(i));      // непроданный лот открывается всем целиком: и товары, и напасти, и помощники
  S.auction = null; S.info = {n: specials.length, g: goods.length, auto: !specials.length};
  S.step = 'return'; S.turn = S.seller;
  if (!specials.length) setTimeout(() => { if (S.step === 'return' && S.info && S.info.auto){ doReturn(S.turn); commit(); } }, 3000);   // возвращать нечего — через 3 с лот уходит в сброс
}
function doReturn(pid){
  if (S.step !== 'return' || S.turn !== pid) return;
  const goods = H.lotCards.filter(isGood), specials = H.lotCards.filter(c => !isGood(c));
  H.discard.push(...goods); hand(pid).push(...specials); sortHand(pid); H.lotCards = [];
  if (goods.length) emit('toss', {n: goods.length});
  emit('take', {by: pid, n: specials.length});
  endTurn();
}
function endTurn(){ S.lot = null; S.tell = null; S.placing = null; S.auction = null; S.info = null; S.pay = null; H.res = null; nextSeller(); }

/* ---------- конец игры ---------- */
function finishGame(){
  S.phase = 'over'; S.step = 'over'; S.turn = null; S.lot = null; S.tell = null; S.placing = null; S.auction = null; S.info = null; S.pay = null; S.todo = null;
  const rows = S.players.map(p => {
    const h = hand(p.id), parts = PORD.map(pr => partyStats(h, pr));
    const total = parts.reduce((a, x) => a + x.value, 0);
    const groups = PORD.map(pr => {            // карты партий для пошаговой выкладки итогов
      const g = {prod: pr, sp: [], si: [], ge: [], ro: []}, to = {spoiled: g.sp, simple: g.si, gentry: g.ge, royal: g.ro};
      h.forEach(c => { const d = CARDS[c.k]; if (d.prod === pr && to[d.kind]) to[d.kind].push(c.k); });
      return g;
    }).filter(g => g.sp.length + g.si.length + g.ge.length + g.ro.length);
    return {id: p.id, name: p.name, coins: p.coins, parts, groups, total, wealth: total, simple: h.filter(c => CARDS[c.k].kind === 'simple').length};
  });
  rows.sort((a, b) => b.wealth - a.wealth || b.coins - a.coins || b.simple - a.simple);
  const t = rows[0];
  const winners = rows.filter(r => r.wealth === t.wealth && r.coins === t.coins && r.simple === t.simple).map(r => r.id);
  rows.forEach((r, i) => { const q = rows[i - 1]; r.place = (q && q.wealth === r.wealth && q.coins === r.coins && q.simple === r.simple) ? q.place : i + 1; });
  S.final = {rows, winners, order: S.players.map(p => p.id), idx: 0, stage: 'reveal', ready: {}};
}

/* ---------- вход для действий игроков ---------- */
/* Итоги: каждый жмёт «Продолжить» — когда нажали все, показ переходит к следующему игроку, после последнего — подиум */
function finCheck(){
  const F = S.final; S.evts = [];
  if (S.phase === 'over' && F && F.stage === 'reveal' && S.players.every(p => F.ready[p.id])){
    F.ready = {}; F.idx++;
    while (F.idx < F.order.length && !pl(F.order[F.idx])) F.idx++;
    if (F.idx >= F.order.length) F.stage = 'podium';
  }
  commit();
}
function finCont(pid){
  const F = S.final; if (S.phase !== 'over' || !F || F.stage !== 'reveal' || !pl(pid)) return;
  F.ready[pid] = true; if (TEST) S.players.forEach(p => { F.ready[p.id] = true; }); finCheck();
}
function handle(pid, m){
  if (S.phase !== 'game') return;
  S.evts = [];
  switch (m.t){
    case 'select': if (S.step === 'compose' && S.turn === pid){ pl(pid).selN = Math.max(0, Math.min(3, m.n | 0)); S.placing = Array.isArray(m.pos) ? [0, 1, 2].map(i => !!m.pos[i]) : null; } break;
    case 'take': doTake(pid, m); break;
    case 'change': doChange(pid, m); break;
    case 'lot': doLot(pid, m); break;
    case 'price': doPrice(pid, m); break;
    case 'showcase': doShowcase(pid, m); break;
    case 'insp': doInsp(pid, m); break;
    case 'answer': doAnswer(pid, m); break;
    case 'openpick': doOpenPick(pid, m); break;
    case 'bid': doBid(pid, m); break;
    case 'pass': doPass(pid); break;
    case 'seal': doSeal(pid); break;
    case 'pay': doPay(pid, m); break;
    case 'takelot': doTakeLot(pid, m); break;
    case 'cat': doCat(pid, m); break;
    case 'ratpick': doRatPick(pid, m); break;
    case 'buy': doBuy(pid, m); break;
    case 'ret': doReturn(pid); break;
    default: return;
  }
  commit();
}
/*ENGINE-END*/

/* =========================================================

async function nickEmail(name){            // ник → служебный адрес (Firebase хочет email). Хэш, чтобы влезала кириллица и регистр не имел значения
  const t = String(name).trim().toLowerCase();
  try{ const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('kup:' + t))); return Array.from(h.slice(0, 14), x => x.toString(16).padStart(2, '0')).join('') + '@kupec.game'; }
  catch(e){ let a = 5381, b = 52711; for (const ch of t){ a = ((a * 33) ^ ch.charCodeAt(0)) >>> 0; b = ((b * 31) + ch.charCodeAt(0)) >>> 0; } return 'x' + a.toString(16) + b.toString(16) + '@kupec.game'; }
}
function fbAuthErr(e){

  if (/network|таймаут/.test(c)) return 'Нет связи с сервером. Проверь интернет и попробуй ещё раз';
  if (/too-many/.test(c)) return 'Слишком много попыток. Подожди минуту';
  if (/operation-not-allowed|configuration-not-found/.test(c)) return 'В Firebase не включён вход по email/паролю (Authentication → Sign-in method)';
  if (/PERMISSION_DENIED|permission/i.test(c)) return 'База данных не пускает: проверь правила (firebase/database.rules.json)';
  return 'Ошибка: ' + c;
}

      работает там же, где открываются обычные сайты. Брокеров несколько — хватит, чтобы дошёл любой.

      const d = Math.min(12000, 800 * Math.pow(2, Math.min(this.n++, 4)));
      clearTimeout(this.rt); this.rt = setTimeout(() => { if (!this.dead) this.open(); }, d);
      return;
    }
    this.dead = true; this.emit('down', was);
  }
  stop(){ this.dead = true; clearTimeout(this.rt); this.cut(); }
  close(){ if (this.dead) return; if (this.up && this.will) this.pub(this.will.topic, this.will.payload); this.stop(); }   // аккуратный выход = то же, что «завещание»
}
function mkConn(id, sendFn){
  const h = {};
  return {peer: id, open: true, send: sendFn, close(){ if (h.close) h.close(); }, on(ev, fn){ h[ev] = fn; return this; }, _e(ev, ...a){ if (h[ev]) h[ev](...a); }};
}
let fbStops = [], fbConns = {}, fbRoot = null, fbEvts = [], fbGid = -1, fbQ = false;
const NET = {uid:null, last:0, seen:0, rec:0, tick:0, rt:0};   // клиент: свой постоянный id, номер последнего снимка, когда слышали хоста, идёт ли переподключение
const RTC_CFG = {iceServers:[{urls:'stun:stun.l.google.com:19302'}, {urls:'stun:stun1.l.google.com:19302'}, {urls:'stun:global.stun.twilio.com:3478'}, {urls:'stun:stun.cloudflare.com:3478'}]};
function netStop(){
  clearTimeout(netTm); netTm = 0; clearInterval(NET.tick); NET.tick = 0;
  fbStops.forEach(f => { try{ f(); }catch(e){} }); fbStops = []; fbConns = {}; fbRoot = null; fbEvts = []; fbGid = -1; fbQ = false;
  const pr = peer; peer = null;      // WebRTC закрываем с задержкой, чтобы успело уйти прощальное «bye» / «хост закрыл лобби»
  if (pr) setTimeout(() => { try{ pr.destroy(); }catch(e){} }, 300);
  mqs.forEach(m => { try{ m.close(); }catch(e){} }); mqs = []; mqConns = {}; netTags = [];
}
function showNet(){ const e = $('netInfo'); if (e) e.textContent = netTags.length ? 'Связь: ' + netTags.join(' + ') : ''; }

/* ---------- Хост ---------- */
HOOK.broadcast = () => { Object.values(conns).forEach(c => c.open && c.send({t:'state', state:S})); fbPublish(); applyState(S); };
HOOK.hand = (id, cards, newIds) => { if (id === 'host') setHand(cards, newIds); else if (conns[id] && conns[id].open) conns[id].send({t:'hand', cards, newIds}); };
HOOK.peek = (id, data) => { if (id === 'host') setPeek(data); else if (conns[id] && conns[id].open) conns[id].send(Object.assign({t:'peek'}, data)); };

let mqConns = {};
function sendAvsNow(){ const o = Object.assign({}, AVS, {host: pfMe() || undefined}); Object.values(conns).forEach(c => c.open && c.send({t:'avs', avs:o})); }
let avsT = 0;
function sendAvs(){ clearTimeout(avsT); avsT = setTimeout(sendAvsNow, 350); }       // когда заходят сразу все — шлём аватарки одним пакетом, а не по пять раз
function acceptConn(c){
  c.on('data', m => hostReceive(c, m));
  c.on('close', () => connLost(c));
  c.on('error', () => connLost(c));
  conns[c.peer] = c;
}
/* Транспортное соединение привязываем к постоянному id игрока (uid из hello): так игрок может вернуться по другому пути (брокер/WebRTC) на своё место */
function bindConn(c, uid){
  const old = conns[uid];
  if (old && old !== c){ old.pid = null; try{ old.close(); }catch(e){} }
  if (c.peer !== uid && conns[c.peer] === c) delete conns[c.peer];
  c.pid = uid; conns[uid] = c;
}
/* Связь с игроком пропала: не выкидываем сразу, даём время вернуться (hostTick выкинет, если не вернулся) */
function connLost(c){
  const id = c.pid || c.peer;
  if (mqConns[c.peer] === c) delete mqConns[c.peer];
  if (c.fb){ delete fbConns[c.peer]; if (fbRoot) fbRoot.child('to/' + c.peer).remove().catch(() => {}); }
  if (conns[id] !== c) return;       // его уже заменило новое соединение
  delete conns[id];
  markOff(id);
}
function markOff(id){
  const p = S.players.find(x => x.id === id);
  if (!p || p.off || p.host || String(id).startsWith('bot')) return;
  p.off = Date.now(); addLog(p.name + ': нет связи, ждём…'); commit();
}
/* Дослать игроку то, что он мог потерять: снимок состояния, руку, личную подсказку */
function resync(pid, withState){
  const c = conns[pid]; if (!c || !c.open || !S.players.some(x => x.id === pid)) return;
  if (withState) c.send({t:'state', state:S});
  if (S.phase === 'game' || S.phase === 'over'){
    c.send({t:'hand', cards: hand(pid).map(x => ({id: x.id, k: x.k})), newIds: []});
    const pk = H.peekLast && H.peekLast[pid];
    if (pk && S.lot && pk.lot === S.lot.n) c.send(Object.assign({t:'peek'}, pk));
  }
}
/* Раз в пару секунд: «пульс» всем (с номером снимка — по нему клиент понимает, что что-то потерял) + проверка, кто пропал */
function hostTick(){
  if (!isHost) return;
  const now = Date.now();
  Object.keys(conns).forEach(id => { const c = conns[id]; if (c && c.open) c.send({t:'hb', v: S.ver || 0}); });
  S.players.slice().forEach(p => {
    if (p.host || String(p.id).startsWith('bot')) return;
    const seen = H.seen[p.id] || (H.seen[p.id] = now);
    if (!p.off){ if (now - seen > 16000) markOff(p.id); }
    else if (now - p.off > (S.phase === 'game' ? 90000 : 15000)) dropPlayer(p.id);
  });
}
/* Сообщение игрока, пришедшее хосту через брокер: {j:id} — «я хочу войти», {c:id, m} — данные, {b:id} — вышел */
function mqHostMsg(mq, s){
  let x; try{ x = JSON.parse(s); }catch(e){ return; }
  if (x.j) return void mq.pub(mqT(code, 'c/' + x.j), '{"_ok":1}');
  if (x.b){ const c = mqConns[x.b]; if (c && c.via === mq) c._e('close'); return; }
  if (!x.c) return;
  let c = mqConns[x.c];
  if (!c){
    const id = x.c;
    c = mqConns[id] = mkConn(id, m => { if (c.via) c.via.pub(mqT(code, 'c/' + id), JSON.stringify(m)); });
    c.via = mq; acceptConn(c);
  }
  if (c.via !== mq && x.m && x.m.t === 'hello') c.via = mq;   // игрок сам выбрал этот брокер (первый вход или возвращение) — переходим на него
  if (c.via === mq) c._e('data', x.m);        // игрок мог постучаться через несколько брокеров — слушаем только тот, где он начал игру
}

/* Firebase-транспорт: хост пишет общее состояние в lobbies/КОД/state, личные сообщения (рука, ошибки) — в очередь to/uid,
   игроки пишут хосту в очередь in. Присутствие — players/uid с onDisconnect: обрыв замечается сразу, зависших лобби не остаётся. */
function fbPublish(){
  if (!fbRoot) return;
  if (S.gid !== fbGid){ fbGid = S.gid; fbEvts = []; }
  const last = fbEvts.length ? fbEvts[fbEvts.length - 1].seq : 0;
  (S.evts || []).forEach(e => { if (e.seq > last) fbEvts.push(e); });   // события анимаций копим, чтобы слияние записей их не теряло
  fbEvts = fbEvts.slice(-60);
  if (fbQ) return; fbQ = true;
  Promise.resolve().then(() => {
    fbQ = false; if (!fbRoot) return;
    fbRoot.child('state').set(JSON.stringify(Object.assign({}, S, {evts: fbEvts}))).catch(e => console.warn('state', e));
  });
}
function fbHostMsg(v){
  if (!v || typeof v.m !== 'string' || typeof v.u !== 'string') return;
  let m; try{ m = JSON.parse(v.m); }catch(e){ return; }
  let c = fbConns[v.u];
  if (!c){
    const id = v.u;
    c = fbConns[id] = mkConn(id, msg => { if (msg.t !== 'state' && fbRoot) fbRoot.child('to/' + id).push(JSON.stringify(msg)).catch(() => {}); });
    c.fb = true; acceptConn(c);
  }
  c._e('data', m);
}
function fbHostStart(onUp, onFail){
  const root = FB.db.ref('lobbies/' + code);
  root.child('meta').transaction(cur => cur ? undefined : {host: FB.uid, ver: VERSION, t: firebase.database.ServerValue.TIMESTAMP}).then(r => {
    if (!r.committed) return onFail('код занят');
    root.onDisconnect().remove();
    const inRef = root.child('in'), pl = root.child('players');
    const h1 = inRef.on('child_added', snap => { const v = snap.val(); snap.ref.remove().catch(() => {}); fbHostMsg(v); }, e => console.warn('in', e));
    const h2 = pl.on('child_removed', snap => { const c = fbConns[snap.key]; if (c) c._e('close'); });
    fbStops.push(() => { inRef.off('child_added', h1); pl.off('child_removed', h2); root.onDisconnect().cancel(); root.remove().catch(() => {}); });
    fbRoot = root; onUp();
  }).catch(e => onFail((e && (e.code || e.message)) || 'ошибка'));
}
function createLobby(){
  homeErr(''); if (!needName()) return; TEST = false;
  netStop(); code = randCode(); NETVER = 0;
  let total = 0, failed = 0, errs = [];
  const up = tag => {
    if (!netTags.includes(tag)) netTags.push(tag);
    if (!isHost){
      isHost = true; clearTimeout(netTm);
      S = newState(); H = newH(); S.players.push(mkPlayer('host', myName(), true));
      enterLobby(); commit();
      clearInterval(NET.tick); NET.tick = setInterval(hostTick, 2500);
    }
    showNet();
  };
  const lost = (tag, why) => {
    errs.push(tag + ' — ' + why);
    if (isHost) return;
    if (++failed >= total){ netStop(); homeErr('Не удалось создать лобби: нет связи ни с одним сервером (' + errs.join('; ') + ')'); }
  };
  if (fbOn()){
    total++;
    fbHostStart(() => up('Firebase'), why => lost('Firebase', why));
  }
  if (window.Peer){
    total++;
    let opened = false;
    const p = peer = new Peer(PREFIX + code, {config: RTC_CFG});
    p.on('open', () => { opened = true; up('WebRTC'); });
    p.on('connection', acceptConn);
    p.on('disconnected', () => { if (opened) setTimeout(() => { try{ if (peer === p && !p.destroyed) p.reconnect(); }catch(e){} }, 1500); });   // потеряли сервер-посредник: возвращаемся под тем же кодом
    p.on('error', e => { if (!opened){ opened = true; lost('WebRTC', netErr(e)); } else console.warn('PeerJS', e); });
  }
  MQTT_URLS.forEach(url => {
    total++;
    const tag = 'ретранслятор ' + mqHost(url);
    const mq = new MQ(url, {topic: mqT(code, 'all'), payload: '{"gone":1}'}, true);
    let tried = false;
    mqs.push(mq);
    mq.on('up', () => { mq.sub(mqT(code, 'h')); up(tag); })
      .on('msg', (t, s) => mqHostMsg(mq, s))
      .on('down', was => {
        if (!was){ if (!tried){ tried = true; lost(tag, 'не открылся'); } return; }
        netTags = netTags.filter(x => x !== tag); showNet();
        Object.values(mqConns).forEach(c => { if (c.via === mq) c._e('close'); });    // эти игроки вернутся сами — через этот же брокер или другой
      });
    mq.open();
  });
  netTm = setTimeout(() => { if (!isHost){ netStop(); homeErr('Не удалось создать лобби: ни один сервер не ответил за 12 с (' + errs.join('; ') + ')'); } }, 12000);
}
function hostReceive(c, m){
  const pid = c.pid || c.peer, now = Date.now();
  if (m.t === 'hello'){
    if (m.ver !== VERSION) return c.send({t:'error', msg:'Версия игры не совпадает (у тебя ' + m.ver + ', у хоста ' + VERSION + '). Обнови страницу: Ctrl+F5'});
    const uid = (typeof m.uid === 'string' && m.uid !== 'host' && /^[A-Za-z0-9_-]{3,40}$/.test(m.uid)) ? m.uid : c.peer;
    const ex = S.players.find(x => x.id === uid);
    if (!ex){
      if (S.phase !== 'lobby') return c.send({t:'error', msg:'Игра уже идёт'});
      if (S.players.length >= 5) return c.send({t:'error', msg:'Лобби заполнено (максимум 5 игроков)'});
    }
    bindConn(c, uid); H.seen[uid] = now;
    const f = m.pf; AVS[uid] = {av: f && typeof f.av === 'string' && f.av.length < 20000 ? f.av : '', lv: f ? (f.lv | 0) : 0};
    if (ex){ if (ex.off){ ex.off = 0; addLog(ex.name + ' снова в игре'); } }       // вернулся на своё место (или повторный hello)
    else S.players.push(mkPlayer(uid, String(m.name || 'Игрок').slice(0, 16)));
    sendAvs(); commit(); resync(uid); return;
  }
  const p = S.players.find(x => x.id === pid);
  if (!p) return;
  H.seen[pid] = now;
  if (p.off){ p.off = 0; addLog(p.name + ' снова в игре'); commit(); }
  if (m.t === 'ack'){ if ((m.v | 0) < (m.hv | 0)) resync(pid, true); return; }   // отстал от хоста — значит, потерял снимок: досылаем
  if (m.t === 'sync'){ resync(pid, true); return; }
  if (m.t === 'bye'){ dropPlayer(pid); return; }
  if (m.t === 'ping'){ addLog(p.name + ': пинг'); return commit(); }
  if (m.t === 'chat'){ const s = String(m.s || '').trim().slice(0, 140); if (s){ addChat(p.name, s); commit(); } return; }
  if (m.t === 'fcont'){ finCont(pid); return; }
  if (m.t === 'restart'){ if (S.phase === 'over' && S.final && S.final.stage === 'podium') backToLobby(); return; }
  handle(pid, m);
}
function backToLobby(notice){
  const keep = S.players.map(p => mkPlayer(p.id, p.name, p.host));
  const gid = S.gid;
  S = newState(); S.gid = gid; S.players = keep; S.notice = notice || ''; H = newH();
  commit();
}
function dropPlayer(id){
  delete conns[id]; if (H.seen) delete H.seen[id]; if (AVS[id]){ delete AVS[id]; sendAvs(); }
  const p = S.players.find(x => x.id === id);
  if (!p) return;
  const name = p.name, inGame = S.phase === 'game';
  S.players = S.players.filter(x => x.id !== id); delete H.hands[id]; delete H.sentIds[id];
  if (inGame) backToLobby('Игра прервана: ' + name + ' отключился(ась). Начните заново');
  else if (S.phase === 'over') finCheck();
  else commit();
}

/* ---------- Клиент ---------- */
function joinLobby(){
  homeErr(''); if (!needName()) return;
  const c = $('joinCode').value.trim().toUpperCase();
  if (c.length !== 5) return homeErr('Код состоит из 5 символов');
  netStop(); code = c;
  NET.uid = fbOn() ? FB.uid : 'p' + Math.random().toString(36).slice(2, 10);    // постоянный id игрока: по нему хост узнаёт нас при возвращении
  NET.last = 0; NET.rec = 0; NET.seen = Date.now(); clearTimeout(NET.rt);
  connectTo(false);
}
const showRec = on => { const e = $('netBan'); if (e) e.classList.toggle('on', !!on); };
/* Связь с хостом пропала: сохраняем стол как есть, показываем плашку и пробуем вернуться на своё место */
function reconnect(){
  if (isHost || !NET.uid || NET.rec || !myPid) return;
  NET.rec = Date.now(); hostConn = null; showRec(true);
  tryRejoin();
}
function tryRejoin(){
  if (!NET.rec) return;
  if (Date.now() - NET.rec > 45000){ leave(); return homeErr('Связь с хостом потеряна, вернуться не удалось'); }
  netStop(); connectTo(true);
}
function lostLink(conn){ if (hostConn === conn) reconnect(); }
setInterval(() => { if (!isHost && hostConn && myPid && !NET.rec && Date.now() - NET.seen > 20000) reconnect(); }, 3000);   // хост молчит (пульс приходит раз в 2,5 с)
function connectTo(rejoin){
  const cid = NET.uid;
  let won = null, total = 0, failed = 0, errs = [], reached = false;
  const kills = [];
  const giveUp = () => {
    clearTimeout(netTm); const e = errs.slice(); netStop();
    if (rejoin){ clearTimeout(NET.rt); NET.rt = setTimeout(tryRejoin, 1200); return; }
    homeErr(reached ? 'Лобби с таким кодом не найдено' : 'Нет связи ни с одним сервером (' + e.join('; ') + ')');
  };
  const bad = (tag, why, ok) => { errs.push(tag + ' — ' + why); if (ok) reached = true; if (!won && ++failed >= total) giveUp(); };
  const win = (conn, pid, tag, keep) => {
    if (won) return; won = conn; hostConn = conn; myPid = pid; clearTimeout(netTm);
    kills.forEach(k => k(keep)); netTags = [tag];
    NET.seen = Date.now(); NET.rec = 0; showRec(false);
    let seated = false;      // пришёл ли снимок, где мы уже числимся игроком: пока нет — hello мог потеряться, повторяем
    const hello = () => conn.send({t:'hello', name:myName(), ver:VERSION, pf:pfMe(), uid: pid, rejoin: !!rejoin});
    const helloT = setInterval(() => { if (seated || hostConn !== conn) return clearInterval(helloT); hello(); }, 2000);
    conn.on('data', m => {
      NET.seen = Date.now();
      if (m.t === 'state'){
        if (m.state && m.state.players && m.state.players.some(x => x.id === pid)) seated = true;
        const v = m.state && m.state.ver | 0;
        if (v && v <= NET.last) return;                  // уже есть такой или новее (повторная доставка)
        if (v) NET.last = v;
        if (!$('lobby').classList.contains('on') && !$('game').classList.contains('on')) enterLobby();
        applyState(m.state); showNet();
      }
      if (m.t === 'hb') conn.send({t:'ack', v: NET.last, hv: m.v | 0});      // «я жив, вот какой снимок у меня»
      if (m.t === 'avs'){ AVS = m.avs || {}; if (S.players.length) render(); }
      if (m.t === 'hand') setHand(m.cards, m.newIds);
      if (m.t === 'peek') setPeek(m);
      if (m.t === 'error'){ const msg = m.msg; leave(); homeErr(msg); }
    });
    conn.on('close', () => { clearInterval(helloT); lostLink(conn); });
    hello();
  };
  if (fbOn()){
    total++;
    const uid = FB.uid, root = FB.db.ref('lobbies/' + code);
    root.child('meta').once('value').then(async snap => {
      if (won) return;
      if (!snap.exists()) return bad('Firebase', 'лобби не найдено', true);
      const conn = mkConn(uid, m => { root.child('in').push({u: uid, m: JSON.stringify(m)}).catch(() => {}); });
      conn.fb = true;
      await root.child('to/' + uid).remove().catch(() => {});
      if (won) return;
      const pres = root.child('players/' + uid), toRef = root.child('to/' + uid), stRef = root.child('state'), mtRef = root.child('meta');
      pres.onDisconnect().remove(); pres.set(true).catch(() => {});
      win(conn, uid, 'Firebase', null);
      const hTo = toRef.on('child_added', sn => { const v = sn.val(); sn.ref.remove().catch(() => {}); try{ conn._e('data', JSON.parse(v)); }catch(e){} });
      const hSt = stRef.on('value', sn => { const v = sn.val(); if (!v) return; try{ const o = JSON.parse(v); if (o.players && o.players.some(p => p.id === uid)) conn._e('data', {t:'state', state:o}); }catch(e){} });
      const hMt = mtRef.on('value', sn => { if (!sn.exists()) conn._e('close'); });
      const stop = () => { toRef.off('child_added', hTo); stRef.off('value', hSt); mtRef.off('value', hMt); pres.onDisconnect().cancel(); pres.remove().catch(() => {}); };
      fbStops.push(stop); conn.close = stop;
    }).catch(e => bad('Firebase', (e && (e.code || e.message)) || 'ошибка', false));
  }
  if (window.Peer){
    total++;
    const p = new Peer(undefined, {config: RTC_CFG}); let done = false;
    kills.push(keep => { if (keep !== p) try{ p.destroy(); }catch(e){} });
    p.on('open', () => {
      const hc = p.connect(PREFIX + code, {reliable:true});
      hc.on('open', () => { if (won) return; peer = p; win(hc, cid, 'WebRTC', p); });
      hc.on('error', () => { if (won === hc) lostLink(hc); });
    });
    p.on('error', e => { if (done || won) return; done = true; bad('WebRTC', netErr(e), e.type === 'peer-unavailable'); });
  }
  MQTT_URLS.forEach(url => {
    total++;
    const tag = 'ретранслятор ' + mqHost(url);
    const mq = new MQ(url, {topic: mqT(code, 'h'), payload: JSON.stringify({b:cid})});
    mqs.push(mq);
    let conn = null, tj = 0;
    kills.push(() => { clearInterval(tj); if (mq !== (won && won.mq)) mq.close(); });
    mq.on('up', () => {
      mq.sub(mqT(code, 'c/' + cid)); mq.sub(mqT(code, 'all'));
      let n = 0; const knock = () => { if (won) return clearInterval(tj); if (n++ >= 4){ clearInterval(tj); return bad(tag, 'хост не ответил', true); } mq.pub(mqT(code, 'h'), JSON.stringify({j:cid})); };
      tj = setInterval(knock, 2000); knock();
    }).on('msg', (t, s) => {
      let x; try{ x = JSON.parse(s); }catch(e){ return; }
      if (t.endsWith('/all')){ if (conn && x.gone) conn._e('close'); return; }
      if (x._ok){
        if (conn || won) return;
        conn = mkConn(cid, m => mq.pub(mqT(code, 'h'), JSON.stringify({c:cid, m})));
        conn.mq = mq; conn.close = () => mq.close(); win(conn, cid, tag, null);
        return;
      }
      if (conn && won === conn) conn._e('data', x);
    }).on('down', was => {
      if (conn && won === conn) conn._e('close');
      else if (!won) bad(tag, was ? 'связь оборвалась' : 'не открылся', false);
    });
    mq.open();
  });
  if (!total) return homeErr('Нет доступных способов связи');

}

/* ---------- Мой кошелёк и Печать ---------- */
const trayTotal = () => ui.tray[1] + 5 * ui.tray[5] + 10 * ui.tray[10];
function resetTray(){ ui.tray = {1:0, 5:0, 10:0}; ui.trayKey = ''; ui.trayAmt = 0; ui.bag = null; ui.bagMode = false; }
function clampTray(){ const pu = freePurse(); DEN.forEach(d => { ui.tray[d] = Math.max(0, Math.min(ui.tray[d], pu[d])); }); }
/* Стопка монет, выложенных на стол лидером торгов (рядом с его местом); при смене ставки выезжает заново */
function aimStake(e){        // направляем ставку от плашки игрока к центру стола, на расстояние, чтобы не лежать под плашкой
  const stk = e.querySelector('.stk'), pl = e.querySelector('.plate'), t = $('table'); if (!stk || !pl || !t) return;
  const sr = pl.getBoundingClientRect(), tr = t.getBoundingClientRect();
  let vx = tr.left + tr.width / 2 - (sr.left + sr.width / 2), vy = tr.top + tr.height * .55 - (sr.top + sr.height / 2);
  if (e.classList.contains('ctr')){ vx = -.9; vy = .44; }     // верхний игрок: вниз мешает лот — уводим ставку влево-вниз
  const L = Math.hypot(vx, vy) || 1; vx /= L; vy /= L;
  const D = Math.abs(vx) * (pl.offsetWidth / 2 + 70) + Math.abs(vy) * (pl.offsetHeight / 2 + 48) + 14;
  stk.style.setProperty('--sx', (vx * D).toFixed(1) + 'px'); stk.style.setProperty('--sy', (vy * D).toFixed(1) + 'px');
}
/* Ставка на столе статична: три постоянных места под монеты 1/5/10, стопки не двигаются. При добавке монет вылетают только новые. */
function fillStake(node, sk, id, fromEl){
  node.innerHTML = '';
  if (!sk){ delete ui.stakeSigs[id]; delete ui.stakePrev[id]; return; }
  DEN.forEach(d => {
    if (sk[d] > 0) node.append(pileEl(d, sk[d], {label:false, max:10}));
    else { const ph = pileEl(d, 1, {label:false}); ph.style.visibility = 'hidden'; node.append(ph); }   // пустое место — чтобы остальные стопки не смещались
  });
  const key = S.gid + '|' + (S.lot && S.lot.n), cur = {}, prev = ui.stakePrev[id];
  DEN.forEach(d => { cur[d] = sk[d] || 0; });
  ui.stakePrev[id] = {key, st: cur};
  const sig = [key, coinSum(sk)].join('|');
  if (ui.stakeSigs[id] === sig) return;
  ui.stakeSigs[id] = sig;
  if (reduce || !node.animate || !fromEl) return;
  const f = center(fromEl);
  if (!prev || prev.key !== key){                                   // первая ставка: стопки выезжают целиком
    const c = center(node);
    node.animate([{transform: 'translate(' + (f.x - c.x) + 'px,' + (f.y - c.y) + 'px) scale(.3)', opacity: 0}, {transform: 'none', opacity: 1}], {duration: 600, easing: 'cubic-bezier(.2,.8,.2,1)'});
    return;
  }
  DEN.forEach(d => {                                                // добавка: новые монеты прилетают и ложатся сверху стопки
    const add = cur[d] - (prev.st[d] || 0); if (add <= 0) return;
    const pile = node.querySelector('.pw[data-d="' + d + '"] .pile'); if (!pile) return;
    const coins = [...pile.children]; coins.slice(-Math.min(add, coins.length)).forEach((c, i) => {
      const cc = center(c);
      c.animate([{transform: 'translate(' + (f.x - cc.x) + 'px,' + (f.y - cc.y) + 'px) scale(.4)', opacity: 0}, {transform: 'none', opacity: 1}], {duration: 480, delay: i * 70, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards'});
    });
  });
}

  let hot = null;                    // какие монеты сейчас можно кинуть в мешочек — они подсвечены и подрагивают
  if (ui.bagMode && ui.bag && !ui.bag.busy){

function sealCheck(){

/* лот на прилавке */
function slotMode(){
  if (S.phase !== 'game' || S.turn !== myId()) return null;
  if (S.step === 'showcase') return 'showcase';
  if (S.step === 'openpick') return 'open';
  if (S.step === 'takelot') return 'take';
  if (S.step === 'return') return 'return';
  return null;
}
function renderLot(){
  const L = S.lot, sl = $('slots');
  fitCloth(); clothSet(S.phase === 'game' && (!!L || S.step === 'compose'));
  const peekC = (L && myPeek && myPeek.lot === L.n) ? myPeek.cards : null;
  const mode = slotMode();
  const cMe = composeMe();
  const cObs = !L && !cMe && S.phase === 'game' && S.step === 'compose';     // чужой продавец раскладывает карты — рубашки видны всем сразу
  const obsP = cObs ? [0, 1, 2].map(i => S.placing && S.placing[i] ? 1 : 0) : null;
  const sig = L ? [L.n, L.cards.map(c => c.taken ? 'x' : c.open ? c.k : '-').join(), peekC ? peekC.join() : '', mode || '', hideLot ? 1 : 0].join('|') : (cMe ? 'compose|' + placed.map(x => x == null ? '-' : x).join() : (cObs ? 'obs|' + obsP.join('') : ''));
  if (sig !== slotSig){
    slotSig = sig; sl.innerHTML = '';
    if (!L && cMe){                             // продавец: три места, куда кладутся карты лота (пустое — мигает; положенную карту нажатием возвращаем в руку)
      placed.forEach((id, i) => {
        const card = id != null ? myHand.find(c => c.id === id) : null;
        const w = el('div', 'slot' + (card ? ' placed' : ' empty'));
        if (card){
          const f = mkFace(card, true);
          if (ui.landIdx === i) f.classList.add('land');
          w.append(f);
          w.addEventListener('pointerdown', e => slotDown(e, i));
        }
        w.append(el('span', 'sn', String(i + 1)));
        sl.append(w);
      });
      ui.landIdx = -1;
    } else if (cObs){
      const prevObs = ui.obsP || [0, 0, 0];
      obsP.forEach((on, i) => {
        const w = el('div', 'slot ' + (on ? 'placed obs' : 'obsempty'));
        if (on){ const b = mkBack(true); if (!prevObs[i]){ b.classList.add('land'); sfx('postavil', .5); } w.append(b); }
        sl.append(w);
      });
      ui.obsP = obsP;
    } else if (L){
      L.cards.forEach((c, i) => {
        if (c.taken){ const g = el('div', 'slot'); g.append(mkBack(true)); g.style.visibility = 'hidden'; sl.append(g); return; }   // карту уже забрали: место остаётся пустым
        const pick = mode === 'take' || mode === 'return' || ((mode === 'showcase' || mode === 'open') && !c.open);
        const w = el('div', 'slot' + (pick ? ' pick' : ''));
        const card = c.open ? mkFace({k:c.k}, true) : mkBack(true);
        if (c.open && prevLot && prevLot.n === L.n && !prevLot.open[i]) card.classList.add('flip');
        w.append(card, el('span', 'sn', String(i + 1)));
        if (!c.open && peekC) w.append(el('span', 'pk', CARDS[peekC[i]].name));
        if (hideLot && S.seller !== myId()) w.style.visibility = 'hidden';
        w.onclick = () => slotClick(i);
        sl.append(w);
      });
    }
    prevLot = L ? {n:L.n, open:L.cards.map(c => c.open)} : null;
    if (!cObs) ui.obsP = null;
  }
  const go = $('lotgo'); go.innerHTML = '';
  if (!L && cMe && placed.every(x => x != null)){
    const b = el('button', null, 'Выставить'); b.onclick = putLot; go.append(b); go.style.display = 'block';
  } else go.style.display = 'none';
  const info = $('lotinfo'); info.innerHTML = '';
  if (!L){ info.style.display = 'none'; return; }
  info.style.display = '';
  const lt = el('div', 'lt'); lt.append('Лот ', el('b', null, nm(S.seller)));
  if (L.price == null){ info.append(lt, el('div', 'lp', 'Цена не названа')); return; }
  /* «Ставка Х монет»: до первой ставки — цена продавца, дальше — текущая ставка; при изменении число «пересчитывается» с анимацией */
  const A = S.auction, val = S.pay ? S.pay.amount : (A && A.by ? A.high : L.price);
  const bv = el('b', null, String(val));
  if (ui.priceFx) bv.style.visibility = 'hidden';
  if (ui.lpLot !== L.n){ ui.lpLot = L.n; ui.lpVal = val; ui.lpAnim = null; }
  else if (ui.lpVal !== val){ ui.lpAnim = {from: ui.lpVal, to: val, t0: performance.now()}; ui.lpVal = val; }
  if (ui.lpAnim && ui.lpAnim.to === val && !reduce){
    const an = ui.lpAnim, dur = 650;
    if (performance.now() - an.t0 < dur){
      bv.classList.add('bump');
      const tick = () => {                          // кадры продолжаем всегда: при первом вызове плашка ещё не вставлена в страницу
        const p = Math.min(1, (performance.now() - an.t0) / dur);
        bv.textContent = String(Math.round(an.from + (an.to - an.from) * (1 - Math.pow(1 - p, 3))));
        if (p < 1) requestAnimationFrame(tick);
      };
      tick();
    }
  }
  const lp = el('div', 'lp'); lp.append((S.pay || (A && A.by !== null)) ? 'Ставка ' : 'Цена ', bv, ' ' + plural(val, 'монета', 'монеты', 'монет'));
  info.append(lt, lp);
}
function slotClick(i){
  const mode = slotMode(); if (!mode || !S.lot) return;
  if (mode === 'take') return S.lot.cards[i].taken ? null : send({t:'takelot', i});     // по одной карте со стола
  if (mode === 'return') return send({t:'ret'});
  if (S.lot.cards[i].open) return;
  if (mode === 'showcase') return send({t:'showcase', i});
  send({t:'openpick', i});            // вскрытие уже оплачено мешочком — осталось выбрать карту
}

/* ---------- Мешочек: монеты в него перетаскивают из кошелька ----------

   need = 0 — свободная ставка: сколько закинул, столько и ставишь. Монета крупнее остатка в мешок не идёт и возвращается. */
const BAG_SVG = '<div class="bimg" aria-hidden="true"></div>';
const coinsWord = n => n + ' ' + plural(n, 'монета', 'монеты', 'монет');
function bagWidget(key, need, onFull){
  if (ui.trayKey !== key){ ui.tray = {1:0, 5:0, 10:0}; ui.trayKey = key; }

  });

  const bin = bag.querySelector('.bin');
  const w = {bag, need, onFull, busy:false, label:null, guard:null, cap:0, onUpd:null};

function bagFire(){

function endDrag(){

  const r = b && b.getBoundingClientRect(), tap = Math.hypot(D.x - D.sx, D.y - D.sy) < 8;

/* ---------- Звук: шум рынка (зацикленный, с плавным входом) и звуки карт ---------- */
const SND = {mute: false, bedVol: .2};
try{ SND.mute = localStorage.getItem('kup_mute') === '1'; }catch(e){}
const SFX = {};
/* Звуки кнопок: наведение (tipoff1-3) и нажатие (click1-3) — вариант случайный, подряд не повторяется */
const UIS = {tipoff: -1, click: -1};
function uiSnd(kind, vol){
  let i; do { i = Math.random() * 3 | 0; } while (i === UIS[kind]);
  UIS[kind] = i; sfx(kind + (i + 1), vol);
}
document.addEventListener('pointerover', e => {
  if (e.pointerType !== 'mouse') return;
  const b = e.target.closest && e.target.closest('button'); if (!b || b.disabled || (e.relatedTarget && b.contains(e.relatedTarget))) return;
  uiSnd('tipoff', 1);
}, true);
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button'); if (!b || b.disabled) return;
  uiSnd('click', .8);
}, true);
function sfx(name, vol, delay, rate){
  if (SND.mute) return;
  const go = () => {
    const P = SFX[name] || (SFX[name] = {i: 0, a: Array.from({length: 4}, () => { const a = new Audio('sfx/' + name + '.mp3'); a.preload = 'auto'; return a; })});
    const a = P.a[P.i++ % P.a.length]; a.volume = Math.min(1, vol == null ? 1 : vol); a.playbackRate = rate || 1;
    try{ a.currentTime = 0; }catch(e){}
    const r = a.play(); if (r && r.catch) r.catch(() => {});
  };
  delay ? setTimeout(go, delay) : go();
}
/* Шум рынка: два плеера по очереди — перед концом дорожки следующий заходит с нуля, а текущий затихает (бесшовный цикл) */
const BED = {a: null, b: null, cur: null, nxt: null, m: 0, want: false, tm: 0, last: 0};
function bedTick(){
  const now = performance.now(), dt = Math.min(250, now - BED.last); BED.last = now;
  BED.m = Math.max(0, Math.min(1, BED.m + (BED.want && !SND.mute ? dt : -dt) / (BED.want ? 3000 : 1200)));
  const X = 4000, c = BED.cur, n = BED.nxt;
  if (c && !n && c.duration && (c.duration - c.currentTime) * 1000 < X){ BED.nxt = BED.cur === BED.a ? BED.b : BED.a; BED.nxt.g = 0; BED.nxt.currentTime = 0; const r = BED.nxt.play(); if (r && r.catch) r.catch(() => {}); }
  if (BED.nxt){
    BED.cur.g = Math.max(0, BED.cur.g - dt / X); BED.nxt.g = Math.min(1, BED.nxt.g + dt / X);
    if (BED.nxt.g >= 1){ BED.cur.pause(); BED.cur = BED.nxt; BED.nxt = null; }
  }
  [BED.a, BED.b].forEach(a => { if (a) a.volume = Math.max(0, Math.min(1, SND.bedVol * BED.m * (a.g == null ? 1 : a.g))); });
  if (!BED.want && BED.m <= 0){ [BED.a, BED.b].forEach(a => a && a.pause()); BED.cur = BED.nxt = null; clearInterval(BED.tm); BED.tm = 0; }
}
function bedStart(){
  BED.want = true;
  if (!BED.a){ BED.a = new Audio('sfx/market.mp3'); BED.b = new Audio('sfx/market.mp3'); BED.a.preload = BED.b.preload = 'auto'; }
  if (BED.tm) return;
  BED.cur = BED.a; BED.nxt = null; BED.a.g = 1; BED.b.g = 0; BED.last = performance.now();
  const r = BED.a.play(); if (r && r.catch) r.catch(() => {});
  BED.tm = setInterval(bedTick, 100);
}
function bedStop(){ BED.want = false; }
/* Музыка меню: тот же бесшовный цикл (два плеера), громче по умолчанию тише шума рынка не делаем — своя громкость */
const MUS = {a: null, b: null, cur: null, nxt: null, m: 0, want: false, tm: 0, last: 0, vol: .4};
function musTick(){
  const now = performance.now(), dt = Math.min(250, now - MUS.last); MUS.last = now;
  MUS.m = Math.max(0, Math.min(1, MUS.m + (MUS.want && !SND.mute ? dt : -dt) / (MUS.want ? 2500 : 1500)));
  const X = 4000, c = MUS.cur, n = MUS.nxt;
  if (c && !n && c.duration && (c.duration - c.currentTime) * 1000 < X){ MUS.nxt = MUS.cur === MUS.a ? MUS.b : MUS.a; MUS.nxt.g = 0; MUS.nxt.currentTime = 0; const r = MUS.nxt.play(); if (r && r.catch) r.catch(() => {}); }
  if (MUS.nxt){
    MUS.cur.g = Math.max(0, MUS.cur.g - dt / X); MUS.nxt.g = Math.min(1, MUS.nxt.g + dt / X);
    if (MUS.nxt.g >= 1){ MUS.cur.pause(); MUS.cur = MUS.nxt; MUS.nxt = null; }
  }
  [MUS.a, MUS.b].forEach(a => { if (a) a.volume = Math.max(0, Math.min(1, MUS.vol * MUS.m * (a.g == null ? 1 : a.g))); });
  if (!MUS.want && MUS.m <= 0){ [MUS.a, MUS.b].forEach(a => a && a.pause()); MUS.cur = MUS.nxt = null; clearInterval(MUS.tm); MUS.tm = 0; }
}

/* Фон-стол: картинка (1790×1179, синее сукно: центр 896,545, размер ≈1215×480) подгоняется под область стола */
function fitBg(){
  const g = $('game'), t = $('table'); if (!g || !g.clientWidth || !t.clientWidth) return;
  const gr = g.getBoundingClientRect(), tr = t.getBoundingClientRect(), vw = g.clientWidth, vh = g.clientHeight;
  const Fw = tr.width * .92, Fh = tr.height * .9;                        // область бывшего сукна
  const cx = tr.left - gr.left + tr.width / 2, cy = tr.top - gr.top + tr.height * .1 + Fh / 2;
  const sc = Math.max(Fw / 1215, Fh / 480, vw / 1790, vh / 1179);
  const w = 1790 * sc, h = 1179 * sc;
  const x = Math.min(0, Math.max(vw - w, cx - 896 * sc)), y = Math.min(0, Math.max(vh - h, cy - 545 * sc));
  ['bgImg', 'bgNight'].forEach(id => { const b = $(id); b.style.width = w + 'px'; b.style.height = h + 'px'; b.style.left = x + 'px'; b.style.top = y + 'px'; });
  const nb = $('bgNight');   // ночная картинка нарисована чуть ниже: сдвигаем и подгоняем размер, чтобы овал стола совпал с дневным
  nb.style.backgroundSize = (w * 1.0016) + 'px ' + (h * 1.003) + 'px'; nb.style.backgroundPosition = (-.0011 * w) + 'px ' + (-.0072 * h) + 'px';
}

function showPg(card){
  const h = $('hand'), d = CARDS[card.k];

/* ---------- Итоги: пошаговый подсчёт и подиум ---------- */
const FX = {key:'', tok:0, K:1, done:false};
const fxW = (ms, tok) => new Promise((res, rej) => setTimeout(() => FX.tok === tok ? res() : rej(0), reduce ? 0 : ms * FX.K));
const fxA = (e, kf, ms, o) => e.animate(kf, Object.assign({duration: Math.max(1, reduce ? 1 : ms * FX.K), easing: 'ease-out', fill: 'both'}, o || {}));
const fxR = (a, b) => a + Math.random() * (b - a);
const fxPop = (e, s) => fxA(e, [{transform: 'scale(1)'}, {transform: 'scale(' + (s || 1.4) + ')', color: '#fff3b0'}, {transform: 'scale(1)'}], 380);
/* звуки подсчёта: при «пропустить» (быстрая прокрутка) молчим */
const fxS = (n, v, d) => { if (FX.K >= .5) sfx(n, v, d); };
let fxTickAt = 0;
function fxTick(){ const t = performance.now(); if (t - fxTickAt < 55 || FX.K < .5) return; fxTickAt = t; uiSnd('tipoff', .55); }
async function fxNum(e, from, to, ms, tok){          // число «набегает» от from до to
  const st = Math.min(24, Math.max(1, Math.abs(to - from)));
  for (let i = 1; i <= st; i++){ await fxW(ms / st, tok); e.textContent = String(Math.round(from + (to - from) * i / st)); fxTick(); }
}
function renderFinal(){
  const F = S.final; if (!F) return;
  $('finalX').classList.add('on');
  const key = S.gid + ':' + F.stage + ':' + F.idx;
  if (FX.key !== key){
    FX.key = key; FX.tok++; FX.K = 1; FX.done = false;
    (F.stage === 'podium' ? finPodium : finReveal)(F, FX.tok).catch(() => {});
  }
  pfAward(); finUI();
}
function finUI(){
  const F = S.final, bar = $('fxBar'); if (!F) return;
  bar.innerHTML = ''; $('fxSkip').style.display = FX.done ? 'none' : '';
  if (!FX.done) return;
  if (F.stage === 'podium'){
    const r = el('div', 'row'); r.append(btn('Вернуться в лобби', () => send({t:'restart'})), btn('Выйти', leave, {ghost:true})); bar.append(r);
  } else {
    const me = myId(), pend = S.players.filter(p => !F.ready[p.id]);
