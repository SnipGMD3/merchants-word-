.pr .pt small{display:block;font-size:.7rem;color:var(--mute);font-weight:400}
.pr.gold{background:linear-gradient(110deg,#7a5200,#ffd23f 40%,#fff2b0 50%,#ffd23f 60%,#7a5200);background-size:250% 100%;animation:shimmer 2.6s linear infinite,goldglow 1.4s ease-in-out infinite;color:#2a1c00;border-color:#fff1a8}
.pr.gold .pl,.pr.gold .pt,.pr.gold .pt small,.pr.gold .nm2 small{color:#4a3000}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes goldglow{0%,100%{box-shadow:0 0 14px rgba(255,210,63,.5)}50%{box-shadow:0 0 38px rgba(255,230,120,1),0 0 70px rgba(255,200,40,.6)}}
.spark{position:absolute;left:50%;top:50%;color:var(--acc2);font-style:normal;font-size:calc(.7rem + var(--sz,0)*.6rem);pointer-events:none;opacity:0;animation:spark 1.6s ease-out infinite;animation-delay:var(--d);text-shadow:0 0 8px #ffd23f}
@keyframes spark{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2) rotate(180deg)}}

/* ================= таблица очков и подсказка партии ================= */
/* таблица очков справа внизу: крупные строки «N карт = M очков», ниже — пояснения к множителям */
.scoretbl{position:absolute;right:8px;bottom:8px;z-index:4;width:262px;padding:8px 10px 6px;pointer-events:none}
.scoretbl .sth{font-weight:900;font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;color:var(--acc2);text-align:center}
.scoretbl .sts{font-size:.7rem;line-height:1.2;color:#e6d9b6;text-align:center;padding:1px 2px 4px;margin-bottom:4px;border-bottom:1px solid rgba(255,183,3,.35)}
.scoretbl .stg{display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,auto);column-gap:10px;row-gap:0}
.scoretbl .str{display:flex;align-items:center;gap:5px;padding:0 6px;border-radius:8px;font-size:.95rem;color:#e6d9b6;transition:background .15s,box-shadow .15s}
.scoretbl .str .sn{width:1.3em;text-align:right;color:#fff;font-weight:900;font-size:1.05rem}
.scoretbl .str .cb{width:11px;height:17px}
.scoretbl .str em{font-style:normal;opacity:.7;margin-left:2px}
.scoretbl .str b{margin-left:auto;color:var(--acc2);font-weight:900;font-size:1.1rem;text-shadow:0 0 8px rgba(255,200,40,.35)}
.scoretbl .str.hl{background:rgba(255,183,3,.34);box-shadow:0 0 12px rgba(255,183,3,.75)}
.scoretbl .stf{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.18)}
.scoretbl .rl{display:flex;align-items:center;gap:5px}
.scoretbl .rl span{flex:none;min-width:2.1em;text-align:center;font-size:.85rem;font-weight:900;padding:2px 6px;border-radius:999px;color:#10151f;text-shadow:none}
.scoretbl .rl p{margin:0;font-size:.78rem;line-height:1.1;color:#f1e6c8;font-weight:700}
.scoretbl .stf .a{background:#2fc7c3}.scoretbl .stf .b{background:#ffc83a}.scoretbl .stf .c{background:#b3bb4a}
.hand .card.pg:not(.sel){--y:-30px;--sc:1.06;z-index:6;filter:drop-shadow(0 0 3px #ffe08a) drop-shadow(0 0 12px rgba(255,200,40,.9)) drop-shadow(0 10px 10px rgba(0,0,0,.6))}
.hand .card.pg:hover{--y:-44px;--sc:1.16;z-index:7}
.hand.pgon .card:not(.pg){opacity:.5}
.pgtip{position:absolute;z-index:12;transform:translate(-50%,-100%);pointer-events:none;display:none;flex-direction:column;align-items:center;gap:2px;padding:8px 18px 9px;border-radius:14px;white-space:nowrap;
  background:linear-gradient(160deg,rgba(40,54,80,.97),rgba(14,19,30,.97));border:1px solid var(--acc);box-shadow:0 8px 22px rgba(0,0,0,.6),0 0 22px rgba(255,183,3,.35)}
.pgtip.on{display:flex;animation:pgin .16s ease-out}
@keyframes pgin{from{opacity:0}to{opacity:1}}
.pgtip small{font-size:.72rem;color:var(--mute);letter-spacing:.05em}
.pgtip::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:#0e131e;border-right:1px solid var(--acc);border-bottom:1px solid var(--acc);transform:translateX(-50%) rotate(45deg)}
.pgx{display:flex;align-items:center;gap:8px;font-weight:800}
.pgx .pb{font-size:2rem;color:var(--acc);line-height:1}
.pgx .pm{font-size:1.15rem;padding:1px 9px;border-radius:999px;color:#10151f}
.pgx .pm.g{background:#2fc7c3}.pgx .pm.r{background:#ffc83a}
.pgx .pe{font-style:normal;font-size:1.5rem;color:var(--mute)}
.pgx .pv{font-size:2.3rem;color:var(--acc2);line-height:1;text-shadow:0 0 14px rgba(255,200,40,.7)}

/* ================= текстурные плашки (ui/panel.webp — рамка 9-slice, ui/plate.webp — «камень» внутри) =================
   Рамка тянется под любой размер, углы с заклёпками не искажаются. Толщина рамки --pb, затемнение под текст --tint. */
.panel,.directive,.directive.me,.plate,.act,.act.bagp,.mebar,.toast,.lotinfo,.scoretbl,.pgtip,.log,.sheet{
  --pb:12px;--tint:rgba(16,9,4,.42);--mute:#d6c7a2;
  background:linear-gradient(var(--tint),var(--tint)),url(ui/plate.webp) center/cover no-repeat,#4a3822;
  background-clip:padding-box;
  border:var(--pb) solid transparent;
  border-image:url(ui/panel.webp) 62 72 / var(--pb) calc(var(--pb) * 1.2) stretch;
  border-radius:0;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.directive{--pb:11px;padding:1px 6px}
.directive.me{--tint:rgba(100,60,0,.36);color:var(--acc2)}
.plate{--pb:9px;padding:1px 5px 2px}
.seat.sell .plate{box-shadow:0 0 14px rgba(111,211,255,.85)}
.act,.act.bagp{--pb:16px;padding:2px 6px}
.act.bagp .bx{right:16px;top:14px}
.mebar{--pb:16px;padding:0 4px}
.toast{--pb:12px;padding:0 6px;--tint:rgba(125,16,26,.55)}
.lotinfo{--pb:10px;padding:0 4px}
.scoretbl{--pb:13px;padding:0 2px}
.pgtip{--pb:12px;padding:0 6px}
.pgtip::after{display:none}
.log{--pb:12px;padding:0 2px;--tint:rgba(14,8,4,.58);color:#d8cbab}
.sheet{--pb:20px;padding:4px 8px;--tint:rgba(14,8,4,.6)}
.panel{--pb:22px;padding:6px 8px;--tint:rgba(14,8,4,.5)}
.rules .bar{background:rgba(30,19,10,.96);top:-4px}

/* ================= текстурные кнопки: ui/btn_yellow|ghost|blue.webp, края-«острия» не растягиваются, тянется только середина ================= */
:is(button):not(.pbtn,.xbtn,.bx){
  --cap:1.9em; --btn:url(ui/btn_yellow.webp);
  display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  min-height:2.6em;line-height:1.15;padding-top:.15em;padding-bottom:.15em;border-radius:0;
  border:solid transparent;border-width:0 var(--cap);
  border-image:var(--btn) 0 94 0 94 fill / 0 var(--cap) 0 var(--cap) stretch;
  background:none;box-shadow:none;color:#2b1c00;text-shadow:0 1px 0 rgba(255,236,170,.45);
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));transition:filter .12s,transform .08s
}
:is(button):not(.pbtn,.xbtn,.bx):not(:disabled):hover{filter:drop-shadow(0 3px 3px rgba(0,0,0,.5)) brightness(1.13)}
:is(button):not(.pbtn,.xbtn,.bx):not(:disabled):active{transform:translateY(1px);filter:drop-shadow(0 1px 2px rgba(0,0,0,.5)) brightness(.95)}
:is(button):not(.pbtn,.xbtn,.bx):disabled{filter:drop-shadow(0 3px 3px rgba(0,0,0,.4)) grayscale(.75) brightness(.8);opacity:.6}
button.ghost:not(.pbtn,.xbtn,.bx){--btn:url(ui/btn_ghost.webp);color:var(--ink);text-shadow:0 1px 2px #000}
.hud .btns button,button.chgb{--btn:url(ui/btn_blue.webp);color:#eef3ff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
button.chgb,button.sortb{gap:6px}
@media (max-width:700px){:is(button):not(.pbtn,.xbtn,.bx){--cap:1.5em}}

/* ================= плашка соседа: крупнее, значки вместо текста ================= */
.plate{--pb:10px;padding:3px 12px 5px;gap:5px;font-size:1rem}
.plate .r1{gap:9px}
.plate .nm{font-weight:800;font-size:1.2rem;letter-spacing:.02em;color:#fff}
.plate .sta{color:#ffd23f;font-size:1.25rem;line-height:1;text-shadow:0 0 8px rgba(255,200,40,.7)}
.plate .sta:empty{display:none}
.plate .cnt{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.25);padding:1px 9px 1px 6px;border-radius:999px;font-size:1.1rem;font-weight:900;color:#fff}
.cb{display:inline-block;flex:none;width:15px;height:23px;background:url(cards/back.webp) center/100% 100% no-repeat;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.6)}
.plate .chips{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap}
.plate .chips:empty{display:none}
.chip{display:flex;align-items:center;gap:5px;padding:2px 10px 2px 6px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.28);font-weight:800;font-size:1rem;color:#fff}
.chip i{display:inline-block;flex:none;width:21px;height:21px;background:center/contain no-repeat}
.chip i.cb{width:14px;height:22px;background:url(cards/back.webp) center/100% 100% no-repeat}
.chip i.ci{background-image:url(ui/coin10.webp)}
.chip i.si{background-image:url(ui/seal.webp);width:23px;height:23px}
.chip.done{background:rgba(35,115,58,.65);border-color:#7be28f;color:#e2ffe9}
.plate .st{font-size:.95rem;font-weight:700;max-width:280px}

/* ================= верхние плашки — по ширине текста, с запасом по краям ================= */
.directive{width:max-content;max-width:calc(100vw - 2 * (var(--pw) + 24px));padding:3px 28px}
.toast{width:max-content;padding:0 24px}

/* ================= поля ввода: тёмно-синяя текстура ================= */
input:not([type=checkbox],[type=radio]){
  --cap:1.9em;min-height:2.6em;padding:.2em .15em;border-radius:0;border:solid transparent;border-width:0 var(--cap);
  border-image:url(ui/btn_input.webp) 0 94 0 94 fill / 0 var(--cap) 0 var(--cap) stretch;
  background:none;box-shadow:none;color:#eaf0ff;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));transition:filter .12s}
input:not([type=checkbox],[type=radio])::placeholder{color:rgba(190,208,245,.5)}
input:not([type=checkbox],[type=radio]):focus{outline:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)) brightness(1.3)}
.price .pnum{--cap:56px;width:250px;min-height:0;height:78px;padding:0}
.chat input{--cap:1.7em}
@media (max-width:700px){input:not([type=checkbox],[type=radio]){--cap:1.5em}}

/* ================= колода: стопка с толщиной по числу карт, бумажные плашки со счётом ================= */
@property --th{syntax:'<length>';inherits:false;initial-value:8px}
.deck{--th:8px;transition:--th .6s ease-out;border-radius:9px;filter:drop-shadow(0 calc(var(--th)*.35 + 3px) 4px rgba(0,0,0,.55)) drop-shadow(0 0 10px rgba(0,0,0,.35));background:none}
/* вид «снизу вверх»: видна только верхняя карта (чуть в перспективе) и тонкий срез стопки внизу — боковин нет */
.deck .dk-f{position:absolute;inset:0;z-index:1;background:url(cards/back.webp) center/100% 100% no-repeat;transform-origin:50% 100%;
  transform:perspective(380px) rotateX(14deg);filter:drop-shadow(0 0 1px rgba(0,0,0,.9))}
.deck::before{content:"";position:absolute;left:3%;right:3%;top:90%;bottom:calc(var(--th) * -1);z-index:0;border-radius:0 0 11px 11px / 0 0 7px 7px;
  background:linear-gradient(90deg,rgba(0,0,0,.45),transparent 8%,transparent 92%,rgba(0,0,0,.45)),
             linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,0) 35%,rgba(0,0,0,.35)),
             repeating-linear-gradient(180deg,#76828f 0 1px,#3b4551 1px 2px);
  box-shadow:inset 0 0 0 1px rgba(10,12,18,.8)}
.deck.nudge{animation:decknudge .38s ease-out}
@keyframes decknudge{0%{transform:translate(0,0)}30%{transform:translate(0,-4px)}100%{transform:translate(0,0)}}
.deck-l,.disc-l{margin-top:104px;padding:9px 26px 11px;font-size:.95rem;font-weight:800;color:#3a2410;text-shadow:none;
  background:url(ui/paper.webp) 0 0/100% 100% no-repeat;filter:drop-shadow(0 3px 3px rgba(0,0,0,.55));transform:translateX(-50%) rotate(-2.5deg)}
.disc-l{transform:translateX(-50%) rotate(2deg)}
.deck-l b,.disc-l b{font-size:1.25em;color:#6b1a10;margin-left:3px}

/* кнопка «Сортировка руки»: читаемый шрифт, тёмный жирный текст со светлым ореолом */
.sortb{font-family:system-ui,'Segoe UI',Roboto,Arial,sans-serif;font-size:1.02rem;font-weight:900;letter-spacing:.02em;color:#1b0f00;
  text-shadow:0 0 3px rgba(255,236,170,.95),0 1px 0 rgba(255,236,170,.9)}

/* ================= главное меню и лобби на фоне-картинке =================
   .stage — это картинка 1674×940, растянутая «cover»; всё внутри позиционируется в процентах и масштабируется шрифтом. */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0}
.screen.menuscr{padding:0;min-height:100vh;height:100vh;overflow:hidden;position:relative;background:#120505}
.screen.menuscr.on{display:block}
.menuscr .stage{position:absolute;left:50%;top:50%;width:max(100vw,177.9vh);aspect-ratio:1674/940;transform:translate(-50%,-50%);
  background:url(ui/menu_bg.webp) center/100% 100% no-repeat;font-size:max(1.0155vw,1.807vh)}
.panel.mpanel{position:absolute;left:39.3%;top:59.1%;width:21.4%;height:36.6%;padding:.5em .6em;gap:.5em;justify-content:center;
  --pb:14px;filter:drop-shadow(0 .4em .6em rgba(0,0,0,.6))}
.mpanel input,.mpanel button{font-size:1em}
.mpanel .row{gap:.5em}
.mpanel .err{min-height:0;font-size:.82em;text-align:center}
.mpanel .err:empty{display:none}
.panel.mpanel.lob{top:auto;bottom:3.8%;height:auto;max-height:78%;left:38.3%;width:23.4%;justify-content:flex-start;overflow:auto}
.mpanel .lh{margin:0;text-align:center;font-size:1.5em;font-weight:400;letter-spacing:.04em;line-height:1}
.mpanel .code{font-size:2.1em}
.menuscr .ver{position:absolute;left:4%;bottom:3.4%;margin:0;color:#d6c7a2;font-size:.75em;text-shadow:0 1px 2px #000}

/* «Сортировка руки»: прежний шрифт игры, кнопка шире, текст с обводкой */
.sortb{font-family:inherit;font-size:1.05rem;font-weight:400;letter-spacing:.06em;word-spacing:.15em;color:#fff4d2;white-space:nowrap;
  -webkit-text-stroke:2.6px #3a1c00;paint-order:stroke fill;
  text-shadow:0 1px 0 #3a1c00,0 2px 3px rgba(0,0,0,.6)}
@media (min-width:701px){.sortb{min-width:226px;justify-content:center;gap:12px;padding-left:20px;padding-right:26px}}
</style>
</head>
<body>

<!-- ЭКРАН 1: вход -->
<section id="home" class="screen menuscr on">
 <div class="stage">
  <h1 class="vh">Честное Купеческое!</h1>
  <div class="panel mpanel">
    <input id="name" maxlength="16" placeholder="Твоё имя" autocomplete="off">
    <button id="create">Создать лобби</button>
    <button id="testBtn" class="ghost">Тест итогов (временно)</button>
    <div class="row">
      <input id="joinCode" maxlength="5" placeholder="КОД" autocomplete="off" style="text-transform:uppercase;letter-spacing:.3em;text-align:center">
      <button id="join" class="ghost">Войти</button>
    </div>
    <div class="err" id="homeErr"></div>
    <button id="rulesHome" class="ghost">📜 Правила игры</button>
  </div>
  <div class="ver" id="ver"></div>
 </div>
</section>

<!-- ЭКРАН 2: лобби -->
<section id="lobby" class="screen menuscr">
 <div class="stage">
  <div class="panel mpanel lob">
    <h2 class="lh">Лобби</h2>
    <div class="hint">Код для друзей (нажми, чтобы выделить)</div>
    <div class="code" id="roomCode">-----</div>
    <ul class="players" id="plist"></ul>
    <button id="start" disabled>Начать игру</button>
    <div class="hint" id="lobbyHint"></div>
    <button id="rulesLobby" class="ghost">📜 Правила игры</button>
    <button id="leave" class="ghost">Выйти</button>
  </div>
  <div class="ver" id="ver2"></div>
 </div>
</section>

<!-- ЭКРАН 3: стол -->
<section id="game" class="screen">
  <div class="bgimg" id="bgImg"></div>
  <div class="hud">
    <div>Код: <span class="code" id="gameCode"></span><div class="hint" id="ver3" style="text-align:left"></div></div>
    <div class="dayinfo" id="dayinfo"></div>
    <div class="btns">
      <button id="sndBtn" class="ghost" title="Звук вкл/выкл">🔊</button>
      <button id="rulesBtn" class="ghost">Правила</button>
      <button id="cheat" class="ghost">Памятка</button>
      <button id="ping" class="ghost">Тест связи</button>
      <button id="exit" class="ghost">Выйти</button>
    </div>
  </div>
  <div class="directive" id="directive"></div>
  <div class="midmsg" id="midMsg"></div>
  <div class="table" id="table">
    <div class="felt"></div>
    <div class="deck" id="deck" title="Колода"><i class="dk-f"></i></div>
    <div class="deck-l" id="deckL">колода</div>
    <div class="disc" id="disc" title="Открыть сброс"></div>
    <div class="disc-l" id="discL">сброс</div>
    <div class="bank" id="bank"><div class="purse" id="bankPiles"></div><div class="bl">Банк</div></div>
    <div class="sealpile" id="sealPile"><div class="stack" id="sealStack"></div><div class="bl">Печати купцов</div></div>
    <div class="lotzone" id="lotzone">
      <div class="slots" id="slots"></div>
      <div class="lotgo" id="lotgo"></div>
      <div class="lotinfo" id="lotinfo"></div>
    </div>
    <div class="seats" id="seats"></div>
  </div>
  <div class="mebar" id="mebar"></div>
  <div class="toast" id="toast"></div>
  <div class="act" id="act"></div>
  <div class="chat">
    <div class="log" id="log"></div>
    <input id="chatIn" maxlength="140" placeholder="Слухи и разговоры (Enter)" autocomplete="off">
  </div>
  <div class="hand" id="hand"></div>
  <div class="scoretbl" id="scoreTbl"></div>
  <div class="pgtip" id="pgTip"></div>
  <button class="chgb" id="chgBtn" title="Поменять монеты в Банке без потерь"></button>
  <button class="sortb" id="sortBtn" title="Разложить карты по порядку"><span class="bk"></span><span class="bk"></span><span class="tx">Сортировка руки</span></button>
  <div class="modal" id="priceM"><div class="sheet price" id="priceS"></div></div>
  <div class="modal" id="cheatM"><div class="sheet" id="cheatS"></div></div>
  <div class="fx" id="finalX"><div class="fxhead" id="fxHead"></div><div class="fxst" id="fxSt"></div><div class="fxbar" id="fxBar"></div><button class="ghost fxskip" id="fxSkip">Пропустить анимацию</button></div>
  <div class="modal" id="discM"><div class="sheet" id="discS"></div></div>
  <div class="modal" id="changeM"><div class="sheet" id="changeS"></div></div>
  <div class="modal" id="sealM"><div class="sheet" id="sealS"></div></div>
</section>
<div class="modal" id="rulesM"><div class="sheet rules" id="rulesS"></div></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* =========================================================
   ДВИЖОК ИГРЫ «Честное Купеческое!» (работает только у хоста, DOM не трогает).
   S — публичное состояние (его получают все), H — тайное (колода, руки, содержимое лота).
   Любое действие игрока приходит в handle(pid, m) → меняет S/H → commit() рассылает всё.
   ========================================================= */
/*ENGINE-START*/
const VERSION = 'alpha 0.1.27';

/* Числа из правил. Если что-то захочется подкрутить — это здесь. */
const RULES = {
  startCards: 6,         // стартовых карт (берёт сам игрок из колоды)
  startCoins: 20,        // стартовых монет (берёт сам игрок из Банка)
  morningCoins: 5,       // монет за утренний подвоз (и в последний день тоже)
  supplyCards: 2,        // карт за каждый подвоз (утром и вечером; в последний день карты не раздаются)
  firstDaySupply: false, // в 1-й день утреннего подвоза нет: игроки только что получили стартовые ресурсы (true — подвоз и в 1-й день)
  freeCard: 1,           // карта продавцу за проданный лот
  buyCost: 4, buyMax: 2, // докупка карт после продажи: цена и максимум
  askCost: 2,            // Расспрос
  openCost: 3,           // Вскрытие
  sealMin: 10,           // Печать купца: платишь последнюю ставку, но не меньше 10
  byPlayers: {           // игроков → ярмарочных дней
    2: {days: 5},        // тестовый режим (в правилах его нет)
    3: {days: 5},
    4: {days: 4},
    5: {days: 3}
  }
};
const DEN = [1, 5, 10];  // номиналы монет

const PRODUCTS = [
  {id:'cheese', name:'Сыр'}, {id:'bread', name:'Хлеб'}, {id:'apple', name:'Яблоки'},
  {id:'spice', name:'Пряности'}, {id:'silk', name:'Шёлк'}, {id:'banana', name:'Бананы'}
];
const PORD = PRODUCTS.map(p => p.id);
const prodName = id => PRODUCTS.find(p => p.id === id).name;

/* Карты: ключ → {name, kind, prod, n}. kind: simple/gentry/royal/spoiled — товары; rat/pest — Напасти; cat/auditor — помощники. */
const CARDS = {};
const defCard = (k, name, kind, prod, n) => { CARDS[k] = {k, name, kind, prod: prod || null, n}; };
[ // товар, [простой], [господский], [королевский], [испорченный], [вредитель]
  ['cheese', ['cheese','Сыр'],    ['gouda','Гауда'],         ['blue','Голубой сыр'],   ['wormy','Червивый сыр'],        ['pest_cheese','Сырный клещ']],
  ['bread',  ['bread','Хлеб'],    ['wheat','Пшеничный хлеб'],['rich','Сдобный хлеб'],  ['moldy','Заплесневелый хлеб'],  ['pest_bread','Амбарный долгоносик']],
  ['apple',  ['apple','Яблоки'],  ['green','Зелёные яблоки'],['gold','Золотые яблоки'],['rotten','Гнилые яблоки'],      ['pest_apple','Яблонная плодожорка']],
  ['spice',  ['pepper','Перец'],  ['cinnamon','Корица'],     ['saffron','Шафран'],      ['damp','Отсыревшие пряности'],  ['pest_spice','Жук-точильщик']],
  ['silk',   ['silk','Шёлк'],     ['wild','Дикий шёлк'],     ['spider','Паучий шёлк'],  ['soaked','Мочёный шёлк'],       ['pest_silk','Платяная моль']],
  ['banana', ['banana','Банан'],  ['cavendish','Кавендиш'],  ['gros','Гро Мишель'],     ['black','Чёрные бананы'],       ['pest_banana','Панамская болезнь']]
].forEach(([prod, s, g, r, sp, pe]) => {
  defCard(s[0], s[1], 'simple', prod, 10);
  defCard(g[0], g[1], 'gentry', prod, 2);
  defCard(r[0], r[1], 'royal', prod, 1);
  defCard(sp[0], sp[1], 'spoiled', prod, 4);
  defCard(pe[0], pe[1], 'pest', prod, 1);
});
defCard('rat', 'Крыса', 'rat', null, 4);
defCard('cat', 'Кот', 'cat', null, 5);
defCard('auditor', 'Ревизор', 'auditor', null, 5);
const DECK_SIZE = Object.values(CARDS).reduce((a, c) => a + c.n, 0);   // 122

const isGood = c => { const k = CARDS[c.k].kind; return k === 'simple' || k === 'gentry' || k === 'royal' || k === 'spoiled'; };
const isNap  = c => { const k = CARDS[c.k].kind; return k === 'rat' || k === 'pest'; };
const RANK = {simple:0, gentry:1, royal:2, spoiled:3};
const SORT_SPECIAL = {rat:0, pest:1, cat:2, auditor:3};
const sortKey = c => { const d = CARDS[c.k]; return d.kind in RANK ? PORD.indexOf(d.prod) * 10 + RANK[d.kind] : 100 + SORT_SPECIAL[d.kind] * 10 + (d.prod ? PORD.indexOf(d.prod) : 0); };

function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makeDeck(){
  const d = []; let id = 1;
  Object.values(CARDS).forEach(c => { for (let i = 0; i < c.n; i++) d.push({id: id++, k: c.k}); });
  return shuffle(d);
}

/* ---------- подсчёт очков ---------- */
const tri = n => n * (n + 1) / 2;       // 1, 3, 6, 10, 15, 21, 28, 36, 45, 55
function partyStats(cards, prod){
  let s = 0, c = 0, g = 0, r = 0;
  cards.forEach(x => {
    const d = CARDS[x.k]; if (d.prod !== prod) return;
    if (d.kind === 'simple') s++; else if (d.kind === 'spoiled') c++; else if (d.kind === 'gentry') g++; else if (d.kind === 'royal') r++;
  });
  const n = Math.max(0, s - c), base = tri(n), mult = Math.pow(2, g) * Math.pow(3, r);
  return {prod, s, c, g, r, n, base, mult, value: base * mult, size: s + c + g + r};
}

/* ---------- состояния ---------- */
const HOOK = {broadcast(){}, hand(id, cards, newIds){}, peek(id, data){}};   // сюда подключается сеть
const newState = () => ({phase:'lobby', players:[], log:[], gid:0, seq:0, evts:[], deckN:0, discN:0, discTop:null, disc:[],
  day:0, days:0, round:'m', starost:null, seller:null, step:null, turn:null, lot:null, auction:null, info:null, final:null, notice:'',
  todo:null, takeTitle:'', pay:null});
const newH = () => ({deck:[], discard:[], hands:{}, sentIds:{}, peeks:[], lotCards:[], lotNo:0, insp:null, auc:null, res:null, turns:0, next:null, bought:0, got:[]});
const mkPlayer = (id, name, host) => ({id, name, host: !!host, count:0, coins:0, purse:{1:0, 5:0, 10:0}, seal:0, selN:0});   // seal: 0 — не взята, 1 — у игрока, 2 — использована
let S = newState();
let H = newH();

const pl = id => S.players.find(p => p.id === id);
const hand = id => H.hands[id] || (H.hands[id] = []);
const cnt = (id, f) => hand(id).filter(f).length;
const idxOf = id => S.players.findIndex(p => p.id === id);
const leftOf = id => S.players[(idxOf(id) + 1) % S.players.length].id;
function orderFrom(startId, skipFirst){          // по часовой, начиная со startId (порядок игроков = порядок за столом)
  const n = S.players.length, s = idxOf(startId), out = [];
  for (let k = 0; k < n; k++) out.push(S.players[(s + k) % n].id);
  return skipFirst ? out.slice(1) : out;
}
const sortHand = id => hand(id).sort((a, b) => sortKey(a) - sortKey(b) || a.id - b.id);
const hasAuditor = id => hand(id).some(c => c.k === 'auditor');
const cname = c => CARDS[c.k].name;

const CHAT_COL = ['#ff8a8a', '#6fd3ff', '#7be28f', '#ffd23f', '#d79bff'];     // цвета игроков в чате
function addLog(s){ S.log.push({c:0, s}); if (S.log.length > 80) S.log.splice(0, S.log.length - 80); }
function addChat(name, s){ S.log.push({c:1, n:name, s, ci: Math.max(0, S.players.findIndex(x => x.name === name))}); if (S.log.length > 80) S.log.splice(0, S.log.length - 80); }
function emit(type, o){ S.evts.push(Object.assign({seq: ++S.seq, type}, o || {})); }
function peek(to, data){ H.peeks.push({to, data}); }
function note(s){ emit('note', {s}); }

/* ---------- монеты ---------- */
const sync = p => { p.coins = p.purse[1] + 5 * p.purse[5] + 10 * p.purse[10]; };
const coinSum = c => c[1] + 5 * c[5] + 10 * c[10];
const coinText = c => DEN.filter(d => c[d]).map(d => c[d] + '×' + d).join(' + ') || '0';
/* Забрать у игрока ровно amount монет именно теми монетами, которые он выбрал. Возвращает набор монет или null. */
function takeOut(p, coins, amount){
  if (!coins || typeof coins !== 'object') return null;
  const c = {}; let sum = 0;
  for (const d of DEN){
    const n = Number(coins[d] || 0);
    if (!Number.isInteger(n) || n < 0 || n > p.purse[d]) return null;
    c[d] = n; sum += n * d;
  }
  if (sum !== amount) return null;
  DEN.forEach(d => { p.purse[d] -= c[d]; }); sync(p);
  return c;
}
/* подбор монет под точную сумму из кошелька */
function findExact(pu, amt){
  let best = null;
  for (let a = 0; a <= Math.min(pu[10], Math.floor(amt / 10)); a++)
    for (let b = 0; b <= Math.min(pu[5], Math.floor((amt - 10 * a) / 5)); b++){
      const r = amt - 10 * a - 5 * b; if (r > pu[1]) continue;
      const n = a + b + r; if (!best || n < best.n) best = {n, 1: r, 5: b, 10: a};
    }
  return best && {1: best[1], 5: best[5], 10: best[10]};
}
/* платёж на точную сумму; если ровно не набирается — Банк сам разменивает (бесплатно) */
function payExact(p, amt){
  for (let g = 0; g < 40 && !findExact(p.purse, amt); g++){
    if (p.purse[5] > 0){ p.purse[5]--; p.purse[1] += 5; }
    else if (p.purse[10] > 0){ p.purse[10]--; p.purse[5] += 2; }
    else break;
  }
  const f = findExact(p.purse, amt);
  return f ? takeOut(p, f, amt) : null;
}
function putIn(p, c){ DEN.forEach(d => { p.purse[d] += c[d]; }); sync(p); }
function doChange(pid, m){          // размен монет с Банком (всегда бесплатный, сумма не меняется)
  const u = pl(pid).purse;
  if (m.op === 'b10' && u[10] > 0){ u[10]--; u[5] += 2; }
  else if (m.op === 'b5' && u[5] > 0){ u[5]--; u[1] += 5; }
  else if (m.op === 'm1' && u[1] >= 5){ u[1] -= 5; u[5]++; }
  else if (m.op === 'm5' && u[5] >= 2){ u[5] -= 2; u[10]++; }
  else return;
  sync(pl(pid));
}

/* Разослать всё: сначала руки и тайные подсказки, потом общее состояние. */
function commit(){
  S.players.forEach(p => { p.count = hand(p.id).length; sync(p); });
  S.deckN = H.deck.length; S.discN = H.discard.length;
  S.disc = H.discard.map(c => c.k);
  const top = H.discard[H.discard.length - 1]; S.discTop = top ? top.k : null;
  S.players.forEach(p => {
    const h = hand(p.id), prev = H.sentIds[p.id], sig = h.map(c => c.id).join(',');
    if (prev && prev.sig === sig) return;
    const old = new Set(prev ? prev.ids : []);
    const newIds = prev ? h.filter(c => !old.has(c.id)).map(c => c.id) : [];
    H.sentIds[p.id] = {sig, ids: h.map(c => c.id)};
    HOOK.hand(p.id, h.map(c => ({id: c.id, k: c.k})), newIds);
  });
  H.peeks.splice(0).forEach(x => HOOK.peek(x.to, x.data));
  HOOK.broadcast();
}

/* ---------- «берём сами»: карты, монеты и Печать игроки берут руками ----------
   todo[id] = {t: сколько всего надо взять, l: сколько ещё осталось}. Когда у всех «осталось» = 0 — игра идёт дальше (H.next). */
function setTodo(map, next, title){
  S.todo = {};
  Object.keys(map).forEach(id => {
    const t = Object.assign({cards:0, coins:0, seal:0}, map[id]);
    S.todo[id] = {t, l: Object.assign({}, t)};
  });
  S.step = 'take'; S.turn = null; S.takeTitle = title; S.info = null; H.next = next;
  checkTodo();
}
function checkTodo(){
  if (S.step !== 'take' || !S.todo) return;
  if (!H.deck.length){
    let lost = false;
    Object.values(S.todo).forEach(x => { if (x.l.cards > 0){ x.l.cards = 0; lost = true; } });
    if (lost) addLog('Колода закончилась — карт больше нет');
  }
  const open = Object.values(S.todo).some(x => x.l.cards > 0 || x.l.coins > 0 || x.l.seal > 0);
  if (open) return;
  S.todo = null;
  const f = H.next; H.next = null;
  if (f) f();
}
function doTake(pid, m){
  if (S.step !== 'take' || !S.todo || !S.todo[pid]) return;
  const t = S.todo[pid].l, p = pl(pid);
  if (m.what === 'card'){
    if (t.cards > 0 && H.deck.length){ hand(pid).push(H.deck.pop()); t.cards--; sortHand(pid); emit('draw', {by: pid, n: 1}); }
  } else if (m.what === 'coin'){
    const d = Number(m.d);
    if (DEN.includes(d) && t.coins >= d){ p.purse[d]++; t.coins -= d; sync(p); emit('coins', {from:'bank', to:pid, c:{1:d === 1 ? 1 : 0, 5:d === 5 ? 1 : 0, 10:d === 10 ? 1 : 0}}); }
  } else if (m.what === 'coinsAuto'){        // удобство: добрать весь остаток монетами покрупнее
    if (t.coins > 0){
      const c = {1:0, 5:0, 10:0}; let r = t.coins;
      c[10] = Math.floor(r / 10); r -= c[10] * 10; c[5] = Math.floor(r / 5); r -= c[5] * 5; c[1] = r;
      putIn(p, c); t.coins = 0; emit('coins', {from:'bank', to:pid, c});
    }
  } else if (m.what === 'seal'){
    if (t.seal > 0){ p.seal = 1; t.seal = 0; addLog(p.name + ' берёт Печать купца'); emit('sealtake', {by: pid}); }
  }
  checkTodo();
}

/* ---------- ход игры: день → подвоз → круг продавцов ---------- */
function startGame(){
  const n = S.players.length, cfg = RULES.byPlayers[n];
  if (!cfg) return false;
  const gid = S.gid + 1;
  H = newH();
  S.phase = 'game'; S.gid = gid; S.seq = 0; S.evts = []; S.log = []; S.final = null; S.notice = '';
  S.lot = null; S.auction = null; S.info = null; S.step = null; S.turn = null; S.pay = null; S.todo = null;
  H.deck = makeDeck();
  S.players.forEach(p => { H.hands[p.id] = []; p.purse = {1:0, 5:0, 10:0}; p.seal = 0; p.selN = 0; sync(p); });
  S.days = cfg.days; S.day = 1; S.round = 'm';
  S.starost = S.players[Math.random() * n | 0].id;
  addLog('Игра началась: ' + n + ' игр., ' + cfg.days + ' дн. Каждый берёт ' + RULES.startCards + ' карт из колоды, ' + RULES.startCoins + ' монет из Банка и свою Печать');
  const m = {}; S.players.forEach(p => { m[p.id] = {cards: RULES.startCards, coins: RULES.startCoins, seal: 1}; });
  setTodo(m, beginDay, 'Раздача');
  return true;
}

function beginDay(){
  const last = S.day === S.days, first = S.day === 1;
  addLog('— День ' + S.day + ' из ' + S.days + (last ? ' (последний: карты не раздаются)' : '') + '. Староста рынка: ' + pl(S.starost).name + ' —');
  S.round = 'm';
  if (first && !RULES.firstDaySupply) return beginRound();
  const m = {}; S.players.forEach(p => { m[p.id] = {cards: last ? 0 : RULES.supplyCards, coins: RULES.morningCoins}; });
  setTodo(m, beginRound, 'Утренний подвоз');
}
function beginRound(){ H.turns = 0; nextSeller(); }
function nextSeller(){
  if (H.turns >= S.players.length) return endRound();
  const sid = orderFrom(S.starost)[H.turns++];
  S.lot = null; S.auction = null; S.info = null; S.pay = null; H.lotCards = [];
  if (hand(sid).length < 3){
    addLog(pl(sid).name + ' пропускает торговый ход (меньше 3 карт)');
    return nextSeller();
  }
  S.seller = sid; S.step = 'compose'; S.turn = sid;
  addLog('Торгует ' + pl(sid).name + (S.round === 'm' ? ' (утро)' : ' (вечер)'));
}
function endRound(){
  const last = S.day === S.days;
  if (S.round === 'm'){
    S.round = 'e';
    if (!last){
      const m = {}; S.players.forEach(p => { m[p.id] = {cards: RULES.supplyCards}; });
      return setTodo(m, beginRound, 'Вечерний подвоз');
    }
    beginRound();
  } else {
    if (last) return finishGame();
    S.day++; S.starost = leftOf(S.starost);
    beginDay();
  }
}

/* ---------- торговый ход ---------- */
function doLot(pid, m){
  if (S.step !== 'compose' || S.turn !== pid) return;
  const ids = m.ids;
  if (!Array.isArray(ids) || ids.length !== 3 || new Set(ids).size !== 3) return;
  const price = Math.floor(Number(m.price));
  if (!(price >= 1) || price > 9999) return;
  const h = hand(pid), cards = ids.map(id => h.find(c => c.id === id));
  if (cards.some(c => !c)) return;
  H.hands[pid] = h.filter(c => !ids.includes(c.id));
  H.lotCards = cards;
  S.lot = {n: ++H.lotNo, price, cards: [{open:false}, {open:false}, {open:false}], opened: false, qa: []};
  pl(pid).selN = 0;
  emit('lot', {by: pid});
  peek(pid, {lot: S.lot.n, own: true, cards: cards.map(c => c.k)});
  addLog(pl(pid).name + ' выкладывает закрытый лот из 3 карт. Цена от ' + price);
  S.step = 'showcase'; S.turn = pid;
}
function reveal(i){ S.lot.cards[i] = {open: true, k: H.lotCards[i].k}; }

function doShowcase(pid, m){
  if (S.step !== 'showcase' || S.turn !== pid) return;
  const i = m.i;
  if (i === -1){ addLog('Витрина: продавец ничего не открывает'); return startInspection(); }
  if (!(i >= 0 && i < 3) || S.lot.cards[i].open) return;
  reveal(i);
  addLog('Витрина: карта ' + (i + 1) + ' лежит лицом вверх — «' + cname(H.lotCards[i]) + '»');
  startInspection();
}

/* осмотр: каждый покупатель по очереди (слева от продавца) — одно действие или пропуск */
function startInspection(){ H.insp = {order: orderFrom(S.seller, true), pos: 0}; nextInspector(); }
const canInspect = id => pl(id).coins >= RULES.askCost || hasAuditor(id);
function nextInspector(){
  const I = H.insp;
  while (I.pos < I.order.length && !canInspect(I.order[I.pos])) I.pos++;
  if (I.pos >= I.order.length) return startAuction();
  S.step = 'inspect'; S.turn = I.order[I.pos]; S.info = null;
}
function doInsp(pid, m){
  if (S.step !== 'inspect' || S.turn !== pid) return;
  const p = pl(pid), I = H.insp;
  if (m.a === 'skip'){ I.pos++; return nextInspector(); }
  if (m.a === 'ask'){
    const q = String(m.q || '').trim().slice(0, 100);
    if (!q || p.coins < RULES.askCost) return;
    const c = takeOut(p, m.coins, RULES.askCost); if (!c) return;
    putIn(pl(S.seller), c); emit('coins', {from: pid, to: S.seller, c});
    S.step = 'answer'; S.turn = S.seller; S.info = {by: pid, q};
    addLog(p.name + ' платит ' + RULES.askCost + ' продавцу ' + pl(S.seller).name + ' (расспрос): «' + q + '»');
    return;
  }
  if (m.a === 'open'){          // шаг 1: оплата (монеты уходят продавцу), шаг 2 — выбор карты (doOpenPick)
    if (p.coins < RULES.openCost || S.lot.opened || !S.lot.cards.some(c => !c.open)) return;
    const c = takeOut(p, m.coins, RULES.openCost); if (!c) return;
    putIn(pl(S.seller), c); emit('coins', {from: pid, to: S.seller, c});
    S.lot.opened = true;
    S.step = 'openpick'; S.turn = pid;
    addLog(p.name + ' платит ' + RULES.openCost + ' продавцу ' + pl(S.seller).name + ' (вскрытие)');
    return;
  }
  if (m.a === 'auditor'){
    const h = hand(pid), ix = h.findIndex(c => c.id === m.id && c.k === 'auditor');
    if (ix < 0) return;
    H.discard.push(h.splice(ix, 1)[0]);
    peek(pid, {lot: S.lot.n, own: false, cards: H.lotCards.map(c => c.k)});
    addLog(p.name + ' сбрасывает Ревизора и тайно смотрит весь лот');
    I.pos++; return nextInspector();
  }
}
function doOpenPick(pid, m){
  if (S.step !== 'openpick' || S.turn !== pid) return;
  const i = m.i;
  if (!(i >= 0 && i < 3) || S.lot.cards[i].open) return;
  reveal(i);
  addLog(pl(pid).name + ' вскрывает карту ' + (i + 1) + ': «' + cname(H.lotCards[i]) + '»');
  H.insp.pos++; nextInspector();
}
function doAnswer(pid, m){
  if (S.step !== 'answer' || S.turn !== pid) return;
  const yes = !!m.yes, by = pl(S.info.by);
  S.lot.qa.push({by: by.name, q: S.info.q, a: yes ? 'Да' : 'Нет'});
  emit('answer', {by: by.id, yes});
  addLog('Продавец отвечает ' + by.name + ': ' + (yes ? 'ДА' : 'НЕТ'));
  H.insp.pos++; S.info = null;
  nextInspector();
}

/* торги */
const minBid = () => S.auction.by === null ? S.lot.price : S.auction.high + 1;
function startAuction(){
  H.auc = {order: orderFrom(S.seller, true), i: -1};
  S.auction = {high: 0, by: null, passed: [], stakes: {}};
  S.step = 'auction'; S.info = null;
  addLog('Торги! Цена от ' + S.lot.price);
  aucNext();
}
function aucNext(){
  const A = S.auction, O = H.auc.order;
  for (;;){
    const active = O.filter(id => !A.passed.includes(id));
    if (A.by !== null && active.every(id => id === A.by)) return sold(A.by, A.high);
    if (A.by === null && !active.length) return unsold();
    let k = H.auc.i, found = null;
    for (let t = 0; t < O.length; t++){ k = (k + 1) % O.length; if (!A.passed.includes(O[k])){ found = O[k]; break; } }
    if (found === null || found === A.by) return A.by !== null ? sold(A.by, A.high) : unsold();
    H.auc.i = k;
    if (pl(found).coins < minBid()){ A.passed.push(found); delete A.stakes[found]; addLog(pl(found).name + ': не хватает монет — пас'); continue; }
    S.turn = found; return;
  }
}
function doBid(pid, m){
  if (S.step !== 'auction' || S.turn !== pid) return;
  const amt = Math.floor(Number(m.amount));
  if (!(amt >= minBid()) || amt > pl(pid).coins) return;
  /* какими монетами игрок выложил ставку (только для показа на столе; сами монеты остаются у него до оплаты) */
  let stake = null;
  if (m.coins && typeof m.coins === 'object'){
    const c = {}; let sum = 0, ok = true;
    DEN.forEach(d => { const n = Number(m.coins[d] || 0); if (!Number.isInteger(n) || n < 0 || n > pl(pid).purse[d]) ok = false; else { c[d] = n; sum += n * d; } });
    if (ok && sum === amt) stake = c;
  }
  if (!stake){ let r = amt; stake = {10: Math.floor(r / 10)}; r -= stake[10] * 10; stake[5] = Math.floor(r / 5); stake[1] = r - stake[5] * 5; }
  S.auction.high = amt; S.auction.by = pid; S.auction.stakes[pid] = stake;   // у каждого торгующего его ставка лежит на столе, пока он не спасует
  addLog(pl(pid).name + ' ставит ' + amt);
  aucNext();
}
function doPass(pid){
  if (S.step !== 'auction' || S.turn !== pid) return;
  S.auction.passed.push(pid); delete S.auction.stakes[pid];
  addLog(pl(pid).name + ' пасует');
  aucNext();
}
/* Печать купца: после первой ставки любой покупатель (не спасовавший) говорит «Продано!». Платит последнюю ставку, но не меньше 10. */
const sealPrice = () => Math.max(S.auction.high, RULES.sealMin);
function doSeal(pid){
  const A = S.auction;
  if (S.step !== 'auction' || pid === S.seller || A.by === null || A.passed.includes(pid) || !H.auc.order.includes(pid)) return;
  const p = pl(pid), price = sealPrice();
  if (p.seal !== 1 || p.coins < price) return;
  p.seal = 2;
  addLog(p.name + ' применяет Печать купца: «Продано!» (платит ' + price + (price > A.high ? ', минимум ' + RULES.sealMin : '') + ')');
  emit('seal', {by: pid, name: p.name, amount: price});
  sold(pid, price);
  /* по Печати ставка сама доходит до 10: деньги сразу уходят продавцу, покупатель только забирает карты лота */
  const s = pl(S.pay.to), c = payExact(p, price); if (!c) return;
  putIn(s, c); emit('coins', {from: pid, to: s.id, c});
  addLog(p.name + ' платит ' + price + ' (' + coinText(c) + ') продавцу ' + s.name);
  S.pay = null; S.step = 'takelot'; S.turn = pid;
}

/* развязка: лот продан → покупатель платит → забирает лот → Напасти → карта продавцу и докупка */
function sold(bid, price){
  S.auction = null; S.info = null;
  S.pay = {amount: price, to: S.seller};
  S.step = 'pay'; S.turn = bid; H.buyer = bid;
  addLog(pl(bid).name + ' выиграл торги и платит ' + price + ' ' + pl(S.seller).name);
}
function doPay(pid, m){
  if (S.step !== 'pay' || S.turn !== pid) return;
  const p = pl(pid), s = pl(S.pay.to);
  const c = takeOut(p, m.coins, S.pay.amount); if (!c) return;
  putIn(s, c); emit('coins', {from: pid, to: s.id, c});
  addLog(p.name + ' платит ' + S.pay.amount + ' (' + coinText(c) + ') продавцу ' + s.name);
  S.pay = null; S.step = 'takelot'; S.turn = pid;
}
function doTakeLot(pid, m){          // покупатель забирает лот по одной карте: по клику на каждую карту на столе
  if (S.step !== 'takelot' || S.turn !== pid) return;
  const i = m && m.i;
  if (!(i >= 0 && i < 3) || !H.lotCards[i] || S.lot.cards[i].taken) return;
  const card = H.lotCards[i]; H.lotCards[i] = null;
  S.lot.cards[i] = {open: false, taken: true};
  hand(pid).push(card); sortHand(pid); H.got.push(card);
  emit('take', {by: pid, n: 1, i});
  if (!S.lot.cards.every(c => c.taken)) return;
  const cards = H.got; H.got = []; H.lotCards = [];
  S.lot = null; S.info = null;
  addLog(pl(pid).name + ' забирает лот');
  const naps = cards.filter(isNap).sort((a, b) => (CARDS[a.k].kind === 'pest' ? 0 : 1) - (CARDS[b.k].kind === 'pest' ? 0 : 1));
  H.res = {buyer: pid, naps, ci: 0, queue: []};
  if (naps.length) addLog('В лоте были Напасти: ' + naps.map(cname).join(', '));
  catPhase();
}
function catPhase(){                 // шаг 1: можно ли отменить Напасть Котом
  const R = H.res;
  while (R.ci < R.naps.length){
    const nap = R.naps[R.ci], cats = cnt(R.buyer, c => c.k === 'cat');
    if (cats > 0){ S.step = 'cat'; S.turn = R.buyer; S.info = {nap: nap.k, cats}; return; }
    R.queue.push(nap); R.ci++;
  }
  trigPhase();
}
function doCat(pid, m){
  if (S.step !== 'cat' || S.turn !== pid) return;
  const R = H.res, nap = R.naps[R.ci], h = hand(pid);
  if (m.use){
    const ci = h.findIndex(c => c.k === 'cat'), ni = h.findIndex(c => c.id === nap.id);
    if (ci < 0 || ni < 0) return;
    const cat = h.splice(ci, 1)[0]; const n2 = h.splice(h.findIndex(c => c.id === nap.id), 1)[0];
    H.discard.push(cat, n2);
    addLog(pl(pid).name + ' играет Кота: «' + cname(nap) + '» отменена, обе карты в сброс');
    note('Кот отменил: ' + cname(nap));
  } else R.queue.push(nap);
  R.ci++; S.info = null;
  catPhase();
}
/* Самая большая партия — по числу ВСЕХ карт товара (с господскими, королевскими и испорченными); при равенстве — дороже. */
function ratInfo(id){
  const st = PORD.map(p => partyStats(hand(id), p)).filter(x => x.size > 0);
  if (!st.length) return null;
  st.sort((a, b) => b.size - a.size || b.value - a.value);
  const top = st.filter(x => x.size === st[0].size && x.value === st[0].value);
  return {prods: top.map(x => x.prod), size: st[0].size, need: Math.min(2, st[0].size)};
}
function ratDone(B, nap, ids){
  const h = hand(B), names = [], eaten = [];
  ids.forEach(id => { const i = h.findIndex(c => c.id === id); if (i >= 0){ const c = h.splice(i, 1)[0]; names.push(cname(c)); eaten.push({id: c.id, k: c.k}); H.discard.push(c); } });
  emit('nap', {kind:'rat', by: B, cards: eaten, nap: {id: nap.id, k: nap.k}});
  const ri = h.findIndex(c => c.id === nap.id);
  if (ri >= 0) H.discard.push(h.splice(ri, 1)[0]);
  addLog('Крыса съедает у ' + pl(B).name + ': ' + (names.join(', ') || 'ничего') + '. Крыса в сброс');
  note('Крыса у ' + pl(B).name + '! ' + (eaten.length ? '−' + eaten.length + ' ' + plural(eaten.length, 'карта', 'карты', 'карт') + ' высшей партии!' : 'Есть нечего — Крыса уходит в сброс!'));
}
function trigPhase(){                // шаг 2: сначала Вредители, потом Крысы
  const R = H.res, B = R.buyer;
  while (R.queue.length){
    const nap = R.queue[0], d = CARDS[nap.k];
    if (d.kind === 'pest'){
      const h = hand(B);
      const gone = h.filter(c => isGood(c) && CARDS[c.k].prod === d.prod);
      H.hands[B] = h.filter(c => !gone.includes(c) && c.id !== nap.id);
      H.deck.push(...gone); shuffle(H.deck); H.discard.push(nap);
      emit('nap', {kind:'pest', by: B, cards: gone.map(c => ({id: c.id, k: c.k})), nap: {id: nap.id, k: nap.k}});
      addLog(d.name + ': вся партия «' + prodName(d.prod) + '» у ' + pl(B).name + ' (' + gone.length + ' карт) замешана в колоду');
      note(d.name + '! Вся партия «' + prodName(d.prod) + '» уничтожается!');
      R.queue.shift(); continue;
    }
    const ri = ratInfo(B);
    if (!ri){ ratDone(B, nap, []); R.queue.shift(); continue; }
    if (ri.prods.length === 1 && ri.size <= 2){        // выбирать нечего: уходят все карты партии
      ratDone(B, nap, hand(B).filter(c => isGood(c) && CARDS[c.k].prod === ri.prods[0]).map(c => c.id));
      R.queue.shift(); continue;
    }
    S.step = 'rat'; S.turn = B; S.info = {prods: ri.prods, need: ri.need};
    return;
  }
  afterSale();
}
function doRatPick(pid, m){
  if (S.step !== 'rat' || S.turn !== pid) return;
  const ids = m.ids, need = S.info.need;
  if (!Array.isArray(ids) || ids.length !== need || new Set(ids).size !== need) return;
  const cards = ids.map(id => hand(pid).find(c => c.id === id));
  if (cards.some(c => !c || !isGood(c))) return;
  const prod = CARDS[cards[0].k].prod;
  if (cards.some(c => CARDS[c.k].prod !== prod) || !S.info.prods.includes(prod)) return;
  const R = H.res;
  ratDone(pid, R.queue[0], ids); R.queue.shift(); S.info = null;
  trigPhase();
}

/* продажа: карта за продажу (берёт сам) + докупка за монеты (платит и берёт сам) */
function afterSale(){
  H.res = null; S.info = null; H.bought = 0;
  const sid = S.seller;
  if (H.deck.length) setTodo({[sid]: {cards: RULES.freeCard}}, buyOffer, 'Карта за продажу');
  else buyOffer();
}
function buyOffer(){
  const sid = S.seller, p = pl(sid);
  if (H.bought >= RULES.buyMax || p.coins < RULES.buyCost || !H.deck.length) return endTurn();
  S.step = 'buy'; S.turn = sid; S.info = {bought: H.bought, max: RULES.buyMax};
}
function doBuy(pid, m){
  if (S.step !== 'buy' || S.turn !== pid) return;
  if (m.stop) return endTurn();
  const p = pl(pid), n = Math.floor(Number(m.n) || 1);
  if (!(n >= 1 && n <= RULES.buyMax - H.bought && n <= H.deck.length)) return;
  const c = takeOut(p, m.coins, RULES.buyCost * n); if (!c) return;
  emit('coins', {from: pid, to: 'bank', c});
  H.bought += n;
  addLog(p.name + ' докупает ' + n + ' ' + (n === 1 ? 'карту' : 'карты') + ' за ' + RULES.buyCost * n + ' (в Банк)');
  setTodo({[pid]: {cards: n}}, buyOffer, 'Докупка карты');
}

/* развязка: лот не продан — товары открыто в сброс, специальные карты возвращаются продавцу */
function unsold(){
  const goods = [], specials = [];
  H.lotCards.forEach((c, i) => (isGood(c) ? goods : specials).push(i));
  const names = goods.map(i => cname(H.lotCards[i]));
  addLog('Лот не продан. Испортились и уходят в сброс: ' + (names.length ? names.join(', ') : 'ничего') + '. Специальных карт возвращается продавцу: ' + specials.length);
  if (!specials.length){
    H.discard.push(...goods.map(i => H.lotCards[i])); H.lotCards = [];
    if (goods.length) emit('toss', {n: goods.length});
    return endTurn();
  }
  goods.forEach(reveal);             // товары лежат лицом вверх — все видят, что испортилось
  S.auction = null; S.info = {n: specials.length, g: goods.length};
  S.step = 'return'; S.turn = S.seller;
}
function doReturn(pid){
  if (S.step !== 'return' || S.turn !== pid) return;
  const goods = H.lotCards.filter(isGood), specials = H.lotCards.filter(c => !isGood(c));
  H.discard.push(...goods); hand(pid).push(...specials); sortHand(pid); H.lotCards = [];
  if (goods.length) emit('toss', {n: goods.length});
  emit('take', {by: pid, n: specials.length});
  endTurn();
}
function endTurn(){ S.lot = null; S.auction = null; S.info = null; S.pay = null; H.res = null; nextSeller(); }

/* ---------- конец игры ---------- */
function finishGame(){
  S.phase = 'over'; S.step = 'over'; S.turn = null; S.lot = null; S.auction = null; S.info = null; S.pay = null; S.todo = null;
  const rows = S.players.map(p => {
    const h = hand(p.id), parts = PORD.map(pr => partyStats(h, pr));
    const total = parts.reduce((a, x) => a + x.value, 0);
    const groups = PORD.map(pr => {            // карты партий для пошаговой выкладки итогов
      const g = {prod: pr, sp: [], si: [], ge: [], ro: []}, to = {spoiled: g.sp, simple: g.si, gentry: g.ge, royal: g.ro};
      h.forEach(c => { const d = CARDS[c.k]; if (d.prod === pr && to[d.kind]) to[d.kind].push(c.k); });
      return g;
    }).filter(g => g.sp.length + g.si.length + g.ge.length + g.ro.length);
    return {id: p.id, name: p.name, coins: p.coins, parts, groups, total, wealth: total, simple: h.filter(c => CARDS[c.k].kind === 'simple').length};
  });
  rows.sort((a, b) => b.wealth - a.wealth || b.coins - a.coins || b.simple - a.simple);
  const t = rows[0];
  const winners = rows.filter(r => r.wealth === t.wealth && r.coins === t.coins && r.simple === t.simple).map(r => r.id);
  rows.forEach((r, i) => { const q = rows[i - 1]; r.place = (q && q.wealth === r.wealth && q.coins === r.coins && q.simple === r.simple) ? q.place : i + 1; });
  S.final = {rows, winners, order: S.players.map(p => p.id), idx: 0, stage: 'reveal', ready: {}};
  addLog('Игра окончена. Побеждает: ' + winners.map(id => pl(id).name).join(', '));
}

/* ---------- вход для действий игроков ---------- */
/* Итоги: каждый жмёт «Продолжить» — когда нажали все, показ переходит к следующему игроку, после последнего — подиум */
function finCheck(){
  const F = S.final; S.evts = [];
  if (S.phase === 'over' && F && F.stage === 'reveal' && S.players.every(p => F.ready[p.id])){
    F.ready = {}; F.idx++;
    while (F.idx < F.order.length && !pl(F.order[F.idx])) F.idx++;
    if (F.idx >= F.order.length) F.stage = 'podium';
  }
  commit();
}
function finCont(pid){
  const F = S.final; if (S.phase !== 'over' || !F || F.stage !== 'reveal' || !pl(pid)) return;
  F.ready[pid] = true; if (TEST) S.players.forEach(p => { F.ready[p.id] = true; }); finCheck();
}
function handle(pid, m){
  if (S.phase !== 'game') return;
  S.evts = [];
  switch (m.t){
    case 'select': if (S.step === 'compose' && S.turn === pid) pl(pid).selN = Math.max(0, Math.min(3, m.n | 0)); break;
    case 'take': doTake(pid, m); break;
    case 'change': doChange(pid, m); break;
    case 'lot': doLot(pid, m); break;
    case 'showcase': doShowcase(pid, m); break;
    case 'insp': doInsp(pid, m); break;
    case 'answer': doAnswer(pid, m); break;
    case 'openpick': doOpenPick(pid, m); break;
    case 'bid': doBid(pid, m); break;
    case 'pass': doPass(pid); break;
    case 'seal': doSeal(pid); break;
    case 'pay': doPay(pid, m); break;
    case 'takelot': doTakeLot(pid, m); break;
    case 'cat': doCat(pid, m); break;
    case 'ratpick': doRatPick(pid, m); break;
    case 'buy': doBuy(pid, m); break;
    case 'ret': doReturn(pid); break;
    default: return;
  }
  commit();
}
/*ENGINE-END*/

/* =========================================================
   СЕТЬ: P2P через WebRTC (PeerJS). Сервера у нас нет —
   хост лобби = «сервер», остальные подключаются к нему по коду.
   Хост ведёт игру (движок выше) и рассылает всем публичное состояние (state).
   Руки приватные: каждому игроку хост шлёт только его карты (hand),
   а тайные подсказки (содержимое своего лота, Ревизор) — отдельно (peek).
   ========================================================= */
const PREFIX = 'mycardgame-v1-';           // ПОМЕНЯЙ на уникальное, чтобы не пересечься с чужими
const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const $ = id => document.getElementById(id);

let peer = null, isHost = false, code = '';
let conns = {};                             // хост: peerId -> connection
let hostConn = null;                        // клиент: соединение с хостом

/* Арт карт: ключ -> расширение файла в папке cards/. Карты без арта рисуются просто названием.
   Чтобы добавить арт: положи cards/<ключ>.webp (или .png) и допиши строчку сюда. Ключи — в CARDS выше. */
const IMG = {bread:'webp', wheat:'webp', rich:'webp', moldy:'webp', cheese:'webp', gouda:'webp', blue:'webp', wormy:'webp', apple:'webp', green:'webp', gold:'webp', rotten:'webp', pepper:'webp', cinnamon:'webp', saffron:'webp', damp:'webp', silk:'webp', wild:'webp', spider:'webp', soaked:'webp', banana:'webp', cavendish:'webp', gros:'webp', black:'webp',
  cat:'webp', auditor:'webp', rat:'webp', pest_cheese:'webp', pest_bread:'webp', pest_apple:'webp', pest_spice:'webp', pest_silk:'webp', pest_banana:'webp'};
const CAP = {simple:'простой', gentry:'господский ×2', royal:'королевский ×3', spoiled:'порча', rat:'напасть', pest:'напасть', cat:'помощник', auditor:'помощник'};
const STEP_MSG = {compose:'выкладывает лот', showcase:'решает про витрину', inspect:'осматривает лот', answer:'отвечает на вопрос',
  auction:'торгуется', pay:'платит за лот', takelot:'забирает лот', cat:'решает, играть ли Кота', rat:'выбирает карты для Крысы',
  buy:'докупает карты', return:'забирает свои карты', openpick:'вскрывает карту'};

let myHand = [], selIds = new Set(), myPeek = null, mySrc = null;
let placed = [null, null, null], handOrder = [], autoSort = true, hd = null;   // placed — id карт, положенных на стол для лота; handOrder — порядок карт в руке (только у меня)
let lastSeq = 0, curGid = 0, tableReady = false, hideLot = false;
let slotSig = '', prevLot = null, toastT = 0, TEST = false;
const ui = {price:'', q:'', mode:null, actKey:'', tray:{1:0, 5:0, 10:0}, trayKey:'', trayAmt:0, bag:null, bagMode:false, lpLot:0, lpVal:null, lpAnim:null, stakeSigs:{}};
const seatEls = {};
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const randCode = () => Array.from({length:5}, () => ALPHABET[Math.random() * ALPHABET.length | 0]).join('');
const myName = () => ($('name').value.trim() || 'Игрок').slice(0, 16);
const myId = () => isHost ? 'host' : (peer && peer.id);
const show = id => document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
const homeErr = t => $('homeErr').textContent = t || '';
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return (m > 10 && m < 15) ? c : k === 1 ? a : (k >= 2 && k <= 4) ? b : c; };
['back', ...Object.keys(IMG)].forEach(k => { new Image().src = 'cards/' + (k === 'back' ? 'back.webp' : k + '.' + IMG[k]); });
['plaque', 'sun', 'moon'].forEach(k => { new Image().src = 'ui/' + k + '.webp'; });   // прогрев кэша

/* ---------- Хост ---------- */
HOOK.broadcast = () => { Object.values(conns).forEach(c => c.open && c.send({t:'state', state:S})); applyState(S); };
HOOK.hand = (id, cards, newIds) => { if (id === 'host') setHand(cards, newIds); else if (conns[id] && conns[id].open) conns[id].send({t:'hand', cards, newIds}); };
HOOK.peek = (id, data) => { if (id === 'host') setPeek(data); else if (conns[id] && conns[id].open) conns[id].send(Object.assign({t:'peek'}, data)); };

function createLobby(attempt = 0){
  homeErr(''); TEST = false;
  code = randCode();
  peer = new Peer(PREFIX + code);
  peer.on('open', () => {
    isHost = true;
    S = newState(); H = newH();
    S.players.push(mkPlayer('host', myName(), true));
    enterLobby(); commit();
  });
  peer.on('connection', c => {
    c.on('data', m => hostReceive(c, m));
    c.on('close', () => dropPlayer(c.peer));
    c.on('error', () => dropPlayer(c.peer));
    conns[c.peer] = c;
  });
  peer.on('error', e => {
    if (e.type === 'unavailable-id' && attempt < 5) { peer.destroy(); createLobby(attempt + 1); }
    else homeErr('Не удалось создать лобби: ' + netErr(e));
  });
}
function hostReceive(c, m){
  const pid = c.peer;
  if (m.t === 'hello'){
    if (m.ver !== VERSION) return c.send({t:'error', msg:'Версия игры не совпадает (у тебя ' + m.ver + ', у хоста ' + VERSION + '). Обнови страницу: Ctrl+F5'});
    if (S.phase !== 'lobby') return c.send({t:'error', msg:'Игра уже идёт'});
    if (S.players.length >= 5) return c.send({t:'error', msg:'Лобби заполнено (максимум 5 игроков)'});
    S.players.push(mkPlayer(pid, String(m.name || 'Игрок').slice(0, 16)));
    return commit();
  }
  const p = S.players.find(x => x.id === pid);
  if (!p) return;
  if (m.t === 'ping'){ addLog(p.name + ': пинг'); return commit(); }
  if (m.t === 'chat'){ const s = String(m.s || '').trim().slice(0, 140); if (s){ addChat(p.name, s); commit(); } return; }
  if (m.t === 'fcont'){ finCont(pid); return; }
  if (m.t === 'restart'){ if (S.phase === 'over' && S.final && S.final.stage === 'podium') backToLobby(); return; }
  handle(pid, m);
}
function backToLobby(notice){
  const keep = S.players.map(p => mkPlayer(p.id, p.name, p.host));
  const gid = S.gid;
  S = newState(); S.gid = gid; S.players = keep; S.notice = notice || ''; H = newH();
  commit();
}
function dropPlayer(id){
  delete conns[id];
  const p = S.players.find(x => x.id === id);
  if (!p) return;
  const name = p.name, inGame = S.phase === 'game';
  S.players = S.players.filter(x => x.id !== id); delete H.hands[id]; delete H.sentIds[id];
  if (inGame) backToLobby('Игра прервана: ' + name + ' отключился(ась). Начните заново');
  else if (S.phase === 'over') finCheck();
  else commit();
}

/* ---------- Клиент ---------- */
function joinLobby(){
  homeErr('');
  const c = $('joinCode').value.trim().toUpperCase();
  if (c.length !== 5) return homeErr('Код состоит из 5 символов');
  code = c;
  peer = new Peer();
  peer.on('open', () => {
    hostConn = peer.connect(PREFIX + code, {reliable:true});
    const timer = setTimeout(() => { if (!hostConn.open){ homeErr('Лобби не найдено'); leave(); } }, 8000);
    hostConn.on('open', () => { clearTimeout(timer); hostConn.send({t:'hello', name:myName(), ver:VERSION}); });
    hostConn.on('data', m => {
      if (m.t === 'state'){
        if (!$('lobby').classList.contains('on') && !$('game').classList.contains('on')) enterLobby();
        applyState(m.state);
      }
      if (m.t === 'hand') setHand(m.cards, m.newIds);
      if (m.t === 'peek') setPeek(m);
      if (m.t === 'error'){ const msg = m.msg; leave(); homeErr(msg); }
    });
    hostConn.on('close', () => { leave(); homeErr('Хост закрыл лобби'); });
  });
  peer.on('error', e => { homeErr(e.type === 'peer-unavailable' ? 'Лобби с таким кодом нет' : 'Ошибка: ' + netErr(e)); });
}
/* Понятное описание ошибки. 'network' = браузер не достучался до сервера-посредника PeerJS (0.peerjs.com). */
function netErr(e){
  const hints = {
    'network': 'нет связи с сервером PeerJS (0.peerjs.com). Проверь VPN, блокировщик рекламы/защиту от слежки, антивирус',
    'server-error': 'сервер PeerJS недоступен',
    'socket-error': 'сокет к серверу PeerJS не открылся',
    'socket-closed': 'соединение с сервером PeerJS оборвалось',
    'webrtc': 'браузер не смог установить WebRTC-соединение'
  };
  console.error('PeerJS error', e);
  return e.type + (hints[e.type] ? ' — ' + hints[e.type] : '') + (e.message ? ' [' + e.message + ']' : '');
}

/* Принять новое состояние: заранее запоминаем, откуда полетят карты и монеты, потом рисуем и анимируем */
function applyState(ns){
  if (ns.gid !== curGid){ curGid = ns.gid; lastSeq = 0; tableReady = false; slotSig = ''; prevLot = null; myPeek = null; selIds = new Set(); placed = [null, null, null]; handOrder = []; autoSort = true; $('priceM').classList.remove('on'); ui.actKey = ''; ui.mode = null; resetTray(); }
  const evs = (ns.evts || []).filter(e => e.seq > lastSeq);

function takeChips(p, box){
  if (!(S.phase === 'game' && S.step === 'take' && S.todo && S.todo[p.id])) return false;
  const x = S.todo[p.id], l = x.l, t = x.t;
  const chip = (ic, txt, done, title) => { const c = el('span', 'chip' + (done ? ' done' : '')); c.title = title; c.append(el('i', ic), document.createTextNode((done ? '✓ ' : '') + txt)); box.append(c); };
  if (!todoOpen(x)){ const c = el('span', 'chip done', '✓ всё взял'); box.append(c); return true; }
  if (t.cards) chip('cb', (t.cards - l.cards) + '/' + t.cards, l.cards === 0, 'Карты из колоды');
  if (t.coins) chip('ci', (t.coins - l.coins) + '/' + t.coins, l.coins === 0, 'Монеты из Банка');
  if (t.seal) chip('si', l.seal ? '0/1' : '', !l.seal, 'Печать купца');
  return true;
}
function statusOf(p){
  if (S.phase !== 'game') return '';
  if (S.step === 'take' && S.todo && S.todo[p.id]){
    const x = S.todo[p.id], l = x.l, t = x.t, a = [];
    if (!todoOpen(x)) return '✓ взял всё';
    if (t.cards) a.push('карты ' + (t.cards - l.cards) + '/' + t.cards);
    if (t.coins) a.push('монеты ' + (t.coins - l.coins) + '/' + t.coins);
    if (t.seal) a.push('Печать');
    return a.join(' · ');
  }
  if (S.turn === p.id && STEP_MSG[S.step]) return STEP_MSG[S.step];
  if (S.auction && S.auction.passed.includes(p.id)) return 'пас';
  if (stakeOf(p.id)) return 'ставка ' + coinSum(stakeOf(p.id));
  return '';
}

function sealCheck(){

function slotMode(){

        const pick = mode === 'take' || mode === 'return' || ((mode === 'showcase' || mode === 'open') && !c.open);
        const w = el('div', 'slot' + (pick ? ' pick' : ''));

  /* «Ставка Х монет»: до первой ставки — цена продавца, дальше — текущая ставка; при изменении число «пересчитывается» с анимацией */

  else if (ui.lpVal !== val){ ui.lpAnim = {from: ui.lpVal, to: val, t0: performance.now()}; ui.lpVal = val; }

    if (performance.now() - an.t0 < dur){

      const tick = () => {                          // кадры продолжаем всегда: при первом вызове плашка ещё не вставлена в страницу

  if (mode === 'showcase') return send({t:'showcase', i});

function bagWidget(key, need, onFull){
  if (ui.trayKey !== key){ ui.tray = {1:0, 5:0, 10:0}; ui.trayKey = key; }

  });
  bag.innerHTML = '<div class="bin"></div>' + BAG_SVG;
  const bin = bag.querySelector('.bin');
  const w = {bag, need, onFull, busy:false, label:null, guard:null, cap:0, onUpd:null};
  w.update = () => {
    clampTray(); bin.innerHTML = '';

function bagTry(d){                          // true — монета легла в мешочек
  const w = ui.bag; if (!w || w.busy) return false;
  if (ui.tray[d] >= freePurse()[d]) return false;
  if (w.guard && !w.guard()) return false;
  if (w.need && trayTotal() + d > w.need) return false;       // крупнее остатка — не идёт
  if (w.cap && trayTotal() + d > w.cap) return false;
  ui.tray[d]++; bagAnim(w.bag, 'plop'); sfx('takecoin', .8); w.update();

}
/* набралась нужная сумма — через короткую паузу (монета долетает) срабатывает действие; если панель успели перестроить, берём актуальный мешочек */
function bagFire(){
  const w = ui.bag; if (!w) return;
  if (w.tier){                                   // докупка: набралось на 1 карту — ждём ещё монет; на максимум — сразу
    clearTimeout(w.tm); const t = trayTotal();

  w.busy = true;
  setTimeout(() => { const cw = ui.bag; if (cw && cw.need && trayTotal() === cw.need) cw.onFull(Object.assign({}, ui.tray)); }, reduce ? 0 : 450);
}
function bagGo(w){ if (ui.bag === w && !w.busy && trayTotal() >= w.tier){ w.busy = true; w.onFull(Object.assign({}, ui.tray)); } }
function bagClear(w){

const SND = {mute: false, bedVol: .2};

const SFX = {};
/* Звуки кнопок: наведение (tipoff1-3) и нажатие (click1-3) — вариант случайный, подряд не повторяется */
const UIS = {tipoff: -1, click: -1};
function uiSnd(kind, vol){
  let i; do { i = Math.random() * 3 | 0; } while (i === UIS[kind]);
  UIS[kind] = i; sfx(kind + (i + 1), vol);
}

function sfx(name, vol, delay){
  if (SND.mute) return;
  const go = () => {
    const P = SFX[name] || (SFX[name] = {i: 0, a: Array.from({length: 4}, () => { const a = new Audio('sfx/' + name + '.mp3'); a.preload = 'auto'; return a; })});
    const a = P.a[P.i++ % P.a.length]; a.volume = Math.min(1, vol == null ? 1 : vol);
    try{ a.currentTime = 0; }catch(e){}
    const r = a.play(); if (r && r.catch) r.catch(() => {});
  };
  delay ? setTimeout(go, delay) : go();
}
/* Шум рынка: два плеера по очереди — перед концом дорожки следующий заходит с нуля, а текущий затихает (бесшовный цикл) */
const BED = {a: null, b: null, cur: null, nxt: null, m: 0, want: false, tm: 0, last: 0};
function bedTick(){
  const now = performance.now(), dt = Math.min(250, now - BED.last); BED.last = now;
  BED.m = Math.max(0, Math.min(1, BED.m + (BED.want && !SND.mute ? dt : -dt) / (BED.want ? 3000 : 1200)));
  const X = 4000, c = BED.cur, n = BED.nxt;
  if (c && !n && c.duration && (c.duration - c.currentTime) * 1000 < X){ BED.nxt = BED.cur === BED.a ? BED.b : BED.a; BED.nxt.g = 0; BED.nxt.currentTime = 0; const r = BED.nxt.play(); if (r && r.catch) r.catch(() => {}); }
  if (BED.nxt){
    BED.cur.g = Math.max(0, BED.cur.g - dt / X); BED.nxt.g = Math.min(1, BED.nxt.g + dt / X);
    if (BED.nxt.g >= 1){ BED.cur.pause(); BED.cur = BED.nxt; BED.nxt = null; }
  }
  [BED.a, BED.b].forEach(a => { if (a) a.volume = Math.max(0, Math.min(1, SND.bedVol * BED.m * (a.g == null ? 1 : a.g))); });
  if (!BED.want && BED.m <= 0){ [BED.a, BED.b].forEach(a => a && a.pause()); BED.cur = BED.nxt = null; clearInterval(BED.tm); BED.tm = 0; }
}
function bedStart(){
  BED.want = true;
  if (!BED.a){ BED.a = new Audio('sfx/market.mp3'); BED.b = new Audio('sfx/market.mp3'); BED.a.preload = BED.b.preload = 'auto'; }
  if (BED.tm) return;
  BED.cur = BED.a; BED.nxt = null; BED.a.g = 1; BED.b.g = 0; BED.last = performance.now();
  const r = BED.a.play(); if (r && r.catch) r.catch(() => {});
  BED.tm = setInterval(bedTick, 100);
}
function bedStop(){ BED.want = false; }
function sndUI(){ $('sndBtn').textContent = SND.mute ? '🔇' : '🔊'; }
$('sndBtn').onclick = () => {
  SND.mute = !SND.mute; try{ localStorage.setItem('kup_mute', SND.mute ? '1' : '0'); }catch(e){}
  sndUI(); if (!SND.mute && BED.want && !BED.tm) bedStart();
};

/* Фон-стол: картинка (1790×1179, синее сукно: центр 896,545, размер ≈1215×480) подгоняется под область стола */
function fitBg(){
  const g = $('game'), t = $('table'); if (!g || !g.clientWidth || !t.clientWidth) return;
  const gr = g.getBoundingClientRect(), tr = t.getBoundingClientRect(), vw = g.clientWidth, vh = g.clientHeight;
  const Fw = tr.width * .92, Fh = tr.height * .9;                        // область бывшего сукна
  const cx = tr.left - gr.left + tr.width / 2, cy = tr.top - gr.top + tr.height * .1 + Fh / 2;
  const sc = Math.max(Fw / 1215, Fh / 480, vw / 1790, vh / 1179);
  const w = 1790 * sc, h = 1179 * sc;
  const x = Math.min(0, Math.max(vw - w, cx - 896 * sc)), y = Math.min(0, Math.max(vh - h, cy - 545 * sc));
  const b = $('bgImg'); b.style.width = w + 'px'; b.style.height = h + 'px'; b.style.left = x + 'px'; b.style.top = y + 'px';
}

/* ---------- Итоги: пошаговый подсчёт и подиум ---------- */
const FX = {key:'', tok:0, K:1, done:false};
const fxW = (ms, tok) => new Promise((res, rej) => setTimeout(() => FX.tok === tok ? res() : rej(0), reduce ? 0 : ms * FX.K));

const fxR = (a, b) => a + Math.random() * (b - a);
const fxPop = (e, s) => fxA(e, [{transform: 'scale(1)'}, {transform: 'scale(' + (s || 1.4) + ')', color: '#fff3b0'}, {transform: 'scale(1)'}], 380);
async function fxNum(e, from, to, ms, tok){          // число «набегает» от from до to
  const st = Math.min(24, Math.max(1, Math.abs(to - from)));

}

}

/* ---- порядок карт в руке: у каждого игрока свой, хранится только у него ---- */
const SORT_RANK = {royal:0, gentry:1, simple:2, spoiled:3};
const SORT_SPEC = {cat:0, pest:1, rat:2, auditor:3};
/* Порядок «справа налево»: товары по очереди (в каждом: королевская, господская, простая, испорченная), дальше — особые карты по группам */
const rtlKey = c => { const d = CARDS[c.k], pi = d.prod ? PORD.indexOf(d.prod) : 0;
  return d.kind in SORT_RANK ? pi * 10 + SORT_RANK[d.kind] : 100 + SORT_SPEC[d.kind] * 10 + pi; };
const sortedIds = () => [...myHand].sort((a, b) => rtlKey(b) - rtlKey(a) || a.id - b.id).map(c => c.id);      // на экране слева направо — обратный порядок
function syncOrder(){
  if (autoSort){ handOrder = sortedIds(); return; }
  const have = new Set(myHand.map(c => c.id));
  handOrder = handOrder.filter(id => have.has(id));
  myHand.forEach(c => { if (!handOrder.includes(c.id)) handOrder.push(c.id); });     // новые карты — справа
}
const visibleHand = () => { const m = new Map(myHand.map(c => [c.id, c])); return handOrder.map(id => m.get(id)).filter(c => c && !placed.includes(c.id)); };
const composeMe = () => S.phase === 'game' && S.step === 'compose' && S.turn === myId();
const handMetrics = n => { const cw = handCardW(), avail = Math.min(innerWidth - 40, 1200), step = n > 1 ? Math.min(cw * .82, (avail - cw) / (n - 1)) : cw; return {cw, gap: (step - cw) / 2}; };

function mkHandCard(card, m){

}
function relayoutBy(){          // лёгкая дуга: края руки чуть ниже

/* подсветка карт, которые сейчас можно выбрать (Крыса, Ревизор) */
function handEligible(card){

  if (S.step === 'compose') return true;
  if (S.step === 'rat') return isGood(card) && S.info.prods.includes(d.prod);

    const card = myHand.find(x => x.id === Number(c.dataset.id));
    const ok = card ? handEligible(card) : null;
    c.classList.toggle('can', ok === true && !c.classList.contains('sel') && S.step !== 'compose');

function onHandClick(card){
  const me = myId();
  if (S.phase !== 'game' || S.turn !== me) return;
  if (S.step === 'compose') return;
  if (S.step === 'rat'){
    if (handEligible(card) !== true) return toast('Крыса ест только из самой большой партии — карты подсвечены');

      if (selIds.size && prodOf([...selIds][0]) !== CARDS[card.k].prod) selIds = new Set();

      selIds.add(card.id);
    }

<ul>
<li>Каждая испорченная карта уменьшает на 1 число простых карт соответствующего товара при подсчёте очков.</li>
<li>Господские и королевские карты не портятся.</li>
<li>Сама испорченная карта очков не приносит.</li>
</ul>
<p><b>Напасти</b></p>
<table><tr><th>Напасть</th><th>Эффект при покупке</th></tr>
<tr><td>Крыса</td><td>Покупатель сам выбирает любые 2 карты из своей самой большой партии: простые, господские, королевские или испорченные. Выбранные карты и Крыса уходят в сброс.</td></tr>
<tr><td>Вредители (6 видов)</td><td>Партия соответствующего товара замешивается в колоду, Вредитель уходит в сброс.</td></tr></table>
<div class="box"><b class="h">Когда Напасть срабатывает?</b>Только в момент покупки лота. Если Напасть пришла при начальной раздаче, утреннем или вечернем подвозе либо вернулась продавцу из непроданного лота, она не срабатывает. Её можно выставить в лоте.</div>
<div class="box"><b class="h">Как определить самую большую партию для Крысы</b>Сравните общее количество карт в каждой партии. Если карт поровну, выбирайте партию, которая дороже.</div>
<p><b>Помощники</b></p>
<table><tr><th>Помощник</th><th>Как использовать</th></tr>
<tr><td>Кот</td><td>Отменяет одну Напасть, если попалась при покупке; обе карты идут в сброс. Кота можно выставлять в лоте. Если Кот и Напасть попались вместе в одном лоте, Кот может сразу отменить эту Напасть.</td></tr>
<tr><td>Ревизор</td><td>Во время этапа осмотра сбросьте Ревизора и тайно посмотрите все три карты лота. Это считается вашим действием осмотра.</td></tr></table>
</details>

<details><summary>7. Подсчёт богатства и победа</summary>
<p>Игра заканчивается после вечернего торга последнего дня, когда последний продавец завершил свой ход. Затем все игроки открывают свои склады и считают стоимость партий.</p>
<p><b>Как посчитать стоимость одного товара</b></p>
<ol>
<li>Посчитайте простые карты этого товара.</li>
<li>Вычтите по 1 за каждую испорченную карту этого товара. Результат не может быть меньше нуля. Полученное число — размер партии n.</li>
<li>По таблице найдите базовую стоимость партии (1 → 1, 2 → 3, 3 → 6, 4 → 10, 5 → 15, 6 → 21, 7 → 28, 8 → 36, 9 → 45, 10 → 55).</li>
<li>Умножьте её на 2 за каждую господскую карту и на 3 за каждую королевскую карту этого товара. Множители перемножаются.</li>
</ol>
<p><b>Кто побеждает</b></p>
<ul>
<li>Сложите стоимость всех шести товарных партий. Игрок с наибольшим богатством побеждает.</li>
<li>При ничьей побеждает игрок с большим количеством монет.</li>
<li>Если монет поровну — игрок с большим количеством простых карт на складе.</li>
<li>Если и простых карт поровну, победа делится.</li>
</ul>
</details>

<details open><summary>Как играть в онлайн-версии</summary>
<div class="box web"><b class="h">Всё делаешь руками, как за столом</b>
<ul>
<li><b>Подсказка сверху</b> всегда говорит, что делать. Янтарная мигающая полоса — это про тебя («ТЫ: …»), серая — ждём другого игрока. Игрок, чей сейчас ход, подсвечен рамкой.</li>
<li><b>Раздача и подвоз:</b> карты берёшь сам — нажимай на колоду (или кнопку в панели). Монеты берёшь из Банка — нажимай на его монеты 1, 5, 10. Печать купца — нажми на кучу Печатей. У каждого игрока над ником видно, сколько он уже взял.</li>
<li><b>Монеты</b> лежат перед каждым игроком на виду: стопки номиналов 1, 5 и 10. Твои — в кошельке слева внизу.</li>
<li><b>Расспрос и Вскрытие:</b> перетащи монеты из кошелька в мешочек — сколько нужно, написано под ним. Монета крупнее остатка в мешок не пойдёт и вернётся обратно. Когда набрана нужная сумма, деньги сами уходят продавцу. Расспрос: сначала впиши вопрос в поле, ответ «ДА» или «НЕТ» появится крупно у твоего места. Вскрытие: после оплаты нажми на закрытую карту лота.</li>
<li><b>Ставка:</b> кнопки «Ставка» и «Пас»; монеты, которыми ставишь, закидывай в мешочек. Если в мешочке меньше минимальной ставки, он не уходит, а трясётся. Монеты лидера торгов лежат на столе рядом с суммой ставки.</li>
<li><b>Платишь сам</b> (лот, докупка): нажимай на свои монеты — они ложатся в оплату. Нужна точная сумма: «Подобрать монеты» соберёт её и сам разменяет в Банке. Кнопка «Размен» (слева у края стола) меняет монеты вручную, без потерь.</li>
<li><b>Печать купца</b> лежит у тебя рядом с монетами. После первой ставки на торгах нажми на неё (или кнопку в панели) — торги закончатся, платишь последнюю ставку, но не меньше 10. Использованная Печать зачёркивается.</li>
<li><b>Лот</b> выбираешь кликом по картам в руке; купленный лот забираешь кликом по нему на столе; Ревизора сбрасываешь кликом по карте в руке; для Крысы сам выбираешь, какие 2 карты отдать.</li>
<li><b>Сброс</b> — открытая стопка: нажми на неё, чтобы увидеть все сброшенные карты.</li>
</ul></div>
<div class="box web"><b class="h">Как онлайн-версия понимает правила</b>
<ul>
<li>Первого игрока (Старосту рынка) определяет жребий — вместо «кто последним покупал хлеб».</li>
<li>В первый день утреннего подвоза нет: игроки только что получили стартовые ресурсы. Со второго дня подвоз обычный.</li>
<li>В последний день утром берётся только 5 монет; вечернего подвоза карт тоже нет. Карта за продажу и докупка работают как обычно.</li>
<li>Если колода закончилась, карты больше не раздаются (сброс заново не замешивается).</li>
<li>Честность ответов на Расспрос и слухи — на совести игроков: игра проверяет только ходы и деньги.</li>
</ul></div>
</details>

function openRules(){
  const s = $('rulesS');
  if (!s.dataset.ready){ s.innerHTML = RULES_HTML; s.dataset.ready = '1'; }
  const all = () => [...s.querySelectorAll('details')];
  s.querySelector('#rAll').onclick = () => all().forEach(d => { d.open = true; });
  s.querySelector('#rNone').onclick = () => all().forEach(d => { d.open = false; });
  s.querySelector('#rClose').onclick = () => $('rulesM').classList.remove('on');
  s.scrollTop = 0;
  $('rulesM').classList.add('on');
}
$('rulesM').addEventListener('click', e => { if (e.target === $('rulesM')) $('rulesM').classList.remove('on'); });
</script>
