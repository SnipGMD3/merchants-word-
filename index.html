<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Честное Купеческое!</title>
<style>
@font-face{font-family:"Foxcroft NF";src:url(fonts/foxcroft.woff) format("woff");font-display:swap}
:root{--bg:#141a26;--felt:#1f3b4d;--felt2:#16293a;--ink:#efe4cd;--mute:#8b97ab;--acc:#e3790f;--acc2:#f0a24c;--red:#e63946;--blue:#3a86ff;--green:#2a9d5c;--yellow:#e3790f;--hb:240px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0%,#22304a,var(--bg) 70%);color:var(--ink);font:17px/1.4 "Foxcroft NF","Trebuchet MS","Segoe UI",sans-serif;font-synthesis:none;overflow-x:hidden}
.screen{display:none;min-height:100%;padding:24px}
.screen.on{display:flex;flex-direction:column;align-items:center}
h1{font-size:clamp(2rem,6vw,3.2rem);margin:6vh 0 4px;letter-spacing:.5px}
p.sub{color:var(--mute);margin:0 0 28px;text-align:center}
.panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:20px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
input{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:#0e1420;color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:700;padding:12px 16px;border-radius:10px;border:0;cursor:pointer;background:var(--acc);color:#1a1300}
button.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.25)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px}
.err{color:#ff8a93;min-height:1.2em;font-size:.9rem}
.code{font-size:2.6rem;font-weight:800;letter-spacing:.3em;text-align:center;color:var(--acc);cursor:pointer;user-select:all}
.hint{color:var(--mute);font-size:.85rem;text-align:center}
ul.players{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.players li{padding:10px 12px;background:rgba(255,255,255,.06);border-radius:8px;display:flex;justify-content:space-between}
ul.players .tag{color:var(--acc);font-size:.8rem}

/* ================= карты ================= */
/* Арт лежит в cards/<ключ>.<расширение> (см. IMG в скрипте). Карты без арта рисуются текстом (.txt). Пропорции 90x140. */
.card{--w:90px;width:var(--w);height:calc(var(--w)*1.5556);position:relative;background-size:100% 100%;background-repeat:no-repeat;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.55));user-select:none;-webkit-user-drag:none;flex:none}
.card.sm{--w:108px}
.card.txt{background:#efe6d0;border:3px solid var(--tc,#7b8794);border-radius:8px;color:#2a2217;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:4px;gap:6px;font-size:calc(var(--w)*.16)}
.card.txt b{line-height:1.1;overflow-wrap:anywhere}
.card.txt small{font-size:.62em;opacity:.7;font-weight:400;line-height:1.1}
.card.txt[data-t="gentry"]{--tc:#1f9d9a}
.card.txt[data-t="royal"]{--tc:#d4a017}
.card.txt[data-t="spoiled"]{--tc:#7f8230}
.card.txt[data-t="rat"],.card.txt[data-t="pest"]{--tc:#a02830}
.card.txt[data-t="cat"],.card.txt[data-t="auditor"]{--tc:#3a6ea5}

/* рубашка */
.back{background:url(cards/back.webp) center/100% 100% no-repeat;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}

.ver{color:var(--mute);font-size:.8rem;text-align:center;margin-top:18px;letter-spacing:.08em}

/* ================= монеты, печать, жетон ================= */
.coin{--w:calc(30px*var(--k,1));width:var(--w);height:var(--w);flex:none;display:block;user-select:none;background:center/contain no-repeat;filter:drop-shadow(0 2px 1px rgba(0,0,0,.55))}
.coin.d1{--w:calc(26px*var(--k,1));background-image:url(ui/coin1.webp)}
.coin.d5{--w:calc(31px*var(--k,1));background-image:url(ui/coin5.webp)}
.coin.d10{--w:calc(36px*var(--k,1));background-image:url(ui/coin10.webp)}
.coin.ghost{opacity:.2;filter:grayscale(1) brightness(.8)}
.pw{display:flex;flex-direction:column;align-items:center;gap:2px}
.pile{display:flex;flex-direction:column-reverse;align-items:center;min-width:calc(30px*var(--k,1))}
.pile .coin+.coin{margin-bottom:calc(var(--w)*-.74)}
.pc{font-size:.72rem;color:var(--acc2);line-height:1;font-weight:700}
.purse{display:flex;gap:8px;align-items:flex-end}
.purse.mini{--k:.8;gap:6px}
.purse.mini .pc{font-size:.62rem}
.purse.big{--k:1}
.purse .pw.can{cursor:pointer}
.purse .pw.can:hover .coin:last-child{transform:translateY(-4px)}
.sum{font-size:.82rem;color:var(--acc);font-weight:800;white-space:nowrap}

.seal{display:inline-flex;vertical-align:middle;position:relative}
.seal img{width:calc(46px*var(--k,1));height:calc(46px*var(--k,1));display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6));pointer-events:none;user-select:none}
.seal.mini{--k:.75}
.seal.used{opacity:.28;filter:grayscale(1)}
.seal.used::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;border-top:3px solid #ff8a93;transform:rotate(-35deg)}
.seal.can{cursor:pointer;animation:bob 1.1s ease-in-out infinite}
.seal.nope{animation:bagshake .45s}
@keyframes bob{50%{transform:translateY(-4px)}}
.sta{display:inline-flex;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe785,#d49100);color:#4a2f00;font-size:.78rem;align-items:center;justify-content:center;box-shadow:0 0 0 2px #7a4d00;flex:none}
.sta:empty{display:none}

/* ================= игровой стол ================= */
#game{padding:0;position:relative;overflow:hidden;overflow:clip;height:100vh;height:100dvh}
.hud{position:absolute;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;z-index:6}
.hud .code{font-size:1rem;letter-spacing:.2em;display:inline}
/* плашка дня слева под кодом: дерево и камень, «ДЕНЬ 1/4», солнце (утро) или луна (вечер) */
:root{--pw:clamp(170px,16vw,250px)}
.hud .dayinfo{position:absolute;left:0;top:46px;width:var(--pw);text-align:center;font-weight:700;pointer-events:none}
.daypl{position:relative;width:var(--pw);aspect-ratio:1444/796;background:url(ui/plaque.webp) center/100% 100% no-repeat;filter:drop-shadow(0 6px 8px rgba(0,0,0,.55));
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:calc(var(--pw)*.13)}
.daypl .d1,.daypl .d2{font-family:'Foxcroft NF','Arial Black','Segoe UI Black',sans-serif;font-weight:900;color:var(--ink);line-height:1;letter-spacing:.03em;
  -webkit-text-stroke:calc(var(--pw)*.026) #000;paint-order:stroke fill;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.daypl .d1{font-size:calc(var(--pw)*.125)}
.daypl .d2{font-size:calc(var(--pw)*.115);margin-top:calc(var(--pw)*.01)}
.daypl .dico{width:calc(var(--pw)*.2);height:calc(var(--pw)*.2);object-fit:contain;margin-top:calc(var(--pw)*.01);filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.daypl .dico.swap{animation:dayswap .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes dayswap{from{transform:translateY(-30%) rotate(-120deg) scale(.3);opacity:0}to{transform:none;opacity:1}}
.hud .dayinfo small{display:block;margin-top:4px;color:#c9d1e0;font-weight:700;font-size:.74rem;line-height:1.2;text-shadow:0 1px 3px #000}
.hud button{padding:6px 12px;font-size:.85rem}
.hud .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.directive{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:7;width:min(920px,calc(100vw - 2 * (var(--pw) + 24px)));text-align:center;padding:7px 14px;border-radius:12px;
  background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.18);font-weight:700;font-size:.95rem;line-height:1.3}
.directive small{display:block;font-weight:400;color:var(--mute);font-size:.8rem}
.directive.me{border-color:var(--acc);background:rgba(70,46,0,.82);color:var(--acc2);animation:glow 1.8s ease-in-out infinite}
.directive b{color:var(--ink)}
.directive:empty{display:none}
.sealmsg{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:60;pointer-events:none;text-align:center;padding:18px 40px;border-radius:18px;
  background:linear-gradient(180deg,rgba(120,18,28,.96),rgba(60,8,14,.96));border:2px solid #ffd23f;box-shadow:0 0 40px rgba(255,200,40,.55),0 12px 34px rgba(0,0,0,.6);animation:sealin .45s cubic-bezier(.2,1.5,.4,1);transition:opacity .4s}
.sealmsg.out{opacity:0}
.sealmsg .sm1{font-size:2rem;font-weight:900;color:var(--acc);letter-spacing:.04em}
.sealmsg .sm2{font-size:1.7rem;font-weight:800;color:var(--ink);margin:4px 0}
.sealmsg .sm3{font-size:1.15rem;font-weight:700;color:var(--acc2)}
@keyframes sealin{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.midmsg{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;padding:14px 30px;border-radius:16px;font-size:2.1rem;font-weight:900;letter-spacing:.06em;
  color:var(--acc2);background:rgba(70,46,0,.88);border:2px solid var(--acc);text-align:center;white-space:nowrap;animation:glow 1.8s ease-in-out infinite}
.midmsg:empty{display:none}
.bagtier{font-size:.95rem;font-weight:700;color:#8a93a6;text-align:center;line-height:1.15;transition:color .15s}
.bagtier.b{font-size:1.05rem;font-weight:900;color:#c9d1e0}
.bagtier.on{color:var(--acc)}
.bag.tier{cursor:pointer}
.directive.big{font-size:1.6rem;font-weight:900;letter-spacing:.05em;padding:10px 18px}
.directive.blink{font-size:1.2rem;letter-spacing:.04em;animation:dblink .9s ease-in-out infinite}
@keyframes dblink{50%{opacity:.25}}
@keyframes glow{50%{box-shadow:0 0 18px rgba(255,183,3,.55)}}

.table{position:absolute;top:112px;bottom:calc(var(--hb) + 24px);left:50%;width:min(1320px,98vw);transform:translateX(-50%);min-height:240px}
.felt{display:none}      /* стол теперь нарисован на фоне (ui/bg.webp), см. fitBg() */
.bgimg{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none;background:#100906 url(ui/bg.webp) 0 0/100% 100% no-repeat;transition:left .35s,top .35s,width .35s,height .35s}
.bgimg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 58%,transparent 52%,rgba(0,0,0,.4))}

.deck{position:absolute;left:calc(50% - 270px);top:50%;width:96px;height:150px;margin:-75px 0 0 -48px;z-index:2;
  filter:drop-shadow(2px 2px 0 #3a1010) drop-shadow(4px 4px 0 #2a0b0b) drop-shadow(6px 8px 8px rgba(0,0,0,.55))}
.deck.empty{opacity:.25}
.disc{position:absolute;left:calc(50% + 270px);top:50%;width:96px;height:150px;margin:-75px 0 0 -48px;z-index:2;border:2px dashed rgba(255,255,255,.2);border-radius:8px;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.disc .card{--w:92px;position:absolute;left:0;top:0}
.deck-l,.disc-l{position:absolute;top:50%;margin-top:88px;transform:translateX(-50%);font-size:.85rem;color:var(--mute);pointer-events:none;z-index:2;white-space:nowrap}
.deck-l{left:calc(50% - 270px)}
.disc-l{left:calc(50% + 270px)}
.pulse{cursor:pointer}
.pulse::after{content:"";position:absolute;inset:-7px;border-radius:12px;border:3px solid var(--acc);animation:ring 1.1s ease-out infinite;pointer-events:none}
@keyframes ring{0%{opacity:1;transform:scale(.96)}100%{opacity:0;transform:scale(1.18)}}

.bank,.sealpile{position:absolute;top:79%;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translate(-50%,-50%);padding:0;background:none;border:0}
.bank{left:calc(50% - 425px);top:52%}
.sealpile{left:calc(50% + 362px);top:52%;min-width:88px}
.bank .bl,.sealpile .bl{font-size:.8rem;color:rgba(239,228,205,.62);white-space:nowrap;text-shadow:0 1px 3px #000}
.bank .purse{--k:1.2;gap:14px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.55))}
.bank .pw{cursor:default}
.bank.pulse .pw,.bank.pulse .pw .coin{cursor:pointer}
.bank.pulse .pw:hover .coin:last-child{transform:translateY(-4px)}
.bank .pw .pc{display:none}
.sealpile .stack{display:flex;position:relative;min-height:64px;min-width:70px;align-items:center;justify-content:center}
.sealpile .stack .seal{--k:1.3}
.sealpile .stack .seal+.seal{margin-left:-46px}
.sealpile .stack .seal:nth-child(1){transform:rotate(-9deg)}
.sealpile .stack .seal:nth-child(2){transform:rotate(7deg) translateY(4px)}
.sealpile .stack .seal:nth-child(3){transform:rotate(-3deg) translateY(-3px)}
.sealpile .zero{color:var(--mute);font-size:.7rem}

.lotzone{--sh:168px;position:absolute;left:50%;top:50%;width:0;height:0;z-index:3}
/* центр ряда из трёх карт — ровно центр стола (на одной линии с колодой и сбросом); плашка и кнопка висят под ним и не сдвигают карты */
.slots{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;gap:10px;justify-content:center}
.slot{position:relative;border-radius:8px}
.slot.empty{width:108px;height:var(--sh);border:2px dashed rgba(255,208,80,.9);border-radius:8px;background:rgba(255,183,3,.08);animation:eblink 1s ease-in-out infinite;transition:transform .15s,background .15s}
.slot.empty.drop,.slot.placed.drop{transform:scale(1.07);background:rgba(255,183,3,.32);animation:none;opacity:1;box-shadow:0 0 18px rgba(255,183,3,.9)}
.slot.placed{cursor:pointer;transition:transform .15s;touch-action:none}
.slot.placed:hover{transform:translateY(-4px)}
.slot.placed.lifted .card{visibility:hidden}
.slot .card.land{animation:landin .26s cubic-bezier(.2,1.5,.4,1)}
@keyframes landin{from{transform:scale(1.18)}to{transform:none}}
.lotgo{position:absolute;left:0;top:calc(var(--sh)/2 + 20px);transform:translateX(-50%);z-index:4;display:none}
.lotgo button{background:linear-gradient(180deg,#ffd84a,#f2a900);color:#2b1c00;border:1px solid #fff2b3;font-weight:900;font-size:1.15rem;letter-spacing:.04em;padding:11px 34px;border-radius:12px;white-space:nowrap;
  box-shadow:0 0 0 2px rgba(255,200,40,.35),0 6px 16px rgba(0,0,0,.5),0 0 22px rgba(255,200,40,.55);animation:gopulse 1.3s ease-in-out infinite}
.lotgo button:hover{filter:brightness(1.08)}
@keyframes gopulse{50%{box-shadow:0 0 0 5px rgba(255,200,40,.25),0 6px 16px rgba(0,0,0,.5),0 0 32px rgba(255,200,40,.9)}}
@keyframes eblink{0%,100%{opacity:.25}50%{opacity:1;box-shadow:0 0 14px rgba(255,183,3,.7)}}
.slot.pick{cursor:pointer;transition:transform .18s ease;animation:pglow 1.1s ease-in-out infinite}
.slot.pick:hover{transform:scale(1.1);z-index:4}
@keyframes pglow{0%,100%{filter:drop-shadow(0 0 3px rgba(255,183,3,.45))}50%{filter:drop-shadow(0 0 6px var(--acc)) drop-shadow(0 0 20px rgba(255,183,3,.95))}}
.slot .sn{position:absolute;left:50%;top:-17px;transform:translateX(-50%);font-size:.75rem;color:var(--mute)}
.slot .pk{position:absolute;left:4px;right:4px;bottom:6px;text-align:center;font-size:.78rem;background:rgba(0,0,0,.75);color:var(--acc2);border-radius:6px;padding:2px;line-height:1.1}
.card.flip{animation:flipin .5s}
@keyframes flipin{from{transform:rotateY(90deg)}to{transform:none}}
.lotinfo{position:absolute;left:0;top:calc(var(--sh)/2 + 22px);transform:translateX(-50%);width:max-content;font-size:.8rem;text-align:center;max-width:420px;background:linear-gradient(180deg,rgba(40,30,8,.82),rgba(0,0,0,.66));border:1px solid rgba(255,183,3,.45);box-shadow:0 6px 18px rgba(0,0,0,.45);border-radius:12px;padding:5px 14px;min-height:1.4em}
.lotinfo .lt{font-weight:800;font-size:1.02rem;letter-spacing:.03em;color:var(--ink)}
.lotinfo .lt b{font-size:1.3rem;color:var(--acc);text-shadow:0 0 14px rgba(255,183,3,.6)}
.lotinfo .lp{font-weight:700;font-size:.92rem;color:var(--ink)}
.lotinfo .lp b{font-size:1.55rem;line-height:1;color:var(--ink);text-shadow:0 0 12px rgba(255,210,63,.8);margin:0 2px}
.lotinfo div{margin:1px 0}
.lotinfo .qa{color:var(--acc2)}

.seats{position:absolute;inset:0;pointer-events:none;z-index:3}
.seat{position:absolute;width:0;height:0;transform:scale(var(--s,1));transition:left .4s,top .4s}
.fan{position:absolute;left:0;top:0;width:0;height:0}
.fan .b{position:absolute;left:-35px;top:-116px;width:70px;height:108px;transform-origin:35px 136px;
  transform:rotate(var(--a,0deg)) translateY(var(--t,0px));transition:transform .28s cubic-bezier(.2,.8,.2,1),filter .28s}
.plate{position:absolute;left:0;top:0;transform:translate(-50%,-50%);z-index:3;background:rgba(0,0,0,.66);border:1px solid rgba(255,255,255,.22);
  border-radius:12px;padding:5px 11px 6px;white-space:nowrap;display:flex;flex-direction:column;gap:3px;align-items:center;font-size:.85rem;transition:box-shadow .25s,border-color .25s}
.plate .r1,.plate .r2{display:flex;gap:7px;align-items:center}
.plate .r2{align-items:flex-end}
.money{position:absolute;top:0;left:120px;transform:translateY(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:3px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.6))}
.seat.lft .money{left:auto;right:120px}
.money .mrow{display:flex;align-items:flex-end;gap:8px}
.money .sum{font-size:1.4rem;font-weight:900;line-height:1;color:var(--acc);text-shadow:0 2px 3px rgba(0,0,0,.75)}
.plate .cnt{background:rgba(255,255,255,.14);border-radius:999px;padding:0 8px;font-size:.78rem}
.plate .st{color:var(--acc);font-size:.76rem;max-width:250px;white-space:normal;text-align:center;line-height:1.2}
.plate .st:empty{display:none}
.plate .st.on::after{content:"…";animation:blink 1s steps(3) infinite}
.seat.pick .plate{border-color:var(--acc);box-shadow:0 0 16px rgba(255,183,3,.6)}
.seat.sell .plate{border-color:#6fd3ff}
.seat.flash .plate{animation:flash .7s}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(255,255,255,.9)}100%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
@keyframes blink{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}

.fly{position:fixed;left:0;top:0;width:90px;height:140px;z-index:50;pointer-events:none;transform-style:preserve-3d;will-change:transform}
.fly>*{position:absolute;left:0;top:0;width:90px;height:140px;backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:none}
.fly .bk{transform:rotateY(180deg)}
.fcoin{position:fixed;left:0;top:0;z-index:51;pointer-events:none;will-change:transform}

.act{position:absolute;left:50%;bottom:calc(var(--hb) + 10px);transform:translateX(-50%);z-index:9;width:min(560px,92vw);background:rgba(10,14,22,.94);
  border:1px solid rgba(255,183,3,.55);border-radius:14px;padding:12px 14px;display:none;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}
.act.on{display:flex}
.act .t{font-weight:800;color:var(--acc)}
.act .t.c{text-align:center;font-size:1.15rem}
.act.cmp{width:min(360px,92vw)}
.act .row.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act .row.g2 button{width:100%;padding:8px 6px;font-size:.88rem}
.act .m{color:var(--mute);font-size:.88rem}
.act .big{font-size:1.7rem;font-weight:800;color:var(--acc);text-align:center;line-height:1.2;padding:4px 6px}
.act .m b{color:var(--ink)}
.act .row{align-items:center;flex-wrap:wrap}
.act input{width:96px;padding:8px 10px}
.act input.wide{width:100%}
.act button{padding:8px 13px}
.act .chips{display:flex;gap:6px;flex-wrap:wrap}
.act .chips button{font-weight:400;font-size:.78rem;padding:4px 9px}
.act .aerr{color:#ff8a93;font-size:.85rem;min-height:0}
.act .aerr:empty{display:none}
.act .todo{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem;align-items:center}
.act .todo .ok{color:#6fe39a}
.act .todo .nm{color:var(--ink)}
.act .todo .pr{color:var(--acc2)}

/* ---- мешочек для монет (расспрос, вскрытие, ставка) ---- */
.act.bagp{width:min(400px,92vw);align-items:center;gap:6px;padding:10px 16px 8px;max-height:none;overflow:visible;background:rgba(10,14,22,.9)}
.act.bagp .t.c{font-size:1.25rem;letter-spacing:.02em}
.act.bagp .bidrow{display:flex;align-items:center;justify-content:center;gap:18px;padding-top:6px}
.act.bagp .bidrow button{min-width:104px}
.act.bagp .row{justify-content:center;flex-wrap:nowrap}
.act.bagp .row button{min-width:116px;font-size:1rem}
.act.bagp .qin{width:100%;font-size:1.05rem;text-align:center;padding:11px 12px}
.act.bagp .qin.bad{border-color:var(--red);animation:bagshake .45s}
.act.bagp .bx{position:absolute;right:8px;top:6px;width:26px;height:26px;padding:0;border-radius:50%;font-size:.8rem;line-height:1;background:rgba(255,255,255,.08);color:var(--mute);border:0}
.act.bagp .bx:hover{color:var(--ink);background:rgba(255,255,255,.16)}
.bag{position:relative;width:96px;height:107px;flex:none;touch-action:none;user-select:none;transition:transform .15s,filter .15s}
.bag svg{position:absolute;inset:0;width:100%;height:100%;z-index:2;overflow:visible;filter:drop-shadow(0 6px 6px rgba(0,0,0,.55));pointer-events:none}
.bag .bin{position:absolute;left:50%;top:-4px;transform:translateX(-50%);display:flex;align-items:flex-end;height:34px;z-index:1;pointer-events:none}
.bag .bin .coin{--k:.8}
.bag .bin .coin+.coin{margin-left:-11px}
.bag.ready{filter:drop-shadow(0 0 12px rgba(255,183,3,.85));animation:bagwiggle .55s ease-in-out infinite}
.bag.over{scale:1.1;filter:drop-shadow(0 0 20px rgba(255,214,90,1))}
@keyframes bagwiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) translateX(-2px)}75%{transform:rotate(4deg) translateX(2px)}}
.bag.shake{animation:bagshake .45s}
.bag.plop{animation:bagplop .32s}
@keyframes bagshake{0%,100%{transform:none}20%{transform:translateX(-9px) rotate(-4deg)}40%{transform:translateX(9px) rotate(4deg)}60%{transform:translateX(-6px) rotate(-3deg)}80%{transform:translateX(5px) rotate(2deg)}}
@keyframes bagplop{40%{transform:scale(1.1,.9)}70%{transform:scale(.96,1.05)}}
.bagsub{font-size:.9rem;font-weight:700;color:#8a93a6;text-align:center;line-height:1}
.bagtxt{font-weight:900;font-size:1.25rem;color:var(--acc);text-align:center;line-height:1.1;text-shadow:0 2px 3px rgba(0,0,0,.7)}
.purse.drag .pw{cursor:grab;touch-action:none}
.fcoin.dragc{z-index:70;cursor:grabbing;filter:drop-shadow(0 8px 6px rgba(0,0,0,.5))}

@media (max-height:820px){
  .act.bagp{bottom:calc(var(--hb) + 2px);padding:6px 14px 6px;gap:3px}
  .act.bagp .t.c{font-size:1.05rem}
  .act.bagp .bidrow{padding-top:2px}
  .act.bagp .bidrow button,.act.bagp .row button{padding:6px 10px;min-width:90px}
  .act.bagp .qin{padding:7px 10px}
  .bag{width:78px;height:87px}
  .bagtxt{font-size:1.1rem}
  /* на низких экранах плашка лота («Ставка Х монет») уходит над карты, чтобы её не закрывал мешочек */
  .lotinfo{top:auto;bottom:calc(var(--sh)/2 + 22px);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;column-gap:16px;padding:3px 12px}
  .lotinfo .lt{font-size:.92rem}.lotinfo .lt b{font-size:1.15rem}
  .lotinfo .lp b{font-size:1.3rem}
  .lotgo{top:calc(var(--sh)/2 + 14px)}

}
/* большой ответ «ДА / НЕТ» на месте игрока */
.ans{position:fixed;left:0;top:0;z-index:80;pointer-events:none;font-weight:900;font-size:clamp(4.5rem,13vw,9.5rem);line-height:1;letter-spacing:.03em;white-space:nowrap;
  text-shadow:0 0 28px currentColor,0 6px 0 rgba(0,0,0,.55),0 0 3px #000;-webkit-text-stroke:3px rgba(0,0,0,.55);paint-order:stroke fill}

.ans.n{color:#ff6574}

/* ставка на столе: сумма и выложенные монеты */
.lotinfo .lp b.bump{display:inline-block;animation:lpbump .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes lpbump{0%{transform:scale(1)}35%{transform:scale(1.55);color:var(--acc)}100%{transform:scale(1)}}
/* монеты, которые можно кинуть в мешочек: подсвечены и подрагивают */
@keyframes coinhot{
  0%,100%{transform:none;filter:drop-shadow(0 0 2px rgba(255,214,90,.55))}
  15%{transform:translateY(-2px) rotate(-8deg)}
  30%{transform:rotate(7deg);filter:drop-shadow(0 0 10px rgba(255,220,100,1))}
  45%{transform:translateY(-1px) rotate(-4deg)}
  60%{transform:none}
}
.pw.hot .coin{animation:coinhot 1.3s ease-in-out infinite;cursor:grab}
.pw.hot .coin:nth-child(2n){animation-delay:.18s}
.pw.hot .coin:nth-child(3n){animation-delay:.36s}
/* ставка лидера торгов, выложенная на стол рядом с его местом */
.stk{display:flex;align-items:flex-end;gap:6px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.6));pointer-events:none}
.seat .stk{position:absolute;top:0;left:-130px;transform:translate(-50%,-50%);z-index:3}
.seat.lft .stk{left:130px}
.stk .pw{gap:0}
.stk .pile{--k:1}

/* меню размена: монетами, без цифр-подсказок */
.sheet.xch{align-items:center;gap:14px;min-width:min(440px,92vw)}
.xgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.xbtn{--k:1.2;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 10px;min-height:76px;background:rgba(255,255,255,.07);color:var(--ink);border:1px solid rgba(255,255,255,.22);border-radius:12px}
.xbtn:not(:disabled):hover{background:rgba(255,183,3,.16);border-color:var(--acc)}
.xbtn .ar{font-size:1.6rem;color:var(--acc);line-height:1}
.xbtn .cg{display:flex;align-items:center}
.xbtn .cg .coin+.coin{margin-left:-8px}
.xbtn .cg.col{flex-wrap:wrap;max-width:112px;justify-content:center;row-gap:2px}

/* кнопка размена: слева у края, поверх руки (карты на лот её больше не закрывают) */
.chgb{position:absolute;left:8px;bottom:calc(var(--hb) + 112px);z-index:9;display:flex;align-items:center;gap:6px;padding:7px 12px 7px 10px;font-size:.85rem;
  background:rgba(10,14,22,.88);border:1px solid rgba(255,255,255,.3);color:var(--ink);border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.45)}
.chgb:hover{border-color:var(--acc)}
.chgb .coin{--k:.62}
.chgb .coin+.ar{margin-left:2px}
.chgb .ar{color:var(--acc);font-size:1.05rem;line-height:1}

.mebar{position:absolute;left:12px;bottom:12px;z-index:8;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:340px;padding:10px 16px 8px;
  background:linear-gradient(180deg,rgba(14,20,32,.9),rgba(8,12,20,.9));border:1px solid rgba(255,255,255,.2);border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.55)}
.mebar .purse{--k:1.45;gap:10px}
.mebar .seal{--k:1.7}
.mebar .pw .pc{font-size:.8rem}
.mebar .mcol{display:flex;flex-direction:column;align-items:center;gap:5px}
.mebar .sum{font-size:2.5rem;font-weight:900;line-height:1;color:var(--acc);text-shadow:0 2px 4px rgba(0,0,0,.75)}
.mebar>.top{justify-content:center;font-weight:800;font-size:1.05rem;text-shadow:0 1px 3px #000}
.mebar.turn{border-color:var(--acc);box-shadow:0 0 16px rgba(255,183,3,.7),0 6px 18px rgba(0,0,0,.55)}

.mebar .top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.mebar .mid{display:flex;align-items:flex-start;gap:16px}
.mebar small{color:var(--mute);font-size:.74rem}
.mebar .chg{padding:2px 8px;font-size:.72rem;font-weight:600}
.hand{position:absolute;bottom:10px;left:0;right:0;height:var(--hh,250px);display:flex;justify-content:center;align-items:flex-end;z-index:5;pointer-events:none}
.hand .card{touch-action:none;pointer-events:auto;transform-origin:50% 100%;transition:transform .2s ease,opacity .18s;cursor:pointer;
  transform:translateY(calc(var(--by,0px) + var(--y,0px))) scale(var(--sc,1));backface-visibility:hidden}
.hand .card::after{content:"";position:absolute;left:0;right:0;top:100%;height:140px}   /* невидимая подложка: карта не теряет наведение, когда выезжает вверх */
.hand.pick .card{--by:0px!important;--y:-56px;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .18s}
.hand.pick .card:not(.sel){animation:cblink 1.1s ease-in-out infinite}
@keyframes cblink{0%,100%{filter:drop-shadow(0 6px 8px rgba(0,0,0,.55))}50%{filter:drop-shadow(0 0 5px var(--acc)) drop-shadow(0 0 16px rgba(255,183,3,.9))}}
.hand .card:hover{--y:-34px;--sc:1.16;z-index:7;filter:drop-shadow(0 14px 14px rgba(0,0,0,.65))}
.hand .card.can{filter:drop-shadow(0 0 4px #6fd3ff) drop-shadow(0 0 10px rgba(111,211,255,.7))}
.hand .card.dim{opacity:.38}
.hand .card.sel{--y:-92px;z-index:8;filter:drop-shadow(0 0 4px var(--acc)) drop-shadow(0 0 12px rgba(255,183,3,.85)) drop-shadow(0 16px 16px rgba(0,0,0,.6))}
.hand.pick .card:hover{--y:-76px}
.hand.pick .card.sel{--y:-92px}
.hand .card.pop{animation:pop .35s}
.hand .card.dragging{opacity:0;pointer-events:none}
.hand .card.away{display:none}
.hand.dragmode .card{--y:0px!important;--sc:1!important;cursor:grabbing}
.hand .card.ret{animation:pop .3s backwards}
.dghost{position:fixed;left:0;top:0;z-index:90;pointer-events:none;transform-origin:50% 50%;transition:scale .14s;filter:drop-shadow(0 18px 16px rgba(0,0,0,.6)) drop-shadow(0 0 8px rgba(255,183,3,.5))}
.sortb{position:absolute;left:8px;bottom:calc(var(--hb) + 40px);z-index:9;display:flex;align-items:center;gap:10px;padding:7px 16px 7px 10px;font-size:.92rem;font-weight:900;line-height:1.1;text-align:left;
  background:linear-gradient(180deg,#ffd84a,#f2a900);color:#2b1c00;border:1px solid #fff2b3;border-radius:12px;
  box-shadow:0 0 0 2px rgba(255,200,40,.3),0 5px 14px rgba(0,0,0,.5),0 0 18px rgba(255,200,40,.45)}
.sortb:hover{filter:brightness(1.08)}
.sortb .bk{width:26px;height:40px;flex:none;border-radius:3px;background:url(cards/back.webp) center/100% 100% no-repeat;box-shadow:0 2px 4px rgba(0,0,0,.5);transform:rotate(-8deg)}
.sortb .bk+.bk{margin-left:-20px;transform:rotate(8deg)}
@keyframes pop{from{opacity:0;filter:brightness(2.2)}to{opacity:1;filter:none}}

.chat{position:absolute;right:12px;bottom:calc(var(--hb) + 22px);width:min(300px,70vw);z-index:6;display:flex;flex-direction:column;gap:4px}
.log{height:min(340px,36vh);overflow:auto;font-size:.88rem;color:#7d8696;background:rgba(6,10,18,.72);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 11px}
.log div{margin:3px 0;line-height:1.3}
.log .c{color:var(--ink);font-weight:700;font-size:.95rem}
.log .c b{font-weight:900;color:var(--pc,var(--acc))}
.chat input{padding:9px 12px;font-size:.92rem}

.toast{position:absolute;left:50%;top:128px;transform:translate(-50%,-10px);z-index:20;max-width:min(560px,92vw);text-align:center;background:rgba(120,20,30,.94);
  border:1px solid #ff8a93;border-radius:12px;padding:10px 18px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}

.modal{position:fixed;inset:0;background:rgba(5,8,14,.8);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.on{display:flex}
.sheet.price{align-items:center;gap:20px;padding:30px 40px;min-width:min(440px,92vw)}
.sheet.price h3{font-size:1.6rem;color:var(--acc)}
.sheet.price p{color:var(--mute);text-align:center}
.price .prow{display:flex;align-items:center;gap:16px}
.price .pnum{width:160px;font-size:3.4rem;font-weight:800;text-align:center;padding:6px;-moz-appearance:textfield}
.price .pnum::-webkit-inner-spin-button,.price .pnum::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

.price .pok{font-size:1.3rem;padding:14px 38px}
.sheet{background:#18202f;border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:18px 22px;max-width:min(900px,96vw);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet h3{margin:0}

.sheet .big{font-size:1.2rem;font-weight:800;color:var(--acc)}
.dlist{display:flex;flex-wrap:wrap;gap:8px;max-width:760px}
.dlist .card{--w:62px}
.dlist .it{position:relative}
.dlist .it .x{position:absolute;right:-4px;top:-4px;background:var(--acc);color:#1a1300;border-radius:999px;font-size:.72rem;font-weight:800;padding:0 6px;z-index:2}

.sheet.rules{width:min(860px,96vw);gap:8px}
.rules h3{font-size:1.4rem}

.rules details[open]{padding-bottom:12px}

.rules p,.rules li{font-size:.92rem;line-height:1.45}
.rules p{margin:6px 0}
.rules ul,.rules ol{margin:6px 0;padding-left:22px}
.rules table{width:100%;margin:8px 0}
.rules th{background:rgba(255,255,255,.06)}
.rules td,.rules th{text-align:left;vertical-align:top}
.rules .box{background:rgba(255,183,3,.1);border-left:3px solid var(--acc);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:.92rem}

  .deck,.disc{width:64px;height:100px;margin:-50px 0 0 -32px}.disc .card{--w:60px}.deck-l,.disc-l{margin-top:58px;font-size:.72rem}
  .fan .b{left:-29px;top:-96px;width:58px;height:90px;transform-origin:29px 112px}

/* ================= итоги ================= */

.fxskip{position:absolute;left:12px;bottom:14px;z-index:4;font-size:.8rem;padding:6px 12px}
.pod{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:auto;padding:6px 0}
.podw{flex:none;font-size:clamp(1.3rem,5vw,2.3rem);font-weight:800;letter-spacing:.14em;color:var(--acc2);text-shadow:0 0 18px rgba(255,200,40,.9),0 4px 10px rgba(0,0,0,.6);opacity:0;text-align:center}
.pr{position:relative;display:flex;align-items:center;gap:14px;flex:none;width:min(560px,92vw);padding:10px 18px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);opacity:0}
