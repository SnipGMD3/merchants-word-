    bar.append(el('div', 'hint', F.ready[me] ? 'Ждём: ' + pend.map(p => p.name).join(', ') : 'Нажали: ' + (S.players.length - pend.length) + ' из ' + S.players.length));
  }
}
async function finReveal(F, tok){
  const row = F.rows.find(r => r.id === F.order[F.idx]); if (!row) return;
  const st = $('fxSt'), head = $('fxHead'); st.innerHTML = ''; head.innerHTML = '';
  const W = st.clientWidth, Hh = st.clientHeight;
  /* 1. сверхкрупное имя, потом уезжает наверх */
  const nmEl = el('div', 'fxname'); nmEl.append(el('small', null, 'Карты игрока'), el('b', null, row.name)); head.append(nmEl);
  const tot = el('div', 'fxtot'); tot.append('Всего:', el('b', null, '0')); tot.style.opacity = 0; head.append(tot);
  const totB = tot.querySelector('b');
  const sc = Math.min(3.4, W * .8 / (nmEl.offsetWidth || 100)), dy = ($('finalX').clientHeight / 2 - 90);
  const big = 'translateY(' + dy + 'px) scale(' + sc + ')';
  fxS('razdacha', .7); fxA(nmEl, [{transform: big, opacity: 0}, {transform: big, opacity: 1, offset: .2}, {transform: big, opacity: 1, offset: .7}, {transform: 'none', opacity: 1}], 2400, {easing: 'ease-in-out'});
  await fxW(2500, tok);
  fxA(tot, [{opacity: 0}, {opacity: 1}], 400);
  /* раскладка */
  const topZ = 136, Hs = Hh - topZ - 6;
  const cw = Math.max(46, Math.min(112, W * .26, (Hs - 16) / 2 / 1.5556)), ch = cw * 1.5556, y1 = topZ, y2 = topZ + ch + 12;
  const posRow = (n, i) => { const step = n < 2 ? 0 : Math.min(cw * 1.12, (W - 24 - cw) / (n - 1)); return (W - (n - 1) * step - cw) / 2 + i * step; };
  const put = (k, x, y) => {
    const c = mkFace({k}); c.classList.add('fxc'); c.style.setProperty('--w', cw + 'px'); c.style.left = x + 'px'; c.style.top = y + 'px';
    fxS('razdacha', .45); st.append(c); fxA(c, [{transform: 'translateY(-70px) scale(1.3) rotate(-6deg)', opacity: 0}, {transform: 'none', opacity: 1}], 300); return c;
  };
  const out = (c, dx, dy2, r, d) => { fxA(c, [{transform: 'none', opacity: 1}, {transform: 'translate(' + dx + 'px,' + dy2 + 'px) rotate(' + r + 'deg) scale(.7)', opacity: 0}], 650, {easing: 'ease-in', delay: reduce ? 0 : d * FX.K}); };
  const cnt = el('div', 'fxcnt'), lab = el('span', 'fxlab'), nw = el('div', 'fxnum'), num = el('b', null, '0'), mul = el('i', 'fxmul');
  nw.append(num, mul); const fpl = el('div', 'fxpl'); fpl.append(lab, nw); cnt.append(fpl); st.append(cnt);
  let total = 0;
  if (!row.groups.length){ lab.textContent = 'Склад пуст'; await fxW(900, tok); }
  /* 2. партии по очереди */
  for (const g of row.groups){
    lab.textContent = prodName(g.prod); num.textContent = '0'; fxA(cnt, [{opacity: 0}, {opacity: 1}], 350); await fxW(450, tok);
    const si = g.si.slice(), pairs = Math.min(g.sp.length, si.length);
    if (g.sp.length){                                                     // испорченные + такие же по числу обычные уходят со стола
      lab.textContent = prodName(g.prod) + ' — порча';
      const gone = [];
      for (let i = 0; i < g.sp.length; i++){ gone.push([put(g.sp[i], posRow(g.sp.length, i), y1), i]); await fxW(230, tok); }
      const outs = si.splice(0, pairs);
      for (let i = 0; i < outs.length; i++){ gone.push([put(outs[i], posRow(g.sp.length, i), y2), i]); await fxW(230, tok); }
      await fxW(600, tok);
      fxS('perebor', .7); gone.forEach(([c, i], j) => { const s = i % 2 ? 1 : -1; out(c, s * (W * .7 + 200), -ch, s * 28, (j % 8) * 70); });
      await fxW(1100, tok); gone.forEach(([c]) => c.remove());
      lab.textContent = prodName(g.prod);
    }
    const n = si.length; let val = tri(n);
    for (let i = 0; i < n; i++){                                          // обычные: число растёт
      put(si[i], posRow(n, i), y1);
      await fxNum(num, tri(i), tri(i + 1), 260, tok); fxPop(num); fxS('postavil', .5); await fxW(130, tok);
    }
    const mults = [...g.ge.map(k => [k, 2]), ...g.ro.map(k => [k, 3])];
    for (let j = 0; j < mults.length; j++){                               // господские ×2, потом королевские ×3
      const [k, m] = mults[j];
      put(k, posRow(mults.length, j), y2); await fxW(500, tok);
      mul.textContent = '×' + m; fxS('pechattake', .8); fxA(mul, [{opacity: 0, transform: 'scale(.3)'}, {opacity: 1, transform: 'scale(1.3)', offset: .6}, {opacity: 1, transform: 'scale(1)'}], 450); await fxW(750, tok);
      await fxNum(num, val, val * m, 850, tok); val *= m; fxPop(num, 1.7); fxS('postavil', .9); fxS('takecoin3', .6, 120); fxA(mul, [{opacity: 1}, {opacity: 0}], 300); await fxW(550, tok);
    }
    fxS('postavil', .8); fxA(nw, [{transform: 'scale(1)'}, {transform: 'scale(1.35)'}, {transform: 'scale(1)'}], 650); await fxW(1000, tok);
    total += val; await fxNum(totB, total - val, total, 500, tok); fxPop(totB, 1.3); fxS('takecoin2', .7);
    fxS('perebor', .7); st.querySelectorAll('.fxc').forEach((c, i) => out(c, fxR(-80, 80), -ch * 2.2, fxR(-20, 20), (i % 10) * 45));
    fxA(cnt, [{opacity: 1}, {opacity: 0}], 500, {delay: reduce ? 0 : 300 * FX.K});
    await fxW(1100, tok); st.querySelectorAll('.fxc').forEach(c => c.remove());
  }
  /* 3. счёт игрока в центре */
  cnt.remove(); fxA(tot, [{opacity: 1}, {opacity: 0}], 300);
  const box = el('div', 'fxscore'), v = el('div', 'v', '0');
  box.append(el('div', 'n', row.name), v, el('div', 't', 'очков')); st.append(box);
  fxS('razdacha', .7); fxA(box, [{opacity: 0, transform: 'scale(.5)'}, {opacity: 1, transform: 'scale(1)'}], 600, {easing: 'cubic-bezier(.2,1.3,.4,1)'});
  await fxW(500, tok); await fxNum(v, 0, total, 1300, tok); fxPop(v, 1.15); fxS('pechattake', .9); fxS('takecoin3', .8, 150); await fxW(500, tok);
  FX.done = true; finUI();
}
async function finPodium(F, tok){
  const st = $('fxSt'), head = $('fxHead'); st.innerHTML = ''; head.innerHTML = '';
  const W = st.clientWidth;
  const t = el('div', 'fxname'); t.append(el('small', null, 'Ярмарка закрыта'), el('b', null, 'Итоги')); head.append(t);
  fxA(t, [{opacity: 0, transform: 'translateY(-20px)'}, {opacity: 1, transform: 'none'}], 600);
  const pod = el('div', 'pod'), lab = el('div', 'podw', F.winners.length > 1 ? 'Лучшие Негоцианты!' : 'Лучший Негоциант!'); pod.append(lab);
  const tots = F.rows.map(r => r.total), tMin = Math.min(...tots), tMax = Math.max(...tots);
  const rows = F.rows.map(r => {
    const d = el('div', 'pr'), n2 = el('span', 'nm2', r.name), pt = el('span', 'pt', String(r.total));
    const k = tMax === tMin ? 1 : (r.total - tMin) / (tMax - tMin);                // чем больше очков, тем ярче цифра
    pt.style.color = 'hsl(' + Math.round(30 - 10 * k) + ',' + Math.round(22 + 78 * k) + '%,' + Math.round(33 + 12 * k) + '%)';
    if (k > .97) pt.style.textShadow = '0 0 10px rgba(255,120,0,.55)';
    n2.append(el('small', null, 'монет: ' + r.coins)); pt.append(el('small', null, 'очков'));
    d.append(el('span', 'pl', String(r.place)), n2, pt); pod.append(d); return d;
  });
  st.append(pod); await fxW(900, tok);
  let fanfare = false;
  for (let i = rows.length - 1; i >= 0; i--){                           // от последнего места к первому
    const d = rows[i], win = F.winners.includes(F.rows[i].id), s = i % 2 ? 1 : -1;
    if (win) await fxW(500, tok);
    fxS('razdacha', .7); fxA(d, [{opacity: 0, transform: 'translateX(' + s * (W + 300) + 'px) rotate(' + s * 10 + 'deg) scale(.8)'}, {opacity: 1, transform: 'none'}], win ? 950 : 700, {easing: 'cubic-bezier(.2,1.25,.4,1)'});
    await fxW(win ? 950 : 700, tok);
    if (win){
      d.classList.add('gold'); fxS('pechattake', .9); fxS('takecoin3', .8, 200);
      if (!fanfare){ fanfare = true; fxS('win', 1); }                    // фанфары в момент, когда победитель вспыхивает золотом
      for (let q = 0; q < 16; q++){
        const sp = el('i', 'spark', '★'); sp.style.setProperty('--dx', fxR(-260, 260).toFixed(0) + 'px'); sp.style.setProperty('--dy', fxR(-80, 80).toFixed(0) + 'px');
        sp.style.setProperty('--d', fxR(0, 1.6).toFixed(2) + 's'); sp.style.setProperty('--sz', fxR(0, 1).toFixed(2)); d.append(sp);
      }
      fxA(d, [{transform: 'scale(1)'}, {transform: 'scale(1.08)'}, {transform: 'scale(1)'}], 550);
    }
    await fxW(i ? 450 : 350, tok);
  }
  fxA(lab, [{opacity: 0, transform: 'scale(.4)'}, {opacity: 1, transform: 'scale(1.25)', offset: .6}, {opacity: 1, transform: 'none'}], 800);
  await fxW(1000, tok); FX.done = true; finUI();
}

  s.innerHTML = '<h3>Памятка купца</h3>' +

/* подсветка карт, которые сейчас можно выбрать (Крыса, Ревизор) */

    const mid = {x: (from.x + to.x) / 2, y: (from.y + to.y) / 2};
    const dur = reduce ? 1 : 650, delay = reduce ? 0 : i * 70;
    const a = f.animate([{transform: T(from, 1), offset: 0}, {transform: T(mid, 1.25, 50), offset: .5}, {transform: T(to, .85), offset: 1}], {duration: dur, delay, easing: 'ease-in-out', fill: 'both'});
    const fin = () => f.remove(); a.onfinish = fin; setTimeout(fin, dur + delay + 300);
  });
}
function fly(o){
  const f = el('div', 'fly');
  if (o.face) f.append(mkFace(o.face));
  f.append(el('div', 'back bk'));
  document.body.append(f);
  const T = (p, s, r, ry, lift) => 'perspective(900px) translate(' + (p.x - 45) + 'px,' + (p.y - 70 - (lift || 0)) + 'px) rotate(' + r + 'deg) rotateY(' + ry + 'deg) scale(' + s + ')';
  const ry0 = o.toBack ? 0 : ((!o.face || o.flip) ? 180 : 0), ry1 = o.toBack ? 180 : (o.face ? 0 : 180);
  const mid = {x: (o.from.x + o.to.x) / 2, y: (o.from.y + o.to.y) / 2};
  const kf = [
    {transform: T(o.from, o.s0, o.r0 || 0, ry0, 0), offset: 0},
    {transform: T(mid, Math.max(o.s0, o.s1) * 1.12, ((o.r0 || 0) + (o.r1 || 0)) / 2, (o.flip || o.toBack) ? 90 : ry0, 70), offset: .5},
    {transform: T(o.to, o.s1, o.r1 || 0, ry1, 0), offset: 1}
  ];
  const dur = reduce ? 1 : (o.dur || 600), delay = reduce ? 0 : (o.delay || 0);
  const a = f.animate(kf, {duration: dur, delay, easing: 'cubic-bezier(.25,.7,.25,1)', fill: 'both'});
  let ended = false;
  const fin = () => { if (ended) return; ended = true; f.remove(); o.done && o.done(); };
  a.onfinish = fin; setTimeout(fin, dur + delay + 300);
}

let BOTS = false, botTimer = 0;
const BOT_NAMES = ['Бот Гриша', 'Бот Маша', 'Бот Петя', 'Бот Ульяна'];
function botLobby(n){
  TEST = false; BOTS = true; isHost = true; peer = null; code = 'БОТЫ';
  S = newState(); H = newH();
  S.players = [mkPlayer('host', myName(), true)];
  for (let i = 0; i < n; i++) S.players.push(mkPlayer('bot' + (i + 1), BOT_NAMES[i]));
  enterLobby(); commit();
  clearInterval(botTimer); botTimer = setInterval(botTick, 800);

function botTick(){
  if (!BOTS || !isHost){ clearInterval(botTimer); return; }
  if (S.phase === 'over'){
    const F = S.final;
    if (F && F.stage === 'reveal') S.players.forEach(p => { if (String(p.id).startsWith('bot') && !F.ready[p.id]) hostReceive({peer: p.id, send(){}}, {t:'fcont'}); });
    return;
  }
  if (S.phase !== 'game') return;
  S.players.forEach(p => { if (String(p.id).startsWith('bot')) botAct(p); });
}
/* простейший бот: берёт всё, что положено; торгует наугад; ничего не спрашивает и Печать не использует */
function botAct(b){
  const id = b.id, say = m => hostReceive({peer: id, send(){}}, m), h = hand(id), mine = S.turn === id;
  switch (S.step){
    case 'take': {
      const t = S.todo && S.todo[id]; if (!t) return;
      if (t.l.cards > 0) say({t:'take', what:'card'});
      else if (t.l.coins > 0) say({t:'take', what:'coinsAuto'});
      else if (t.l.seal > 0) say({t:'take', what:'seal'});
      return;
    }
    case 'compose': {
      if (!mine || h.length < 3) return;
      const ids = H.tut ? h.filter(c => c.k === 'bread').slice(0, 3).map(c => c.id) : h.map(c => c.id).sort(() => Math.random() - .5).slice(0, 3);
      return say({t:'lot', ids, price: H.tut ? 1 : 2 + (Math.random() * 6 | 0)});
    }
    case 'showcase': return mine && say({t:'showcase', i:-1});
    case 'inspect': return mine && say({t:'insp', a:'skip'});
    case 'answer': return mine && say({t:'answer', yes: Math.random() < .5});
    case 'openpick': { if (!mine) return; const i = S.lot.cards.findIndex(c => !c.open); return say({t:'openpick', i}); }
    case 'auction': {
      if (!mine) return;
      const min = minBid();
      if (H.tut) return b.coins >= min ? say({t:'bid', amount:min}) : say({t:'pass'});
      if (b.coins >= min && Math.random() < (S.auction.by === null ? .6 : .3)) say({t:'bid', amount: min});
      else say({t:'pass'});
      return;
    }
    case 'pay': {
      if (!mine) return;
      const amt = S.pay.amount;
      for (let g = 0; g < 40 && !findExact(b.purse, amt); g++){ if (b.purse[10] > 0) say({t:'change', op:'b10'}); else if (b.purse[5] > 0) say({t:'change', op:'b5'}); else break; }
      const f = findExact(b.purse, amt); return f && say({t:'pay', coins: f});
    }
    case 'takelot': { if (!mine) return; const i = S.lot.cards.findIndex(c => !c.taken); return i >= 0 && say({t:'takelot', i}); }
    case 'cat': return mine && say({t:'cat', use: true});
    case 'rat': {
      if (!mine) return;
      const prod = S.info.prods[0], ids = h.filter(c => isGood(c) && CARDS[c.k].prod === prod).slice(0, S.info.need).map(c => c.id);
      return say({t:'ratpick', ids});
    }
    case 'buy': return mine && say({t:'buy', stop:true});
    case 'return': return mine && say({t:'ret'});
  }
}

<div class="box"><b class="h">Последний ярмарочный день</b>В последний день игроки не получают карты при утреннем подвозе и торгуют тем, что уже есть на складах. Утром каждый получает 5 монет. Бесплатная карта продавцу за успешную продажу сохраняется; продавец также может купить до 2 дополнительных карт по 4 монеты за каждую.</div>
</details>

<details><summary>4. Торговый ход: от лота до торгов</summary>
<ol>
<li><b>Выложите лот.</b> Выберите из своего склада ровно 3 карты любых типов и положите их закрытыми в ряд в центре стола. Позиции считаются слева направо: 1, 2, 3.</li>
<li><b>Откройте витрину (по желанию).</b> Бесплатно переверните одну карту лота лицом вверх, чтобы привлечь покупателей. Закрыть её обратно нельзя.</li>
<li><b>Назовите цену.</b> Назовите стартовую цену — целое число монет, не меньше 1. После этого менять её нельзя.</li>
<li><b>Проведите осмотр.</b> Начиная с левого соседа продавца, каждый покупатель может один раз за этот лот выполнить одно действие осмотра или пропустить его.</li>
<li><b>Проведите торги.</b> Покупатели по очереди называют ставки или пасуют.</li>
<li><b>Проведите развязку.</b> Лот передаётся победителю торгов в закрытую. Затем применяются эффекты специальных карт, если они есть.</li>
</ol>
<p><b>Варианты осмотра лота</b></p>
<table><tr><th>Действие</th><th>Цена</th><th>Что даёт</th></tr>
<tr><td>Слухи</td><td>Бесплатно, в любой момент</td><td>Любой игрок, включая продавца, может говорить о лоте что угодно. Врать разрешено.</td></tr>
<tr><td>Расспрос</td><td>2 монеты продавцу</td><td>Выберите один вопрос о содержимом лота из списка (направление, потом уточнение). Игра сама определяет по картам лота, «да» это или «нет», и продавцу остаётся только нажать единственную кнопку с правдивым ответом.</td></tr>
<tr><td>Вскрытие</td><td>3 монеты продавцу</td><td>Выберите одну закрытую карту и откройте её для всех. За один лот можно провести только одно Вскрытие.</td></tr>
<tr><td>Ревизор</td><td>Сбросить карту Ревизора</td><td>Тайно посмотрите все три карты лота. Никому их не показывайте. Это действие осмотра.</td></tr></table>
<div class="box"><b class="h">Какие вопросы можно задать при Расспросе?</b>Направления: Напасть (Крыса, Вредитель — каждый по названию, две Напасти), Испорченный товар (любой или конкретный), Особый товар (господский или королевский, любой или конкретный), Конкретный товар (простой, господский, королевский, испорченный), Помощник (Кот, Ревизор), Состав лота (все три одного товара, есть пара, только простые, без Напастей и порчи). Можно спросить обобщённо или нажать на направление и уточнить вопрос.</div>
</details>

<details><summary>5. Торги, Печать и развязка</summary>
<p><b>Как проходят торги</b></p>
<ol>
<li>Первым ходит левый сосед продавца. Далее покупатели действуют по кругу.</li>
<li>В свой ход игрок либо называет ставку, либо пасует.</li>
<li>Первая ставка должна быть не меньше цены, которую назвал продавец. Каждая следующая ставка — минимум на 1 монету выше предыдущей. (Особое правило Печати купца описано ниже.)</li>
<li>Нельзя ставить больше монет, чем у вас есть. Продавец в торгах не участвует и свой лот купить не может.</li>
<li>Игрок, который спасовал, больше не участвует в торгах за этот лот.</li>
<li>Торги заканчиваются, когда все, кроме игрока, сделавшего последнюю ставку, спасовали. Он выигрывает и платит свою ставку.</li>
<li>Если никто не сделал ставку, лот не продан.</li>
</ol>
<p><b>Печать купца</b></p>
<ul>
<li>У каждого игрока одна Печать на всю игру.</li>
<li>Покупатель может использовать её в любой момент после первой ставки: сказать «Продано!» — торги сразу заканчиваются.</li>
<li>После первой ставки покупатель может сказать «Продано!» и сразу забрать лот. Он платит последнюю ставку, но не меньше 10 монет: если ставка меньше 10, доплачивает до 10; если 10 или больше — платит ровно последнюю ставку. Дополнительных 10 монет сверху нет.</li>
<li>Использованная Печать сбрасывается. Её нельзя передавать, продавать или дарить. Неиспользованная Печать в конце игры очков не даёт.</li>
</ul>
<p><b>Что происходит после торгов</b></p>
<table><tr><th>Исход</th><th>Что происходит с картами и деньгами</th></tr>
<tr><td>Лот продан</td><td>Победитель платит ставку продавцу и забирает все 3 карты на склад, не показывая их остальным.</td></tr>
<tr><td>В лоте есть Напасть</td><td>Покупатель может сыграть Кота. Если Напасть не отменена, она срабатывает сразу: сначала Вредители, затем Крысы. Сработавшая Напасть уходит в сброс.</td></tr>
<tr><td>Лот не продан</td><td>Все товары лота, включая испорченные, открыто уходят в сброс. Они считаются испортившимися. Специальные карты — Крысы, Вредители, Коты и Ревизоры — возвращаются в руку продавцу и ничего не делают.</td></tr></table>
<p>После развязки ход продавца заканчивается. Следующим продавцом становится игрок по часовой стрелке.</p>
</details>

<details><summary>6. Эффекты специальных карт</summary>
<p><b>Испорченные товары</b></p>
<ul>
<li>Каждая испорченная карта уменьшает на 1 число простых карт соответствующего товара при подсчёте очков.</li>
<li>Господские и королевские карты не портятся.</li>
<li>Сама испорченная карта очков не приносит.</li>
</ul>
<p><b>Напасти</b></p>
<table><tr><th>Напасть</th><th>Эффект при покупке</th></tr>
<tr><td>Крыса</td><td>Покупатель сам выбирает любые 2 карты из своей самой большой партии: простые, господские, королевские или испорченные. Выбранные карты и Крыса уходят в сброс.</td></tr>
<tr><td>Вредители (6 видов)</td><td>Партия соответствующего товара замешивается в колоду, Вредитель уходит в сброс.</td></tr></table>
<div class="box"><b class="h">Когда Напасть срабатывает?</b>Только в момент покупки лота. Если Напасть пришла при начальной раздаче, утреннем или вечернем подвозе либо вернулась продавцу из непроданного лота, она не срабатывает. Её можно выставить в лоте.</div>
<div class="box"><b class="h">Как определить самую большую партию для Крысы</b>Сравните общее количество карт в каждой партии. Если карт поровну, выбирайте партию, которая дороже.</div>
<p><b>Помощники</b></p>
<table><tr><th>Помощник</th><th>Как использовать</th></tr>
<tr><td>Кот</td><td>Отменяет одну Напасть, если попалась при покупке; обе карты идут в сброс. Кота можно выставлять в лоте. Если Кот и Напасть попались вместе в одном лоте, Кот может сразу отменить эту Напасть.</td></tr>
<tr><td>Ревизор</td><td>Во время этапа осмотра сбросьте Ревизора и тайно посмотрите все три карты лота. Это считается вашим действием осмотра.</td></tr></table>
</details>

<details><summary>7. Подсчёт богатства и победа</summary>
<p>Игра заканчивается после вечернего торга последнего дня, когда последний продавец завершил свой ход. Затем все игроки открывают свои склады и считают стоимость партий.</p>
<p><b>Как посчитать стоимость одного товара</b></p>
<ol>
<li>Посчитайте простые карты этого товара.</li>
<li>Вычтите по 1 за каждую испорченную карту этого товара. Результат не может быть меньше нуля. Полученное число — размер партии n.</li>
<li>По таблице найдите базовую стоимость партии (1 → 1, 2 → 3, 3 → 6, 4 → 10, 5 → 15, 6 → 21, 7 → 28, 8 → 36, 9 → 45, 10 → 55).</li>
<li>Умножьте её на 2 за каждую господскую карту и на 3 за каждую королевскую карту этого товара. Множители перемножаются.</li>
</ol>
<p><b>Кто побеждает</b></p>
<ul>
<li>Сложите стоимость всех шести товарных партий. Игрок с наибольшим богатством побеждает.</li>
<li>При ничьей побеждает игрок с большим количеством монет.</li>
<li>Если монет поровну — игрок с большим количеством простых карт на складе.</li>
<li>Если и простых карт поровну, победа делится.</li>
</ul>
</details>

function tutRects(){

    let v = typeof h === 'function' ? h() : h;
    if (v && v.list){ v.list.forEach(one); return; }
    if (typeof v === 'string') v = [...document.querySelectorAll(v)];

  await until(() => S.step !== 'rat'); tutHide(); TUT.hl = [];
  await tutSleep(5200);

  /* --- напасть и кот --- */
  const pestK = 'pest_silk';
  tutGive(me, pestK); emit('draw', {by: me, n: 1}); commit(); await tutSleep(1800);
  await say('Да чтож такое! Невезуха твое второе имя? Это же ' + CARDS[pestK].name + '! Весь товар «' + prodName('silk') + '» идет коту под хвост... Кот! Точно, товар еще можно спасти!', {hl:[() => handEls(d => d.k === pestK)]});
  tutGive(me, 'cat'); emit('draw', {by: me, n: 1}); commit(); await tutSleep(1800);
  { const c = hand(me).find(x => x.k === pestK); H.res = {buyer: me, naps: [c], ci: 0, queue: []}; H.tut.after = () => { S.step = null; S.turn = null; S.info = null; H.res = null; }; catPhase(); commit(); }
  await until(() => S.step === 'cat' && S.turn === me);
  await say('Всего лишь у тебя на руках должен находиться "Кот" он нейтрализует любую выпавшую напасть и уходит вместе с ней в сброс.', {hl:['#act', () => handEls(d => d.kind === 'cat')], next:false});
  await until(() => S.step !== 'cat'); TUT.hl = []; tutHide();
  await tutSleep(5200);
  await say('Не переживай, если ты подобрал напасть из колоды - твой товар не пострадает, теперь это твое оружие против других купцов. Также, если ты не смог продать напасть, тоже не переживай, она вернётся тебе в руку и ты снова сможешь попытаться её втюхать');

  /* --- ревизор --- */
  tutGive(me, 'auditor'); emit('draw', {by: me, n: 1}); commit(); await tutSleep(1800);
  await say('О! Ревизор, ты что, подкупил охрану? Теперь, когда придёт время смотреть чужой товар, можешь ею воспользоваться и тайно подсмотреть, что же запрятано в лоте!', {hl:[() => handEls(d => d.kind === 'auditor')]});

  /* --- старт: 20 монет и печать --- */
  await say('Ну, купцы тебя уже заждались, скорее бери начальные 20 монет и печать купца, и начнём же игру!', {hl:['#bank'], next:false});
  setTodo({host: {coins: 20, seal: 1}, bot1: {coins: 20, seal: 1}}, beginDay, 'Раздача'); commit();
  await until(() => { const t = myTodo(); return !t || !t.coins; });
  TUT.hl = ['#sealPile'];
  await until(tutTodoDone);

  /* --- продаём --- */
  await until(() => S.step === 'compose' && S.turn === me);
  let stage = '';
  const stg = (k, text, hl) => { if (stage !== k){ stage = k; say(text, {hl, next:false}); } };
  await until(() => {
    if (S.step !== 'compose' && S.step !== 'price') return true;
    if ($('priceM').classList.contains('on')) stg('p', 'Цена это минимум, с которого начнутся торги. Назови её и жми «Назвать цену».', ['#priceS']);
    else if (S.step === 'price') stg('n', 'Карты на столе, их уже видят все. Расскажи купцам о товаре, а когда будешь готов - жми «Назвать цену».', ['#act']);
    else if (placed.every(x => x != null)) stg('g', 'Не дурно, жми выставить.', ['#lotgo']);
    else stg('c', 'Гляди, ты сейчас продавец. Выбери три любые карты своего товара и выложи на платок - это то, что ты продаешь.', ['#hand', '#slots']);
    return false;
  });
  await say('Но мало кто захочет покупать товар вслепую. Ты можешь бесплатно открыть витрину - одну карту лота. Заманивай покупателей. Ну или можешь не открывать, кнопка "Без витрины" тоже сойдёт', {hl:['#slots', '#act'], next:false});
  await until(() => S.step !== 'showcase');
  tutHide(); TUT.hl = [];
  await until(() => { const t = myTodo(); return t && t.cards > 0 && S.takeTitle === 'Карта за продажу'; });
  await say('За продажу бесплатная карта. Бери из колоды.', {hl:['#deck'], next:false});
  await until(tutTodoDone);
  tutHide(); TUT.hl = [];
  await until(() => S.step === 'buy' && S.turn === me);
  TUT.bigTry = false;
  const buying = () => live() && S.step === 'buy' && S.turn === me;
  const canPay4 = () => !!findExact(freePurse(), 4);
  await Promise.race([say('Докупка. Карта стоит 4 монеты, взять можно до двух. Кидай монеты в мешочек. Или жми «Отказаться», если жалко.', {hl:['#act', '#mebar']}), until(() => !buying()), until(() => TUT.bigTry && !TUT.typing && buying())]);
  if (buying() && !canPay4()) await tutChange(canPay4, buying, true);
  TUT.bigTry = false;
  let ph = '';
  await until(() => {
    const t = myTodo();
    const p = buying() ? 'b' : (S.step === 'take' && t && (t.cards || t.coins || t.seal)) ? 't' : '';
    if (p !== ph){ ph = p; if (p === 'b'){ tutHide(); TUT.hl = ['#act', '#mebar']; } else if (p === 't'){ tutHide(); TUT.hl = ['#deck']; } }
    return !p;
  });
  tutHide(); TUT.hl = [];

  /* --- покупаем лот бота --- */
  await until(() => S.step === 'inspect' && S.turn === me && S.seller !== me);
  await tutChange(() => meP().purse[1] >= 7, () => live() && S.step === 'inspect', false, 'Для расспроса и вскрытия нужна мелочь: поменяй ещё.');
  await say('Теперь ты покупатель. У тебя есть несколько платных действий, давай по порядку.', {hl:[() => actBtn('Расспрос')], next:false});
  await until(() => ui.mode === 'ask');
  await say('Это расспрос, заплатив купцу честные две монеты, тот обязан ответить честно, но лишь "Да" или "Нет". Давай-ка узнаем, есть ли в лоте напасть', {hl:[() => actBtn('Напасть')], next:false});
  await until(() => ui.qpath.length > 0 || ui.qsel);
  if (!ui.qsel){
    await say('Спрашивай, что хочешь. Просто спросить про напасть, или что-то конкретное? – Выбор за тобой.', {hl:['#act'], next:false});
    await until(() => ui.qsel);
  }
  tutHide(); TUT.hl = ['#act', '#mebar']; TUT.holdAns = true; TUT.place = 1;
  await until(() => TUT.ans);
  await say('Купец честно ответил, только этот ответ слышали все за столом. Теперь решай, покупать или нет.', {hl:[() => TUT.ans]});
  if (TUT.ans){ TUT.ans.remove(); TUT.ans = null; } TUT.holdAns = false;
  await until(() => S.step === 'inspect' && S.turn === me);
  await say('Ай нет, я еще тут не договорил, теперь объясню "Вскрытие".', {hl:[() => actBtn('Вскрытие')], next:false});
  await until(() => ui.mode === 'open');
  tutHide(); TUT.hl = ['#act', '#mebar'];
  await until(() => S.step === 'openpick');
  await say('Можешь открыть одну из карт, но её увидят все, всё просто.', {hl:['#slots'], next:false});
  await until(() => S.step === 'inspect' && S.turn === me);
  await say('Конечно, самое лучшее, это когда у тебя есть Ревизор. Им ты можешь увидеть все карты в лоте', {hl:[() => actBtn('Ревизор')], next:false});
  await until(() => ui.mode === 'auditor');
  TUT.hl = ['#act', () => handEls(d => d.kind === 'auditor')]; TUT.place = 1;
  await until(() => S.step === 'auction');
  await say('Ладно с этими осмотрами. Цена лота всего одна монета, смотри! Кидай скорее её в мешочек и жми «Ставка».', {hl:['#act', '#mebar'], next:false});
  await until(() => S.step === 'pay' && S.turn === me);
  await say('Ого, удивительно, но ты сразу выиграл торги, поздравляю! Теперь плати.', {hl:['#act', '#mebar'], next:false});
  await until(() => S.step === 'takelot');
  await say('Лот твой, забирай карты', {hl:['#slots'], next:false});
  await until(() => S.step !== 'takelot');
  tutHide(); TUT.hl = [];

  /* --- вечер, утро, староста --- */
  await until(() => S.round === 'e');
  await say('Время убегает. Уже вечер, а это означает что? Вечерний подвоз, конечно!', {hl:['#dayinfo .daypl']});
  H.tut.eve(); commit();                                                  // карты можно брать только теперь
  await say('Бери 2 карты из колоды, это вечерний подвоз. Каждый вечер, кроме последнего дня, ты будешь добирать по 2 карты', {hl:['#deck'], next:false});
  await until(() => !!H.tut.next); tutHide(); TUT.hl = [];
  await say('Что в последнем? Кризис, милок. Торговать придётся чем есть.');
  { const f = H.tut.next; H.tut.next = null; f(); commit(); }              // наступает утро второго дня
  await until(() => S.round === 'm' && S.day === 2); tutHide();
  await say('После еще одного круга пришло утро. Время скоротечно, но наступил новый день, а значит время "Утреннего подвоза".', {hl:['#dayinfo .daypl']});
  await say('Утром вам платят за работу, так что каждый утренний подвоз по мимо двух карт ты будешь получать по 5 монет, монеты придут даже в последний день.', {hl:['#bank', '#deck'], next:false});
  await until(() => !myTodo() || tutTodoDone());
  tutHide(); TUT.hl = [];
  await until(() => S.step === 'tutend');
  await say('Новый день - новый староста! Староста начинает первым. Не переживай, каждый успеет им побыть.', {hl:['#dayinfo .sgn']});
  await say('Чуть не забыл! Печать купца.', {hl:[() => $('mebar').querySelector('.seal') || $('mebar')]});
  await say('Используй её когда хочешь, если ты не продавец. Заберешь лот мгновенно. Только... Один нюанс, дешево забрать не получится, минимум - 10 деревянных. Если использовал на ставке ниже, разница покроется из твоего кармана, учти.', {hl:[() => $('mebar').querySelector('.seal') || $('mebar')]});
  await say('Ну, основы ты понял. Дальше уже не моя забота, возвращайся в меню и покажи, кто самый главный торгаш!');
  await say('И помни, в этой игре самое важное - это общение. Хвали свой товар, лги, клянись прадедом, что товар хороший. Коммуникация, вот в чём главный секрет «Честное Купеческое!». Удачи на ярмарке!', {next:'В меню'});
  tutStop(); leave();
}
function tutStart(){
  if (!needName()) return;
  botLobby(1); S.players[1].name = 'Оборванец'; startGame();
  try{ localStorage.setItem('kup_tutseen', '1'); }catch(e){}
  S.todo = null; H.next = null; S.step = null; S.turn = null; S.takeTitle = ''; S.starost = 'host';
  H.tut = {after: null};
  ['bread', 'bread', 'bread', 'apple', 'apple', 'pepper'].forEach(k => tutGive('bot1', k));
  commit();
  clearInterval(TUT.tm); TUT.on = true; TUT.run++; TUT.hl = []; TUT.key = ''; TUT.ans = null; TUT.holdAns = false; TUT.keepPg = false;
  TUT.tm = setInterval(tutLoop, 80);
  tutScript().catch(e => console.error(e));
}
function tutStop(){
  TUT.on = false; TUT.run++; clearInterval(TUT.tm); clearTimeout(TUT.ty); TUT.typing = false; TUT.tm = 0; TUT.hl = [];
  $('tut').classList.remove('on', 'top'); $('tutShield').classList.remove('on'); $('tutShield').style.clipPath = ''; $('tutFrames').innerHTML = '';
  if (TUT.ans){ TUT.ans.remove(); TUT.ans = null; }
}
$('tutBtn').onclick = tutStart;
try{ if (!localStorage.getItem('kup_tutseen')) $('tutBtn').classList.add('glow'); }catch(e){ $('tutBtn').classList.add('glow'); }
$('tutSkip').onclick = () => { tutStop(); leave(); };

/* ---------- Заставка при открытии сайта: за 0,5 с до конца затухает, главное меню под ней проявляется; тап — пропустить ---------- */
(function(){
  const box = $('intro'), v = $('introV'); let done = false;
  const finish = () => { if (done) return; done = true; box.classList.add('out'); musStart(); setTimeout(() => box.remove(), 700); };
  v.addEventListener('playing', () => { if (v.duration) setTimeout(finish, Math.max(0, (v.duration - v.currentTime - .5) * 1000)); }, {once: true});
  v.addEventListener('ended', finish); v.addEventListener('error', finish);
  box.addEventListener('pointerdown', finish);
  const r = v.play();
  if (r && r.catch) r.catch(() => { v.muted = true; v.play().catch(finish); });   // автозапуск со звуком запрещён — играем без звука
  setTimeout(finish, 9000);
})();
</script>
